<style>
/* =====================================================================
   MBA406 · Jeopardy for the room screen (5 Nov 2026). Weeks 1–5 of
   Managerial Finance: the statements and ratios, the time value of
   money, capital budgeting, the cost of capital, valuation, and a last
   column on the Atelier Rochat case itself. Engine copied from
   UMEF/gen110/jeopardy.html (6 columns × 5 values, players A–F, scores in
   this browser only: mba406_jeo_w15). Projector page: no progress, no
   sign-in, never counted. Colours are the MBA406 deck's (SUMAS greens).
   Every number is the week pages' own, recomputed in Python on 5 Nov 2026.
   Five students: five players, the sixth card is spare.
   ===================================================================== */
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:"Helvetica Neue",Helvetica,Arial,sans-serif;background:linear-gradient(160deg,#2C5530,#1A2B1C);color:#fff;min-height:100vh;}
.top{display:flex;align-items:center;gap:14px;padding:14px 20px;}
.top h1{font-family:Georgia,serif;font-size:24px;}
.top .sub{color:#C9E4C5;font-size:13px;}
.top a{color:#C9E4C5;font-size:13px;text-decoration:none;margin-left:auto;}
.board{display:grid;grid-template-columns:repeat(6,1fr);gap:8px;padding:0 20px;}
.cat{background:#163A1A;border-radius:10px;padding:12px 8px;text-align:center;font-weight:800;font-size:clamp(11px,1.4vw,16px);min-height:64px;display:flex;align-items:center;justify-content:center;text-transform:uppercase;letter-spacing:.5px;}
.cat.own{background:#7A3E0E;}
.cell{background:#3D7A33;border:none;border-radius:10px;color:#FFD58A;font:800 clamp(20px,3.2vw,40px)/1 Georgia,serif;min-height:clamp(60px,11vh,110px);cursor:pointer;transition:.15s;}
.cell:hover{background:#4A8B3A;}
.cell.used{background:rgba(255,255,255,.06);color:rgba(255,255,255,.18);cursor:default;}
.teams{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;padding:18px 20px 30px;}
.team{background:rgba(255,255,255,.08);border-radius:12px;padding:10px 16px;text-align:center;min-width:150px;}
.team input{background:transparent;border:none;border-bottom:1px dashed rgba(255,255,255,.35);color:#fff;font:800 15px inherit;text-align:center;width:100%;}
.team .sc{font:800 34px Georgia,serif;color:#FFD58A;margin-top:4px;}
#modal{position:fixed;inset:0;background:rgba(20,35,22,.96);display:none;align-items:center;justify-content:center;padding:30px;z-index:10;}
#modal.on{display:flex;}
#modal .box{max-width:1000px;width:100%;text-align:center;}
#modal .mc{color:#C9E4C5;font-size:15px;letter-spacing:2px;text-transform:uppercase;font-weight:800;}
#modal .mq{font:700 clamp(22px,3.3vw,40px)/1.25 Georgia,serif;margin:20px 0 26px;}
#modal .ma{display:none;font-size:clamp(17px,2.1vw,25px);color:#FFD58A;line-height:1.4;margin-bottom:26px;}
#modal .ma.on{display:block;}
.mb{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;}
.mb button{background:#fff;color:#2C5530;border:none;border-radius:30px;padding:10px 16px;font:800 14px inherit;cursor:pointer;}
.mb button.ok{background:#2F855A;color:#fff;} .mb button.no{background:#9B2335;color:#fff;} .mb button.gh{background:transparent;color:#fff;border:1px solid rgba(255,255,255,.5);}
.foot{text-align:center;font-size:12px;color:#C9E4C5;padding-bottom:20px;}
.foot button{background:none;border:none;color:#C9E4C5;text-decoration:underline;cursor:pointer;font:inherit;}
</style>

<body data-course="mba406">
<div class="top"><h1>Jeopardy</h1><span class="sub" id="setName"></span><a href="index.html">← Course page</a></div>
<div class="board" id="board"></div>
<div class="teams" id="teams"></div>
<div class="foot">Click a cell · "Answer" · then the player who answered, right (+) or wrong (−). Player names can be edited. All amounts in CHF 000 unless stated. <button id="reset">New game</button></div>
<div id="modal"><div class="box"><div class="mc" id="mC"></div><div class="mq" id="mQ"></div><div class="ma" id="mA"></div><div class="mb" id="mB"></div></div></div>
<script>
var SETS={
  w15:{name:'Weeks 1–5 · the statements, the time value of money, projects, the cost of capital, valuation',cats:[
    ['Week 1 · The three statements',[
      ['Which of the three financial statements is a picture at one date ("as at 31 December"), and which two cover a period?','The balance sheet is at one date. The income statement and the cash-flow statement cover the year.'],
      ['Rochat delivers CHF 50,000 of furniture in December and is paid in February. How much revenue does December\'s income statement show, and where does the amount sit until February?','50 of revenue in December: revenue is recorded when the work is delivered (accrual accounting). Until February it sits in receivables on the balance sheet.'],
      ['Rochat\'s current assets are 840 and its current liabilities 400; inventory is 350. Give the current ratio and the quick ratio.','Current ratio 840 ÷ 400 = 2.10. Quick ratio (840 − 350) ÷ 400 = 490 ÷ 400 = 1.23: the same test without the inventory, which is the slowest asset to turn into cash.'],
      ['Rochat\'s net margin is 10%, its asset turnover 1.2 and its equity multiplier 2.0. Give the return on equity and the name of this decomposition.','ROE = 0.10 × 1.2 × 2.0 = 24%. The DuPont decomposition: margin × turnover = ROA (12%), × the multiplier for the owners\' leverage.'],
      ['In 2025 Rochat earned 240 of profit, yet its cash fell from 150 to 90. Name the two cash outflows that explain the gap, with their amounts.','The router, capital expenditure of 280, and the dividend of 70. Operating cash flow was 230 (receivables up by 100 held back some of the profit); 230 − 280 − 70 + 60 drawn on the bank line = −60.']
    ]],
    ['Week 2 · Time value of money',[
      ['CHF 1,000 is invested for two years at 5% a year, interest on interest. What is it worth at the end?','1,000 × 1.05² = 1,102.50. The extra 2.50 over simple interest (1,100) is the second year\'s interest on the first year\'s interest.'],
      ['What is CHF 1,000 due in three years worth today at 10% a year?','1,000 ÷ 1.10³ = 1,000 ÷ 1.331 = 751.31. The present value: the amount that grows to 1,000 in three years at 10%.'],
      ['A loan is quoted at "6% a year, compounded monthly". Is the effective annual rate exactly 6%, above or below, and what is it?','Above: (1 + 0.06 ⁄ 12)¹² − 1 = 1.005¹² − 1 = 6.17%. Interest charged every month earns interest itself within the year.'],
      ['Rochat borrows 120,000 at 6% a year, repaid in 60 equal monthly payments. What is the monthly payment, to the franc?','2,320 (exactly 2,319.94). Monthly rate 0.5%; annuity factor (1 − 1.005⁻⁶⁰) ⁄ 0.005 = 51.7256; payment = 120,000 ⁄ 51.7256.'],
      ['The lease for the same router costs 2,400 a month for 60 months plus a buy-back of 12,000 at the end. At 6%, its present value is 133,038 against 120,000 for the loan. At what monthly lease payment would the two be equal?','2,147.94 a month. The lease is 13,038 more expensive at 2,400; dividing that difference by the annuity factor 51.7256 gives the 252.06 a month the lease would have to come down by.']
    ]],
    ['Week 3 · Capital budgeting',[
      ['The Lausanne workshop costs 460 today (400 of equipment plus 60 of working capital) and produces 136 a year for five years, 236 in the last year. At the 10% hurdle rate, is its NPV positive or negative, and roughly how large?','Positive: +117.64. The five cash flows are worth 577.64 today; minus the 460 invested.'],
      ['Léa paid 15 for a market study last month. Does it enter the NPV of Lausanne, and why?','No. It is a sunk cost: the money is gone whether or not the workshop opens, so it cannot change the decision. Only cash flows that depend on the decision count.'],
      ['The accountant will charge Lausanne 20 a year of head-office overhead. Nobody is hired and no new cost is paid. Does the 20 enter the NPV?','No. It is an allocation of a cost that exists anyway, not a cash flow caused by the project. The 20 of lost contribution at Nyon does count: those sales really move.'],
      ['Lausanne\'s IRR is about 18.8%. The showroom alternative costs 150 and pays 55 a year for five years, IRR about 24.3%. Which should Léa choose at a 10% hurdle rate, and why is the IRR misleading here?','Lausanne: NPV +117.64 against +58.49 for the showroom. The IRR ranks a small project above a large one because it ignores scale; at 10% the francs of value are what count.'],
      ['A kiln rental has cash flows −100 today, +230 in year 1 and −132 in year 2. What goes wrong with the IRR rule, and which rule should Léa use instead?','The cash flows change sign twice, so there are two IRRs, 10% and 20%, and the rule cannot say accept or reject. Use the NPV at the hurdle rate: at 10% the NPV is 0.']
    ]],
    ['Week 4 · The cost of capital',[
      ['The risk-free rate is 1% and the market premium 6%. A listed furniture maker has a beta of 1.5. What return do its shareholders require, and what is the formula called?','r_E = 1% + 1.5 × 6% = 10%. The CAPM: the risk-free rate plus beta times the market premium.'],
      ['Rochat pays 6% on new bank debt and a tax rate of 20%. What does the debt cost Rochat after tax, and why is it less than 6%?','6% × (1 − 0.20) = 4.8%. Interest is deducted before tax, so the tax bill falls by 20% of the interest.'],
      ['Cost of equity 10%, cost of debt after tax 4.8%, target financing 30% debt and 70% equity. Compute Rochat\'s WACC.','0.7 × 10% + 0.3 × 4.8% = 7.0% + 1.44% = 8.44%: the return the business must earn on a project of its average risk.'],
      ['Lausanne is riskier than Rochat\'s existing business: its beta is 1.8, not 1.5. What is its hurdle rate, and what does its NPV become?','r_E = 1% + 1.8 × 6% = 11.8%; WACC = 0.7 × 11.8% + 0.3 × 4.8% = 9.70%. NPV at 9.70% = +122.47. The rate belongs to the project, not to the company.'],
      ['Léa has almost all her wealth in Rochat. Two consequences from Week 4: one for the hurdle rate, one for the offer in Week 5.','Her risk is higher than a diversified investor\'s, but the hurdle rate stays the market rate: the premium for being undiversified is stated openly, not hidden in the rate. In Week 5 it is a real reason for her to accept a little less than the DCF value.']
    ]],
    ['Week 5 · Valuation',[
      ['A bond with a face value of 100 pays a 3% coupon for five years. Investors require 4%. Is the price above or below 100, and what is it?','Below: 95.55. The coupons pay less than investors require, so the buyer pays less than 100 today. 3 × 4.451822 + 100 × 0.821927.'],
      ['A share will pay a dividend of 2.80 next year, growing 3% a year forever. Shareholders require 10%. Its price?','2.80 ⁄ (0.10 − 0.03) = 2.80 ⁄ 0.07 = 40.00. The constant-growth model: next dividend divided by the gap between the required return and growth.'],
      ['Rochat 2025: EBIT 360, tax 20%, depreciation 120, capex 280, working capital up by 130. Free cash flow?','288 + 120 − 280 − 130 = −2. A year with 240 of profit and no free cash: the router and the hotels\' unpaid invoices absorbed it all.'],
      ['Rochat\'s DCF gives an enterprise value of 4,083. Debt is 760 and cash 90. What is the equity worth, and what share of the enterprise value comes from the years after 2030?','Equity = 4,083 − 760 + 90 = 3,413. The terminal value is 74% of the enterprise value: the assumptions about 2031 onwards matter more than the five forecast years.'],
      ['The buyer offers 2,500 for the shares. Rochat\'s EBITDA is 480 and net debt 670; listed peers sell at 7 to 9 times EBITDA. What multiple is the buyer paying, and what does the DCF imply?','(2,500 + 670) ⁄ 480 = 6.6× EBITDA, below the peer range. The DCF implies 4,083 ⁄ 480 = 8.5×, inside it. The offer is below every estimate.']
    ]],
    ['Atelier Rochat',[
      ['Where is Atelier Rochat, what does it make, and who are its three biggest clients?','A furniture workshop in Nyon, founded by Léa Rochat, 12 staff, CHF 2.4 million of sales. Its three biggest clients are hotel groups.'],
      ['Léa said "We made 240, so we can afford it." What was "it", and what did Week 1 answer?','The second workshop in Lausanne. Profit is not cash: cash fell from 150 to 90 in 2025, and the question is whether the business can finance the 460, which Weeks 3, 4 and 7 take up.'],
      ['Week 2\'s decision: lease the CNC router or borrow to buy it. Which did the numbers favour, and by how much in present value?','Borrow: the loan is worth 120,000 today, the lease 133,038 at the same 6%. The lease costs 13,038 more in present value.'],
      ['Léa\'s father valued Lausanne at 10% "because that is what a workshop should earn". Week 4 derived the rate. Was he right, and what did the derived rate turn out to be?','He was close, by luck: the derived rate is 9.70% (beta 1.8). The NPV went from +117.64 at 10% to +122.47 at 9.70%; the decision did not change, but the reasoning now exists.'],
      ['The Lausanne hotel-furnishing group offers CHF 2.5 million for 100% of the shares. In two sentences: should Léa accept, and what should she answer?','No: on its own cash flows Rochat is worth about 3.4 million (3.5 with Lausanne), and similar firms point to 2.7–3.8 million. Counter at about 3.5 million, with the DCF as the justification, and remember that three quarters of that value rests on the years after 2030.']
    ]]
  ]}
};
var setId=(new URLSearchParams(location.search).get('set'))||'w15';
var S=SETS[setId]||SETS.w15, SK='mba406_jeo_'+setId;
var st={used:{},teams:[['Player 1',0],['Player 2',0],['Player 3',0],['Player 4',0],['Player 5',0],['Player 6',0]]};
try{var o=JSON.parse(localStorage.getItem(SK));if(o&&o.teams)st=o;}catch(e){}
function persist(){try{localStorage.setItem(SK,JSON.stringify(st));}catch(e){}}
document.getElementById('setName').textContent=S.name;
function esc(s){return String(s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];});}
function draw(){
  var b=document.getElementById('board'),h='';
  S.cats.forEach(function(c,ci){h+='<div class="cat'+(ci===S.cats.length-1?' own':'')+'">'+esc(c[0])+'</div>';});
  for(var r=0;r<5;r++)S.cats.forEach(function(c,ci){var k=ci+'-'+r;h+='<button class="cell'+(st.used[k]?' used':'')+'" data-k="'+k+'">'+(st.used[k]?'':(r+1)*100)+'</button>';});
  b.innerHTML=h;
  document.getElementById('teams').innerHTML=st.teams.map(function(t,i){return '<div class="team"><input value="'+esc(t[0])+'" data-i="'+i+'"><div class="sc">'+t[1]+'</div></div>';}).join('');
  document.querySelectorAll('.team input').forEach(function(inp){inp.addEventListener('change',function(){st.teams[+inp.dataset.i][0]=inp.value;persist();});});
}
var modal=document.getElementById('modal');
document.getElementById('board').addEventListener('click',function(e){
  var c=e.target.closest('.cell');if(!c||c.classList.contains('used'))return;
  var p=c.dataset.k.split('-'),ci=+p[0],r=+p[1],cat=S.cats[ci],qa=cat[1][r],pts=(r+1)*100;
  document.getElementById('mC').textContent=cat[0]+' · '+pts;
  document.getElementById('mQ').textContent=qa[0];
  var A=document.getElementById('mA');A.textContent=qa[1];A.classList.remove('on');
  var mb=document.getElementById('mB');
  mb.innerHTML='<button class="gh" data-a="show">Answer</button>'+st.teams.map(function(t,i){return '<button class="ok" data-a="p" data-i="'+i+'">+ '+esc(t[0])+'</button><button class="no" data-a="m" data-i="'+i+'">− '+esc(t[0])+'</button>';}).join('')+'<button class="gh" data-a="close">Close</button>';
  mb.onclick=function(ev){
    var x=ev.target.closest('button');if(!x)return;var a=x.dataset.a;
    if(a==='show'){A.classList.add('on');return;}
    if(a==='p'||a==='m'){st.teams[+x.dataset.i][1]+=(a==='p'?pts:-pts);x.disabled=true;persist();}
    if(a==='close'||a==='p'){st.used[c.dataset.k]=1;persist();modal.classList.remove('on');draw();}
  };
  modal.classList.add('on');
});
document.addEventListener('keydown',function(e){if(e.key==='Escape')modal.classList.remove('on');});
document.getElementById('reset').addEventListener('click',function(){if(confirm('Clear the scores and start a new game?')){st={used:{},teams:st.teams.map(function(t){return [t[0],0];})};persist();draw();}});
draw();
</script>

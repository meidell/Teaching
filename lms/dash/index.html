<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex,nofollow">
<title>School dashboards · Lakeside School of Management</title>
<link rel="stylesheet" href="dash.css">
<!--
  The entry to the eight role dashboards (14 Nov 2026). Jan Erik: "the world's best LMS, CRM and
  management system for business schools (BBA, Master, MBA, DBA), 100–400 students, Geneva … start with
  the perfect dashboards (static data)"; then "add the 3 extra roles" (admissions & student office,
  finance, quality & accreditation). Every page reads data.js: one fictitious school, generated from a
  fixed seed, so the eight views agree with each other.
-->
<style>
.roles-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:14px;}
.rcard{display:flex;flex-direction:column;gap:8px;text-decoration:none;color:var(--ink);background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:18px;transition:border-color .15s,transform .15s;}
.rcard:hover{border-color:var(--ink2);transform:translateY(-2px);}
.rcard .n{font-size:12px;color:var(--muted);font-weight:700;}
.rcard h2{font-size:19px;margin:0;letter-spacing:-.01em;}
.rcard .q{color:var(--ink2);font-size:14px;flex:1;}
.rcard .k{font-size:13px;font-weight:650;color:var(--accent);}
.rcard .rh{display:flex;justify-content:space-between;align-items:center;gap:8px;}
.rcard .ex{font-size:13px;color:var(--ink);background:var(--raised);border-radius:10px;padding:8px 10px;line-height:1.45;}
.rcard .cnt{font-size:12px;color:var(--muted);}
.rcard.crit{border-color:color-mix(in srgb,var(--crit) 55%,var(--line));} .rcard.serious{border-color:color-mix(in srgb,var(--serious) 40%,var(--line));}
.intro{max-width:760px;color:var(--ink2);font-size:15px;margin:0 0 20px;}
</style>
</head>
<body>
<main>
  <div class="head"><div><h1>One school, eight views</h1><div class="sub" id="sub"></div></div></div>
  <p class="intro" id="intro"></p>
  <div class="banner" id="banner"></div>
  <div class="g c4" id="tiles"></div>
  <div class="roles-grid" id="roles"></div>
  <p class="foot">All names and figures are invented. They are generated from a fixed seed so that every dashboard shows the same school and the numbers agree across views.</p>
</main>
<script src="data.js"></script>
<script src="charts.js"></script>
<script src="shell.js"></script>
<script>
(function () {
  const { S, esc, num, tile, chfK } = Dash;
  Dash.shell('');
  document.title = 'School dashboards · ' + S.school.name;
  document.getElementById('sub').textContent = `${S.school.name}, ${S.school.city} · ${S.school.term}, week ${S.school.termWeek} of ${S.school.termWeeks}`;
  document.getElementById('intro').textContent = `A business school of ${S.util.active.length} students in four programmes (BBA, MSc, Executive MBA, DBA) seen by the eight people who run it. Each dashboard answers one question for one role, from the same data: the director's alert about a professor's grading backlog is the same backlog the professor and the student office see.`;
  const A = S.util.active, H = S.history, C = S.crm, sig = Dash.signals(), acts = Dash.decisions(), W = Dash.windows();

  /* ---- the banner: what is open, and what closes next ---- */
  const crit = acts.filter(a => a.kind === 'crit').length;
  document.getElementById('banner').innerHTML = `<span class="badge ${crit ? 'crit' : 'serious'}"><b>${acts.length}</b> decisions pending · ${crit} critical</span>` +
    `<span class="next">Week ${S.school.termWeek} of ${S.school.termWeeks}. Next decision windows: ` + W.slice(0, 3).map(w => `<b>${esc(w.event)}</b> ${esc(Dash.cdown(w.days))}`).join(' · ') + `.</span>` +
    `<a href="director.html" style="margin-left:auto;font-weight:650">All decisions →</a>`;

  /* ---- the four numbers, each with its direction ---- */
  const tot = i => S.programs.reduce((a, p) => a + H.headcount[p.id][i], 0);
  const apps = S.programs.reduce((a, p) => a + C.funnel[p.id].applications, 0), appsLY = S.programs.reduce((a, p) => a + C.funnel[p.id].appsPrevSameWeek, 0);
  /* applications per week, summed over programmes, this cycle: the last 12 weeks */
  const weekly = []; for (let i = 0; i < C.weeksBack + 1; i++) weekly.push(S.programs.reduce((a, p) => a + (C.series[p.id].apps[i] || 0), 0));
  const nowIdx = C.weeksBack - C.nowWeek, last12 = weekly.slice(Math.max(0, nowIdx - 11), nowIdx + 1);
  const F = S.finance, cum = a => { let x = 0; return a.map(v => v == null ? null : (x += v)); };
  const planToDate = cum(F.cashPlan)[3] * 0.5 + cum(F.cashPlan)[2] * 0.5, actualToDate = cum(F.cashActual)[3];
  const flaggedCourses = S.sections.filter(x => x.oldestUngradedDays > 14).length;
  document.getElementById('tiles').innerHTML = [
    tile({ lab: 'Students enrolled', val: num(A.length), delta: Dash.delta(tot(5), tot(4), { pct: true, vs: 'against last year' }), spark: 'spS' }),
    tile({ lab: 'Courses this term', val: num(S.sections.length), delta: flaggedCourses ? `<span class="down">▲ ${flaggedCourses}</span> with grading waiting over 14 days` : 'no grading backlog', note: `taught by ${S.faculty.length} faculty` }),
    tile({ lab: 'Applications for September 2027', val: num(apps), delta: Dash.delta(apps, appsLY, { pct: true, vs: 'against the same week last year' }), spark: 'spA' }),
    tile({ lab: 'Tuition collected this year', val: Math.round(100 * H.collectedYTD / H.invoicedYTD) + ' %', delta: Dash.delta(actualToDate, planToDate, { pct: true, vs: 'cash against plan to date' }), spark: 'spC' }),
  ].join('');
  Charts.spark(document.getElementById('spS'), H.years.map((_, i) => tot(i)));
  Charts.spark(document.getElementById('spA'), last12);
  Charts.spark(document.getElementById('spC'), cum(F.cashActual).slice(0, 4));

  /* ---- the eight roles, each with its own status, the counted exception and what waits ---- */
  document.getElementById('roles').innerHTML = Dash.ROLES.map((r, i) => { const s = sig[r.id];
    return `<a class="rcard ${s.kind}" href="${r.href}"><span class="rh"><span class="n">${i + 1}</span>${Dash.st(s.kind + (s.kind === 'crit' ? ' pulse' : ''), Dash.KWORD[s.kind])}</span><h2>${esc(r.name)}</h2><span class="q">${esc(r.q)}</span>` +
      `<span class="ex">${esc(s.line)}</span><span class="cnt">${s.count} item${s.count === 1 ? '' : 's'} waiting</span><span class="k">Open the dashboard →</span></a>`; }).join('');
})();
</script>
</body>
</html>

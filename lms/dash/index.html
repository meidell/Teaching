<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex,nofollow">
<title>School dashboards · Lakeside School of Management</title>
<link rel="stylesheet" href="dash.css">
<!--
  The entry to the eight role dashboards (14 Nov 2026). Jan Erik: "the world's best LMS, CRM and
  management system for business schools (BBA, Master, MBA, DBA), 100–400 students, Geneva … start with
  the perfect dashboards (static data)"; then "add the 3 extra roles" (admissions & student office,
  finance, quality & accreditation). Every page reads data.js: one fictitious school, generated from a
  fixed seed, so the eight views agree with each other.
-->
<style>
.roles-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:14px;}
.rcard{display:flex;flex-direction:column;gap:8px;text-decoration:none;color:var(--ink);background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:18px;transition:border-color .15s,transform .15s;}
.rcard:hover{border-color:var(--ink2);transform:translateY(-2px);}
.rcard .n{font-size:12px;color:var(--muted);font-weight:700;}
.rcard h2{font-size:19px;margin:0;letter-spacing:-.01em;}
.rcard .q{color:var(--ink2);font-size:14px;flex:1;}
.rcard .k{font-size:13px;font-weight:650;}
.intro{max-width:760px;color:var(--ink2);font-size:15px;margin:0 0 20px;}
</style>
</head>
<body>
<main>
  <div class="head"><div><h1>One school, eight views</h1><div class="sub" id="sub"></div></div></div>
  <p class="intro" id="intro"></p>
  <div class="g c4" id="tiles"></div>
  <div class="roles-grid" id="roles"></div>
  <p class="foot">All names and figures are invented. They are generated from a fixed seed so that every dashboard shows the same school and the numbers agree across views.</p>
</main>
<script src="data.js"></script>
<script src="charts.js"></script>
<script src="shell.js"></script>
<script>
(function () {
  const { S, esc, num, tile, chfK } = Dash;
  Dash.shell('');
  document.title = 'School dashboards · ' + S.school.name;
  document.getElementById('sub').textContent = `${S.school.name}, ${S.school.city} · ${S.school.term}, week ${S.school.termWeek} of ${S.school.termWeeks}`;
  document.getElementById('intro').textContent = `A business school of ${S.util.active.length} students in four programmes (BBA, MSc, Executive MBA, DBA) seen by the eight people who run it. Each dashboard answers one question for one role, from the same data: the director's alert about a professor's grading backlog is the same backlog the professor and the student office see.`;
  const A = S.util.active;
  document.getElementById('tiles').innerHTML = [
    tile({ lab: 'Students enrolled', val: num(A.length), note: S.programs.map(p => `${p.short} ${A.filter(s => s.prog === p.id).length}`).join(' · ') }),
    tile({ lab: 'Courses this term', val: num(S.sections.length), note: `taught by ${S.faculty.length} faculty` }),
    tile({ lab: 'Applications for the next intakes', val: num(S.registrar.files.length), note: 'February and September 2027' }),
    tile({ lab: 'Tuition invoiced this year', val: chfK(S.history.invoicedYTD), note: `${Math.round(100 * S.history.collectedYTD / S.history.invoicedYTD)} % collected` }),
  ].join('');
  document.getElementById('roles').innerHTML = Dash.ROLES.map((r, i) => `<a class="rcard" href="${r.href}"><span class="n">${i + 1}</span><h2>${esc(r.name)}</h2><span class="q">${esc(r.q)}</span><span class="k">Open the dashboard →</span></a>`).join('');
})();
</script>
</body>
</html>

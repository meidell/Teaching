<!DOCTYPE html>
<html lang="en">
<head>

<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🗓</text></svg>">

<!--
  The teacher planner (7 Nov 2026) — HES-SO Genève's "schedule availability
  entry", rebuilt for the platform. A teacher picks a term, states how many
  hours a week they want to teach and at most how many a day, and marks every
  hour of one typical week as available, if needed or unavailable. The grid
  is saved to the Teaching API (PUT /me/availability/:term) a moment after
  the last click; the department's planner reads every teacher's week side by
  side in /lms/ (department view → Terms). Same session as the other platform
  pages (localStorage `jem_lms`), same email-code sign-in. FR/EN.
-->
<style>
*{box-sizing:border-box;}
body{margin:0;background:var(--a-page);color:var(--a-ink);font:14.5px/1.55 var(--a-font);}
main{max-width:1180px;margin:0 auto;padding:18px 20px 90px;}
h2{font-family:var(--a-serif);color:var(--a-head);font-size:22px;margin:0 0 2px;}
h3{font-size:11px;letter-spacing:.18em;text-transform:uppercase;color:var(--a-accent);font-weight:800;margin:0 0 8px;}
.muted{color:var(--a-grey);} .small{font-size:12.5px;}
.card{background:var(--a-card);border:1px solid var(--a-line);border-radius:var(--a-r);box-shadow:var(--a-shadow);padding:18px 20px;margin-bottom:16px;}
.lay{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:16px;align-items:start;}
@media(max-width:860px){.lay{grid-template-columns:minmax(0,1fr);}}   /* minmax(0,…): the grid scrolls inside its card instead of widening the page */
.gate{max-width:420px;margin:50px auto;}
input.f,select.f,textarea.f{font:15px var(--a-font);border:1px solid var(--a-line);border-radius:8px;padding:9px 10px;background:#fff;color:var(--a-ink);width:100%;}
input.f:focus,select.f:focus,textarea.f:focus{outline:none;border-color:var(--a-accent-line);box-shadow:0 0 0 3px var(--a-accent-pale);}
label.l{display:block;font-size:11px;font-weight:800;color:var(--a-grey);letter-spacing:.04em;text-transform:uppercase;margin:10px 0 4px;}
.msg{font-size:13px;margin:8px 0;min-height:1em;color:var(--a-bad);font-weight:700;}
.empty{padding:18px;text-align:center;color:var(--a-grey);}
.lang{display:inline-flex;border:1px solid rgba(255,255,255,.3);border-radius:20px;overflow:hidden;}
.lang button{background:none;border:none;color:rgba(255,255,255,.7);font:800 11px var(--a-font);letter-spacing:1px;padding:6px 10px;cursor:pointer;}
.lang button.on{background:var(--a-glow);color:#0F4C60;}
/* the brush: which mark the next click paints */
.brush{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin:0 0 12px;}
.brush button{display:inline-flex;align-items:center;gap:7px;border:2px solid var(--a-line);background:#fff;border-radius:999px;padding:6px 14px 6px 8px;font:700 13px var(--a-font);color:var(--a-ink2);cursor:pointer;}
.brush button.on{border-color:var(--a-ink);} .brush button:focus-visible{outline:3px solid var(--a-accent-pale);}
.sw{display:inline-flex;width:22px;height:22px;border-radius:6px;align-items:center;justify-content:center;font:900 13px var(--a-font);}
.sw.y{background:#CFEBD9;color:#1B6B3A;} .sw.m{background:#FFE9B8;color:#8A5A00;} .sw.n{background:#F6C9C9;color:#A12626;} .sw.c{background:var(--a-wash);color:var(--a-grey);border:1px dashed var(--a-faint);}
/* the week grid */
.gw{overflow-x:auto;-webkit-overflow-scrolling:touch;}
table.g{border-collapse:separate;border-spacing:3px;user-select:none;-webkit-user-select:none;touch-action:none;}
table.g th{font-size:11.5px;font-weight:800;color:var(--a-grey);letter-spacing:.04em;text-transform:uppercase;padding:4px 2px;white-space:nowrap;}
table.g th.d{cursor:pointer;border-radius:6px;} table.g th.d:hover{background:var(--a-wash);color:var(--a-ink);}
table.g th.h{text-align:right;font-variant-numeric:tabular-nums;text-transform:none;letter-spacing:0;cursor:pointer;padding-right:6px;} table.g th.h:hover{color:var(--a-ink);}
table.g td{width:52px;min-width:46px;height:36px;border-radius:6px;background:var(--a-wash);border:1px solid var(--a-line);text-align:center;font:900 13px var(--a-font);color:transparent;cursor:pointer;}
table.g td:hover{outline:2px solid var(--a-ink);outline-offset:-1px;}
table.g td.y{background:#CFEBD9;border-color:#A9DCBB;color:#1B6B3A;} table.g td.m{background:#FFE9B8;border-color:#F5D88A;color:#8A5A00;} table.g td.n{background:#F6C9C9;border-color:#EFA9A9;color:#A12626;}
table.g td{position:relative;}
table.g td b{position:absolute;top:1px;left:0;right:0;text-align:center;font-size:12px;line-height:15px;pointer-events:none;}
/* the two numbers, lined up under the mark, each in the colour its legend uses */
.pills{position:absolute;left:0;right:0;bottom:3px;display:flex;justify-content:center;gap:3px;pointer-events:none;}
.pl{display:inline-block;width:18px;height:13px;border-radius:4px;font:800 9.5px/13px var(--a-font);font-style:normal;text-align:center;}
.pl.o0{background:#F1ECF8;color:#B9ADCC;} .pl.o1{background:#E9DDF6;color:#3B1F63;} .pl.o2{background:#CDB4EA;color:#3B1F63;} .pl.o3{background:#A882D8;color:#fff;} .pl.o4{background:#6E3FB3;color:#fff;}
.pl.b0{background:#F8F2EA;color:#C9B79C;} .pl.b1{background:#FFE4BF;color:#6B3A00;} .pl.b2{background:#FFC67A;color:#6B3A00;} .pl.b3{background:#F59E0B;color:#fff;} .pl.b4{background:#B45309;color:#fff;}
table.g td.ro{cursor:default;} table.g td.ro:hover{outline:none;}
/* the legend above the grid: my marks, then the two pill scales (purple = other teachers available, orange = courses already there) */
.keys{display:grid;grid-template-columns:auto 1fr;gap:6px 12px;align-items:center;margin:0 0 12px;font-size:12.5px;color:var(--a-ink2);}
.keys .kh{font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;font-weight:800;color:var(--a-grey);white-space:nowrap;}
.scale{display:flex;align-items:center;gap:4px;flex-wrap:wrap;}
.scale .swl{display:inline-block;width:26px;height:18px;border-radius:5px;border:1px solid rgba(0,0,0,.08);text-align:center;font:800 10px/18px var(--a-font);}
.scale .swl.o0{background:#F7F4FB;color:#B9ADCC;} .scale .swl.o1{background:#E9DDF6;color:#3B1F63;} .scale .swl.o2{background:#CDB4EA;color:#3B1F63;} .scale .swl.o3{background:#A882D8;color:#fff;} .scale .swl.o4{background:#6E3FB3;color:#fff;}
.scale .swl.b0{background:#FBF7F1;color:#C9B79C;} .scale .swl.b1{background:#FFE4BF;color:#6B3A00;} .scale .swl.b2{background:#FFC67A;color:#6B3A00;} .scale .swl.b3{background:#F59E0B;color:#fff;} .scale .swl.b4{background:#B45309;color:#fff;}
.scale .swl.y{background:#CFEBD9;color:#1B6B3A;} .scale .swl.m{background:#FFE9B8;color:#8A5A00;} .scale .swl.n{background:#F6C9C9;color:#A12626;} .scale .swl.c{background:var(--a-wash);border:1px dashed var(--a-faint);}
.legend{display:flex;gap:14px;flex-wrap:wrap;align-items:center;font-size:12.5px;color:var(--a-ink2);margin:10px 0 0;}
/* the load panel */
.step{display:flex;align-items:center;gap:8px;margin:4px 0 2px;}
.step button{width:34px;height:34px;border-radius:50%;border:1px solid var(--a-line);background:#fff;font:900 18px var(--a-font);color:var(--a-ink);cursor:pointer;line-height:1;}
.step button:hover{background:var(--a-wash);} .step input{width:70px;text-align:center;font-family:var(--a-serif);font-size:22px;padding:4px;}
.step .u{color:var(--a-grey);font-size:13px;}
.tally{display:grid;grid-template-columns:1fr auto;gap:5px 10px;font-size:13.5px;margin:10px 0;}
.tally b{font-variant-numeric:tabular-nums;text-align:right;}
.state{font-size:13px;margin-top:10px;min-height:1.3em;} .state.ok{color:var(--a-good);} .state.err{color:var(--a-bad);font-weight:700;} .state.busy{color:var(--a-grey);}
.hint{background:var(--a-wash);border:1px solid var(--a-line);border-radius:10px;padding:10px 12px;font-size:13px;margin-top:12px;}
.hint.bad{background:var(--a-warn-bg);border-color:var(--a-warn);}
.hint.good{background:var(--a-good-bg);border-color:var(--a-good);}
.tnote{border-left:3px solid var(--a-accent);padding:4px 12px;margin:8px 0 14px;color:var(--a-ink2);white-space:pre-wrap;}
.termrow{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:12px;}
.termrow select{width:auto;min-width:220px;}
.done{color:var(--a-good);font-weight:700;} .todo{color:var(--a-warn);font-weight:700;}
</style>
</head>
<body>
<header class="ahd"><div class="ahd-in">
  <div class="ahd-title"><span class="ahd-k">janerikmeidell.com</span><h1 id="hTitle">My availability</h1><span class="sub" id="hSub"></span></div>
  <span class="sp"></span>
  <div class="ahd-tools">
    <span class="lang"><button data-l="fr">FR</button><button data-l="en">EN</button></span>
    <a class="ab ghost" id="bAdm" href="/lms/" hidden><i data-ic="school"></i><span class="lbl" data-t="adm"></span></a>
    <button class="ab ghost" id="bOut" hidden><i data-ic="logout"></i><span class="lbl" data-t="out"></span></button>
  </div>
</div></header>
<main id="main"></main>
<script>
(function () {
'use strict';
const API = CourseConfig.lmsApi(), SKEY = 'jem_lms', TZ = 'Europe/Zurich';
const $ = id => document.getElementById(id);
const esc = s => String(s == null ? '' : s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const ls = { get: k => { try { return JSON.parse(localStorage.getItem(k)); } catch (e) { return null; } }, set: (k, v) => { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} }, del: k => { try { localStorage.removeItem(k); } catch (e) {} } };
const main = $('main');

/* ---- language ---- */
const STR = {
  en: { title: 'My availability', out: 'Sign out', adm: 'Platform', signin: 'Sign in', lead: 'With your email: a 6-digit code arrives within a minute. No password.',
    email: 'Email', code: 'Code', send: 'Email me a code', go: 'Sign in', hello: 'Signed in as',
    none: 'No department has opened a term for you yet. The department administrator opens one in the platform admin; then your week appears here.',
    term: 'Term', filled: 'entered', notfilled: 'nothing entered yet', deadline: 'Enter it by',
    what: 'How this works', explain: 'The department builds the timetable from what every teacher marks here. Mark every hour of one typical week: the same marks apply to every week of the term. First say how many hours a week you want to teach, then click the hours you can teach. The page saves by itself a moment after each click.',
    brushLead: 'Choose a mark, then click an hour. Drag across several hours to mark them all. Click a day name to mark the whole day; click an hour to mark that hour on every day. “Whole week” marks every hour of the grid, so you can start all available and then mark the exceptions.',
    all: 'Whole week',
    keyMe: 'My marks', keyT: 'Teachers', keyC: 'Courses', scaleT: 'other teachers of the department who can teach at this hour (the left pill in each cell)', scaleC: 'courses that already have a session at this hour this term (the right pill)', scaleMe: 'available · if needed · unavailable · not marked', more: 'or more',
    crowd: 'Hours with high numbers are the crowded ones: several teachers want them and courses are already there, so students end up booked twice. If you can, offer hours with low numbers too; that gives the planner room and keeps the students\' timetables apart.',
    tipO: (y, m) => `${y} other teacher${y === 1 ? '' : 's'} available${m ? `, ${m} if needed` : ''}`, tipB: 'Already scheduled: ', tipNone: 'No other teacher has offered this hour.',
    y: 'Available', m: 'If needed', n: 'Unavailable', c: 'Clear', ylong: 'I can teach then.', mlong: 'I would rather not, but I can if no other slot works.', nlong: 'I cannot teach then.',
    load: 'Your load', hoursWeek: 'Hours of teaching per week', hoursWeekSub: 'How many hours of class you want in a typical week of this term. Whole hours.',
    maxDay: 'At most per day', maxDaySub: 'The most hours of class you accept on one day.',
    slots: 'Hours to fill per week', avail: 'Hours marked available', maybe: 'Hours marked if needed', unav: 'Hours marked unavailable', blank: 'Hours not marked',
    ruleNoHours: 'Start by entering your hours per week, so the page can tell you how many hours to mark.',
    ruleShort: n => `Mark at least ${n} hours as available or if needed (twice your weekly hours), so the planner has a choice.`,
    ruleOk: n => `You offer ${n} hours for your weekly load. That gives the planner a choice.`,
    note: 'A note for the planner (optional)', notePh: 'For example: not before 10:00 on Mondays; away 3–7 March.',
    copy: 'Copy my marks from', copied: 'Copied. Check the week and adjust it.',
    saving: 'Saving…', saved: 'Saved', unsaved: 'Not saved yet', failed: 'Could not save. Check the connection; the page will try again at the next change.',
    leave: 'Your last changes are not saved yet.', days: ['Monday', 'Tuesday', 'Wednesday', 'Thursday', 'Friday', 'Saturday', 'Sunday'], dshort: ['Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat', 'Sun'],
    sumTitle: 'Your week in one line', readback: (y, m, n, b) => `${y} h available · ${m} h if needed · ${n} h unavailable · ${b} h not marked`,
    updated: 'Last saved', geneva: 'Hours are Geneva time.' },
  fr: { title: 'Mes disponibilités', out: 'Se déconnecter', adm: 'Plateforme', signin: 'Se connecter', lead: 'Avec votre e-mail : un code à 6 chiffres arrive en moins d’une minute. Pas de mot de passe.',
    email: 'E-mail', code: 'Code', send: 'Recevoir un code par e-mail', go: 'Se connecter', hello: 'Connecté·e en tant que',
    none: 'Aucun département n’a encore ouvert de semestre pour vous. L’administrateur du département l’ouvre dans l’administration de la plateforme ; votre semaine apparaît ensuite ici.',
    term: 'Semestre', filled: 'saisi', notfilled: 'rien de saisi pour l’instant', deadline: 'À saisir avant le',
    what: 'Comment cela fonctionne', explain: 'Le département construit l’horaire à partir de ce que chaque enseignant·e marque ici. Marquez chaque heure d’une semaine type : les mêmes marques valent pour toutes les semaines du semestre. Indiquez d’abord combien d’heures par semaine vous voulez enseigner, puis cliquez sur les heures où vous pouvez enseigner. La page enregistre d’elle-même un instant après chaque clic.',
    brushLead: 'Choisissez une marque, puis cliquez sur une heure. Glissez sur plusieurs heures pour les marquer toutes. Cliquez sur le nom d’un jour pour marquer toute la journée ; cliquez sur une heure pour marquer cette heure tous les jours. « Toute la semaine » marque chaque heure de la grille : commencez tout disponible, puis marquez les exceptions.',
    all: 'Toute la semaine',
    keyMe: 'Mes marques', keyT: 'Enseignant·es', keyC: 'Cours', scaleT: 'autres enseignant·es du département qui peuvent enseigner à cette heure (la pastille de gauche dans chaque case)', scaleC: 'cours qui ont déjà une séance à cette heure ce semestre (la pastille de droite)', scaleMe: 'disponible · si nécessaire · indisponible · non marqué', more: 'ou plus',
    crowd: 'Les heures aux chiffres élevés sont les heures encombrées : plusieurs enseignant·es les veulent et des cours y sont déjà, donc des étudiant·es se retrouvent inscrit·es à deux endroits. Si vous le pouvez, offrez aussi des heures aux chiffres bas : la planification a de la marge et les horaires des étudiant·es restent séparés.',
    tipO: (y, m) => `${y} autre${y === 1 ? '' : 's'} enseignant·e${y === 1 ? '' : 's'} disponible${y === 1 ? '' : 's'}${m ? `, ${m} si nécessaire` : ''}`, tipB: 'Déjà programmé : ', tipNone: 'Aucun·e autre enseignant·e n’a offert cette heure.',
    y: 'Disponible', m: 'Si nécessaire', n: 'Indisponible', c: 'Effacer', ylong: 'Je peux enseigner à ce moment.', mlong: 'Je préfère éviter, mais je peux si aucun autre créneau ne convient.', nlong: 'Je ne peux pas enseigner à ce moment.',
    load: 'Votre charge', hoursWeek: 'Heures d’enseignement par semaine', hoursWeekSub: 'Combien d’heures de cours vous voulez dans une semaine type de ce semestre. En heures entières.',
    maxDay: 'Au plus par jour', maxDaySub: 'Le nombre maximal d’heures de cours que vous acceptez le même jour.',
    slots: 'Heures à placer par semaine', avail: 'Heures marquées disponibles', maybe: 'Heures marquées si nécessaire', unav: 'Heures marquées indisponibles', blank: 'Heures non marquées',
    ruleNoHours: 'Commencez par indiquer vos heures par semaine ; la page vous dira ensuite combien d’heures marquer.',
    ruleShort: n => `Marquez au moins ${n} heures comme disponibles ou si nécessaire (le double de vos heures hebdomadaires), pour laisser un choix à la planification.`,
    ruleOk: n => `Vous offrez ${n} heures pour votre charge hebdomadaire. La planification a un choix.`,
    note: 'Une remarque pour la planification (facultatif)', notePh: 'Par exemple : pas avant 10h00 le lundi ; absent·e du 3 au 7 mars.',
    copy: 'Reprendre mes marques de', copied: 'Repris. Vérifiez la semaine et ajustez-la.',
    saving: 'Enregistrement…', saved: 'Enregistré', unsaved: 'Pas encore enregistré', failed: 'Impossible d’enregistrer. Vérifiez la connexion ; la page réessaiera au prochain changement.',
    leave: 'Vos derniers changements ne sont pas encore enregistrés.', days: ['Lundi', 'Mardi', 'Mercredi', 'Jeudi', 'Vendredi', 'Samedi', 'Dimanche'], dshort: ['Lun', 'Mar', 'Mer', 'Jeu', 'Ven', 'Sam', 'Dim'],
    sumTitle: 'Votre semaine en une ligne', readback: (y, m, n, b) => `${y} h disponibles · ${m} h si nécessaire · ${n} h indisponibles · ${b} h non marquées`,
    updated: 'Dernier enregistrement', geneva: 'Les heures sont en heure de Genève.' }
};
/* ---- state ---- */
const st = { me: null, terms: [], term: null, entry: null, previous: null, brush: 'y', dirty: false, saving: false, timer: null, lastSaved: null, failed: false };
let LANG = (new URLSearchParams(location.search).get('lang') || localStorage.getItem('siteLang') || (navigator.language || '').slice(0, 2)) === 'fr' ? 'fr' : 'en';
const T = () => STR[LANG];
function setLang(l) { LANG = l; try { localStorage.setItem('siteLang', l); } catch (e) {} document.documentElement.lang = l; document.querySelectorAll('.lang button').forEach(b => b.classList.toggle('on', b.dataset.l === l));
  document.querySelectorAll('[data-t]').forEach(e => e.textContent = T()[e.dataset.t]); $('hTitle').textContent = T().title; document.title = T().title + ' · janerikmeidell.com';
  if (st.me) $('hSub').textContent = `${T().hello} ${st.me.user.name ? st.me.user.name + ' · ' : ''}${st.me.user.email}`; }
document.querySelectorAll('.lang button').forEach(b => b.onclick = () => { setLang(b.dataset.l); render(); });
const fDay = d => d ? new Date(d).toLocaleDateString(LANG === 'fr' ? 'fr-CH' : 'en-GB', { timeZone: TZ, day: 'numeric', month: 'short', year: 'numeric' }) : '';
const fWhen = d => d ? new Date(d).toLocaleString(LANG === 'fr' ? 'fr-CH' : 'en-GB', { timeZone: TZ, day: 'numeric', month: 'short', hour: '2-digit', minute: '2-digit' }) : '';
const hh = h => String(h).padStart(2, '0') + ':00';

async function call(method, path, body) {
  const s = ls.get(SKEY), h = body ? { 'content-type': 'application/json' } : {};
  if (s && s.t) h.authorization = 'Bearer ' + s.t;
  let r;
  try { r = await fetch(API + path, { method, headers: h, body: body ? JSON.stringify(body) : undefined }); }
  catch (e) { throw new Error(LANG === 'fr' ? 'Le serveur est injoignable.' : 'The server could not be reached.'); }
  const j = await r.json().catch(() => ({}));
  if (r.status === 401 && s) { ls.del(SKEY); gate(); throw new Error('signed out'); }
  if (!r.ok) { const e = new Error(j.error || j.message || ('HTTP ' + r.status)); e.status = r.status; throw e; }
  return j;
}

function gate() {
  const t = T(); $('bOut').hidden = true; $('bAdm').hidden = true; $('hSub').textContent = '';
  main.innerHTML = `<div class="card gate"><h2>${esc(t.signin)}</h2><p class="muted small">${esc(t.lead)}</p>
    <label class="l">${esc(t.email)}</label><input class="f" id="gE" type="email" autocomplete="email">
    <div id="gC" hidden><label class="l">${esc(t.code)}</label><input class="f" id="gK" inputmode="numeric" maxlength="6" autocomplete="one-time-code" style="letter-spacing:5px;font-size:18px;text-align:center"></div>
    <div class="msg" id="gX"></div><button class="ab primary" id="gB">${esc(t.send)}</button></div>`;
  let sent = false;
  const go = async () => {
    $('gX').textContent = ''; $('gB').disabled = true;
    try {
      if (!sent) { await call('POST', '/auth/start', { email: $('gE').value.trim() }); sent = true; $('gC').hidden = false; $('gB').textContent = t.go; $('gK').focus(); }
      else { const r = await call('POST', '/auth/verify', { email: $('gE').value.trim(), code: $('gK').value }); ls.set(SKEY, { t: r.token, user: r.user }); await start(); }
    } catch (e) { if ($('gX')) $('gX').textContent = e.message; }
    if ($('gB')) $('gB').disabled = false;   /* start() may have replaced the gate already */
  };
  $('gB').onclick = go; main.querySelectorAll('input').forEach(i => i.onkeydown = e => { if (e.key === 'Enter') go(); });
  $('gE').focus();
}


async function start() {
  setLang(LANG);
  if (!ls.get(SKEY)) return gate();
  try { st.me = await call('GET', '/me'); st.terms = await call('GET', '/me/terms'); }
  catch (e) { if (e.message !== 'signed out') main.innerHTML = `<div class="card empty">${esc(e.message)}</div>`; return; }
  $('bOut').hidden = false; $('bAdm').hidden = !(st.me.user.is_superadmin || st.me.memberships.length || st.me.teaching.length);
  $('hSub').textContent = `${T().hello} ${st.me.user.name ? st.me.user.name + ' · ' : ''}${st.me.user.email}`;
  if (!st.terms.length) { main.innerHTML = `<div class="card empty">${esc(T().none)}</div>`; return; }
  /* the term: ?term=, else the one remembered, else the first that has not ended (the list is newest first) */
  const want = new URLSearchParams(location.search).get('term') || ls.get('jem_plan_term');
  const today = new Date().toISOString().slice(0, 10);
  const open = st.terms.filter(t => String(t.ends_on).slice(0, 10) >= today);
  const pick = st.terms.find(t => t.id === want) || open[open.length - 1] || st.terms[0];
  await loadTerm(pick.id);
}

async function loadTerm(id) {
  if (st.dirty) await save();
  let r;
  try { r = await call('GET', `/me/availability/${id}`); } catch (e) { main.innerHTML = `<div class="card empty">${esc(e.message)}</div>`; return; }
  st.term = r.term; st.previous = r.previous; st.others = r.others || {}; st.booked = r.booked || {};
  st.entry = r.entry || { slots: {}, hours_week: 0, max_day: 0, note: '', updated_at: null };
  st.lastSaved = st.entry.updated_at; st.dirty = false; st.failed = false;
  ls.set('jem_plan_term', id);
  const u = new URL(location.href); u.searchParams.set('term', id); history.replaceState(null, '', u);
  render();
}

/* ---- the page ---- */
function render() {
  const t = T(), term = st.term, e = st.entry;
  if (!term) return;
  const hours = []; for (let h = term.day_from; h < term.day_to; h++) hours.push(h);
  const days = []; for (let d = 1; d <= term.days; d++) days.push(d);
  main.innerHTML = `
    <div class="termrow"><label class="l" style="margin:0">${esc(t.term)}</label><select class="f" id="pTerm">${st.terms.map(x => `<option value="${x.id}" ${x.id === term.id ? 'selected' : ''}>${esc(x.department)} · ${esc(x.label)} · ${x.filled_at ? t.filled : t.notfilled}</option>`).join('')}</select>
      <span class="small muted">${fDay(term.starts_on)} – ${fDay(term.ends_on)}${term.deadline ? ` · <span class="${new Date(term.deadline) < new Date() && !e.updated_at ? 'todo' : ''}">${esc(t.deadline)} ${fDay(term.deadline)}</span>` : ''}</span></div>
    <div class="card"><h3>${esc(t.what)}</h3><p style="margin:0">${esc(t.explain)} ${esc(t.geneva)}</p>${term.note ? `<div class="tnote">${esc(term.note)}</div>` : ''}</div>
    <div class="lay">
      <div class="card">
        <p class="small muted" style="margin:0 0 8px">${esc(t.brushLead)}</p>
        <div class="brush" role="radiogroup">
          ${[['y', '✓'], ['m', '–'], ['n', '✕'], ['c', '']].map(([k, g]) => `<button type="button" data-brush="${k}" class="${st.brush === k ? 'on' : ''}" title="${esc(t[k + 'long'] || '')}"><span class="sw ${k}">${g}</span>${esc(t[k])}</button>`).join('')}
          <button type="button" class="ab sm" id="bAll" style="margin-left:auto">${AdminUI.icon('grid')}${esc(t.all)}</button>
        </div>
        <div class="keys">
          <span class="kh">${esc(t.keyMe)}</span><span class="scale"><span class="swl y">✓</span><span class="swl m">–</span><span class="swl n">✕</span><span class="swl c"></span> ${esc(t.scaleMe)}</span>
          <span class="kh">${esc(t.keyT)}</span><span class="scale">${[0, 1, 2, 3, 4].map(n => `<span class="swl o${n}">${n}${n === 4 ? '+' : ''}</span>`).join('')} ${esc(t.scaleT)}</span>
          <span class="kh">${esc(t.keyC)}</span><span class="scale">${[0, 1, 2, 3, 4].map(n => `<span class="swl b${n}">${n}${n === 4 ? '+' : ''}</span>`).join('')} ${esc(t.scaleC)}</span>
        </div>
        <div class="gw"><table class="g" id="grid"><thead><tr><th></th>${days.map(d => `<th class="d" data-day="${d}" title="${esc(t.days[d - 1])}">${esc(t.dshort[d - 1])}</th>`).join('')}</tr></thead><tbody>
          ${hours.map(h => `<tr><th class="h" data-hour="${h}">${hh(h)}–${hh(h + 1)}</th>${days.map(d => { const k = `${d}-${String(h).padStart(2, '0')}`, v = e.slots[k] || '', o = st.others[k] || { y: 0, m: 0 }, bk = st.booked[k] || [];
            const tip = [o.y || o.m ? t.tipO(o.y, o.m) : t.tipNone, bk.length ? t.tipB + bk.join(', ') : ''].filter(Boolean).join(' · ');
            return `<td data-k="${k}" class="${v}" title="${esc(tip)}"><b>${{ y: '✓', m: '–', n: '✕' }[v] || ''}</b><span class="pills"><i class="pl o o${Math.min(4, o.y)}">${o.y}</i><i class="pl b b${Math.min(4, bk.length)}">${bk.length}</i></span></td>`; }).join('')}</tr>`).join('')}
        </tbody></table></div>
        <p class="small" style="margin:8px 0 0;color:var(--a-ink2)">${esc(t.crowd)}</p>
        <p class="small muted" style="margin:10px 0 0"><b>${esc(t.sumTitle)}:</b> <span id="readback"></span></p>
      </div>
      <div>
        <div class="card"><h3>${esc(t.load)} · ${esc(term.label)}</h3>
          <label class="l" style="margin-top:0">${esc(t.hoursWeek)}</label>
          <div class="step"><button type="button" data-step="hours_week" data-d="-1" aria-label="−">−</button><input class="f" id="iHW" type="number" min="0" max="60" step="1" value="${e.hours_week || 0}"><button type="button" data-step="hours_week" data-d="1" aria-label="+">+</button><span class="u">h</span></div>
          <div class="small muted">${esc(t.hoursWeekSub)}</div>
          <label class="l">${esc(t.maxDay)}</label>
          <div class="step"><button type="button" data-step="max_day" data-d="-1" aria-label="−">−</button><input class="f" id="iMD" type="number" min="0" max="16" step="1" value="${e.max_day || 0}"><button type="button" data-step="max_day" data-d="1" aria-label="+">+</button><span class="u">h</span></div>
          <div class="small muted">${esc(t.maxDaySub)}</div>
          <div class="tally" id="tally"></div>
          <div class="hint" id="hint"></div>
          <label class="l">${esc(t.note)}</label>
          <textarea class="f" id="iNote" rows="3" placeholder="${esc(t.notePh)}">${esc(e.note)}</textarea>
          ${st.previous ? `<div style="margin-top:10px"><button type="button" class="ab sm" id="bCopy"><i data-ic="copy"></i>${esc(t.copy)} ${esc(st.previous.label)}</button></div>` : ''}
          <div class="state" id="state"></div>
        </div>
      </div>
    </div>`;
  AdminUI.icons(main);
  $('pTerm').onchange = () => loadTerm($('pTerm').value);
  main.querySelectorAll('[data-brush]').forEach(b => b.onclick = () => { st.brush = b.dataset.brush; main.querySelectorAll('[data-brush]').forEach(x => x.classList.toggle('on', x === b)); });
  /* paint: click, or press and drag across cells (mouse, pen or finger) */
  const grid = $('grid'); let painting = false, touched = new Set();
  const paint = td => { if (!td || !td.dataset.k || touched.has(td)) return; touched.add(td); setSlot(td.dataset.k, st.brush === 'c' ? '' : st.brush); };
  grid.addEventListener('pointerdown', ev => { const td = ev.target.closest('td'); if (!td) return; painting = true; touched = new Set(); paint(td); ev.preventDefault(); });
  grid.addEventListener('pointermove', ev => { if (!painting) return; const el = document.elementFromPoint(ev.clientX, ev.clientY); paint(el && el.closest('td')); });
  const stop = () => { if (painting) { painting = false; touched = new Set(); queueSave(); } };
  window.addEventListener('pointerup', stop); window.addEventListener('pointercancel', stop);
  $('bAll').onclick = () => { const v = st.brush === 'c' ? '' : st.brush; days.forEach(d => hours.forEach(h => setSlot(`${d}-${String(h).padStart(2, '0')}`, v))); queueSave(); };
  grid.querySelectorAll('th.d').forEach(th => th.onclick = () => { const v = st.brush === 'c' ? '' : st.brush; hours.forEach(h => setSlot(`${th.dataset.day}-${String(h).padStart(2, '0')}`, v)); queueSave(); });
  grid.querySelectorAll('th.h').forEach(th => th.onclick = () => { const v = st.brush === 'c' ? '' : st.brush; days.forEach(d => setSlot(`${d}-${String(th.dataset.hour).padStart(2, '0')}`, v)); queueSave(); });
  main.querySelectorAll('[data-step]').forEach(b => b.onclick = () => { const f = b.dataset.step, inp = f === 'hours_week' ? $('iHW') : $('iMD'); const max = f === 'hours_week' ? 60 : 16;
    const v = Math.min(max, Math.max(0, (Number(inp.value) || 0) + Number(b.dataset.d))); inp.value = v; st.entry[f] = v; refreshPanel(); queueSave(); });
  $('iHW').oninput = $('iMD').oninput = () => { st.entry.hours_week = clamp($('iHW').value, 60); st.entry.max_day = clamp($('iMD').value, 16); refreshPanel(); queueSave(); };
  $('iNote').oninput = () => { st.entry.note = $('iNote').value.slice(0, 2000); queueSave(); };
  if ($('bCopy')) $('bCopy').onclick = () => { const p = st.previous; st.entry.slots = {}; for (const [k, v] of Object.entries(p.slots || {})) { const [d, h] = k.split('-').map(Number); if (d <= term.days && h >= term.day_from && h < term.day_to) st.entry.slots[k] = v; }
    if (!st.entry.hours_week) st.entry.hours_week = p.hours_week; if (!st.entry.max_day) st.entry.max_day = p.max_day; st.dirty = true; render(); setState('ok', t.copied); queueSave(); };
  refreshPanel(); showState();
}
const clamp = (v, max) => { const x = Math.round(Number(v) || 0); return Math.min(max, Math.max(0, x)); };   /* whole hours only */
function setSlot(k, v) {
  const td = main.querySelector(`td[data-k="${k}"]`); if (!td) return;
  if ((st.entry.slots[k] || '') === v) return;
  if (v) st.entry.slots[k] = v; else delete st.entry.slots[k];
  td.className = v; td.querySelector('b').textContent = { y: '✓', m: '–', n: '✕' }[v] || '';
  st.dirty = true; refreshPanel();
}
function tallyOf() { const c = { y: 0, m: 0, n: 0 }; for (const v of Object.values(st.entry.slots)) if (c[v] !== undefined) c[v]++; const all = st.term.days * (st.term.day_to - st.term.day_from); return { ...c, blank: all - c.y - c.m - c.n }; }
function refreshPanel() {
  const t = T(), c = tallyOf(), hw = Number(st.entry.hours_week) || 0, offered = c.y + c.m;
  $('tally').innerHTML = [[t.slots, hw ? hw + ' h' : '—'], [t.avail, c.y + ' h'], [t.maybe, c.m + ' h'], [t.unav, c.n + ' h'], [t.blank, c.blank + ' h']].map(([k, v]) => `<span>${esc(k)}</span><b>${esc(v)}</b>`).join('');
  const need = hw * 2, hint = $('hint');
  if (!hw) { hint.className = 'hint'; hint.textContent = t.ruleNoHours; }
  else if (offered < need) { hint.className = 'hint bad'; hint.textContent = t.ruleShort(need); }
  else { hint.className = 'hint good'; hint.textContent = t.ruleOk(offered); }
  $('readback').textContent = t.readback(c.y, c.m, c.n, c.blank);
}
function setState(cls, text) { const s = $('state'); if (s) { s.className = 'state ' + cls; s.textContent = text; } }
function showState() { const t = T(); if (st.saving) setState('busy', t.saving); else if (st.failed) setState('err', t.failed); else if (st.dirty) setState('busy', t.unsaved); else setState('ok', st.lastSaved ? `${t.saved} · ${t.updated} ${fWhen(st.lastSaved)}` : ''); }

/* ---- saving: a moment after the last change, never twice at once ---- */
function queueSave() { st.dirty = true; showState(); clearTimeout(st.timer); st.timer = setTimeout(save, 900); }
async function save() {
  clearTimeout(st.timer);
  if (!st.dirty || st.saving) return;
  st.saving = true; showState();
  const body = { slots: st.entry.slots, hours_week: st.entry.hours_week, max_day: st.entry.max_day, note: st.entry.note };
  try { const r = await call('PUT', `/me/availability/${st.term.id}`, body); st.lastSaved = r.updated_at; st.dirty = false; st.failed = false;
    const tm = st.terms.find(x => x.id === st.term.id); if (tm) { tm.filled_at = r.updated_at; tm.counts = r.counts; } }
  catch (e) { st.failed = true; }
  st.saving = false; showState();
  if (st.dirty) queueSave();
}
window.addEventListener('beforeunload', ev => { if (st.dirty || st.saving) { ev.preventDefault(); ev.returnValue = T().leave; } });
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'hidden' && st.dirty) save(); });

$('bOut').onclick = async () => { if (st.dirty) await save(); await call('POST', '/auth/logout').catch(() => {}); ls.del(SKEY); gate(); };
AdminUI.icons(document.querySelector('.ahd'));
start();
})();
</script>
</body>
</html>

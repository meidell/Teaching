<!--
  The teacher planner (7 Nov 2026) — HES-SO Genève's "schedule availability
  entry", rebuilt for the platform. A teacher picks a term, states how many
  hours a week they want to teach and at most how many a day, and marks every
  hour of one typical week as available, if needed or unavailable. The grid
  is saved to the Teaching API (PUT /me/availability/:term) a moment after
  the last click; the department's planner reads every teacher's week side by
  side in /lms/ (department view → Terms). Same session as the other platform
  pages (localStorage `jem_lms`), same email-code sign-in. FR/EN.
  14 Nov 2026 — second round, from Jan Erik's review: as little text as possible;
  the grid shows only the teacher's own marks (department congestion is ONE tint,
  behind a switch, counted only on courses that share students with the teacher's);
  session length (1–4 h) and USABLE blocks of that length instead of raw hours;
  a load range (least–most per week); days away as dates; what each course needs
  (online · hybrid · computer lab · executive cohort); and "Send to the planner",
  possible only when no hour is left blank ("Mark the rest unavailable / if needed").
  Fields: block_len, hours_max, away, tags, submitted_at (API migration 004).
-->
<style>
*{box-sizing:border-box;}
body{margin:0;background:var(--a-page);color:var(--a-ink);font:14.5px/1.55 var(--a-font);}
main{max-width:1180px;margin:0 auto;padding:18px 20px 90px;}
h2{font-family:var(--a-serif);color:var(--a-head);font-size:22px;margin:0 0 2px;}
h3{font-size:11px;letter-spacing:.18em;text-transform:uppercase;color:var(--a-accent);font-weight:800;margin:0 0 8px;}
.muted{color:var(--a-grey);} .small{font-size:12.5px;}
.card{background:var(--a-card);border:1px solid var(--a-line);border-radius:var(--a-r);box-shadow:var(--a-shadow);padding:18px 20px;margin-bottom:16px;}
.lay{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:16px;align-items:start;}
@media(max-width:860px){.lay{grid-template-columns:minmax(0,1fr);}}   /* minmax(0,…): the grid scrolls inside its card instead of widening the page */
.gate{max-width:420px;margin:50px auto;}
input.f,select.f,textarea.f{font:15px var(--a-font);border:1px solid var(--a-line);border-radius:8px;padding:9px 10px;background:#fff;color:var(--a-ink);width:100%;}
input.f:focus,select.f:focus,textarea.f:focus{outline:none;border-color:var(--a-accent-line);box-shadow:0 0 0 3px var(--a-accent-pale);}
label.l{display:block;font-size:11px;font-weight:800;color:var(--a-grey);letter-spacing:.04em;text-transform:uppercase;margin:10px 0 4px;}
.msg{font-size:13px;margin:8px 0;min-height:1em;color:var(--a-bad);font-weight:700;}
.empty{padding:18px;text-align:center;color:var(--a-grey);}
.lang{display:inline-flex;border:1px solid rgba(255,255,255,.3);border-radius:20px;overflow:hidden;}
.lang button{background:none;border:none;color:rgba(255,255,255,.7);font:800 11px var(--a-font);letter-spacing:1px;padding:6px 10px;cursor:pointer;}
.lang button.on{background:var(--a-glow);color:#0F4C60;}
/* the brush: which mark the next click paints */
.brush{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin:0 0 12px;}
.brush button{display:inline-flex;align-items:center;gap:7px;border:2px solid var(--a-line);background:#fff;border-radius:999px;padding:6px 14px 6px 8px;font:700 13px var(--a-font);color:var(--a-ink2);cursor:pointer;}
.brush button.on{border-color:var(--a-ink);} .brush button:focus-visible{outline:3px solid var(--a-accent-pale);}
.sw{display:inline-flex;width:22px;height:22px;border-radius:6px;align-items:center;justify-content:center;font:900 13px var(--a-font);}
.sw.y{background:#CFEBD9;color:#1B6B3A;} .sw.m{background:#FFE9B8;color:#8A5A00;} .sw.n{background:#F6C9C9;color:#A12626;} .sw.c{background:var(--a-wash);color:var(--a-grey);border:1px dashed var(--a-faint);}
/* the week grid */
.gw{overflow-x:auto;-webkit-overflow-scrolling:touch;}
table.g{border-collapse:separate;border-spacing:3px;user-select:none;-webkit-user-select:none;touch-action:none;width:100%;min-width:420px;}
table.g th{font-size:11.5px;font-weight:800;color:var(--a-grey);letter-spacing:.04em;text-transform:uppercase;padding:4px 2px;white-space:nowrap;}
table.g th.d{cursor:pointer;border-radius:6px;} table.g th.d:hover{background:var(--a-wash);color:var(--a-ink);}
table.g th.h{text-align:right;font-variant-numeric:tabular-nums;text-transform:none;letter-spacing:0;cursor:pointer;padding-right:6px;} table.g th.h:hover{color:var(--a-ink);}
table.g td{min-width:46px;height:36px;border-radius:6px;background:var(--a-wash);border:1px solid var(--a-line);text-align:center;font:900 13px var(--a-font);color:transparent;cursor:pointer;}
table.g td:hover{outline:2px solid var(--a-ink);outline-offset:-1px;}
table.g td.y{background:#CFEBD9;border-color:#A9DCBB;color:#1B6B3A;} table.g td.m{background:#FFE9B8;border-color:#F5D88A;color:#8A5A00;} table.g td.n{background:#F6C9C9;border-color:#EFA9A9;color:#A12626;}
table.g td{position:relative;}
table.g td b{position:absolute;top:1px;left:0;right:0;text-align:center;font-size:12px;line-height:15px;pointer-events:none;}
table.g td.ro{cursor:default;} table.g td.ro:hover{outline:none;}
/* a short run: offered hours that cannot hold one session of the chosen length */
table.g td.short{background-image:repeating-linear-gradient(135deg,transparent 0 5px,rgba(0,0,0,.09) 5px 7px);}
/* congestion, only when switched on: one corner tint, darker = more crowded */
table.g td i.hz{position:absolute;right:2px;bottom:2px;width:9px;height:9px;border-radius:50%;pointer-events:none;}
i.hz.z1{background:#FCD9A8;} i.hz.z2{background:#F59E0B;} i.hz.z3{background:#B45309;}
.top{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin:0 0 12px;}
.ask{font-size:30px;line-height:1.15;margin:6px 0 6px;}
.lead{font-size:13.5px;color:var(--a-ink2);margin:0 0 12px;}
.tog{display:inline-flex;align-items:center;gap:6px;font-size:13px;color:var(--a-ink2);cursor:pointer;margin-left:auto;}
.seg{display:inline-flex;border:1px solid var(--a-line);border-radius:999px;overflow:hidden;}
.seg button{border:none;background:#fff;padding:6px 12px;font:700 13px var(--a-font);color:var(--a-ink2);cursor:pointer;}
.seg button.on{background:var(--a-ink);color:#fff;}
.row2{display:flex;align-items:center;gap:8px;flex-wrap:wrap;}
.chips{display:flex;gap:5px;flex-wrap:wrap;margin:4px 0 8px;}
.chip{border:1px solid var(--a-line);background:#fff;border-radius:999px;padding:3px 10px;font:700 12px var(--a-font);color:var(--a-ink2);cursor:pointer;}
.chip.on{background:var(--a-accent);border-color:var(--a-accent);color:#fff;}
.away{display:flex;justify-content:space-between;gap:8px;font-size:13px;padding:4px 0;border-bottom:1px solid var(--a-line);}
.away button{border:none;background:none;color:var(--a-grey);cursor:pointer;font-size:15px;}
.sendbar{margin-top:14px;padding-top:12px;border-top:1px solid var(--a-line);}
.sent{color:var(--a-good);font-weight:700;font-size:13px;} .draft{color:var(--a-grey);font-size:13px;}
/* the load panel */
.step{display:flex;align-items:center;gap:8px;margin:4px 0 2px;}
.step button{width:34px;height:34px;border-radius:50%;border:1px solid var(--a-line);background:#fff;font:900 18px var(--a-font);color:var(--a-ink);cursor:pointer;line-height:1;}
.step button:hover{background:var(--a-wash);} .step input{width:70px;text-align:center;font-family:var(--a-serif);font-size:22px;padding:4px;}
.step .u{color:var(--a-grey);font-size:13px;}
.tally{display:grid;grid-template-columns:1fr auto;gap:5px 10px;font-size:13.5px;margin:10px 0;}
.tally b{font-variant-numeric:tabular-nums;text-align:right;}
.state{font-size:13px;margin-top:10px;min-height:1.3em;} .state.ok{color:var(--a-good);} .state.err{color:var(--a-bad);font-weight:700;} .state.busy{color:var(--a-grey);}
.hint{background:var(--a-wash);border:1px solid var(--a-line);border-radius:10px;padding:10px 12px;font-size:13px;margin-top:12px;}
.hint.bad{background:var(--a-warn-bg);border-color:var(--a-warn);}
.hint.good{background:var(--a-good-bg);border-color:var(--a-good);}
.tnote{border-left:3px solid var(--a-accent);padding:4px 12px;margin:8px 0 14px;color:var(--a-ink2);white-space:pre-wrap;}
.termrow{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:12px;}
.termrow select{width:auto;min-width:220px;}
.done{color:var(--a-good);font-weight:700;} .todo{color:var(--a-warn);font-weight:700;}
</style>

<body>
<header class="ahd"><div class="ahd-in">
  <div class="ahd-title"><span class="ahd-k">janerikmeidell.com</span><h1 id="hTitle">Teaching availability</h1><span class="sub" id="hSub"></span></div>
  <span class="sp"></span>

    <span class="lang"><button data-l="fr">FR</button><button data-l="en">EN</button></span>
    <a class="ab ghost" id="bAdm" href="/lms/" hidden><i data-ic="school"></i><span class="lbl" data-t="adm"></span></a>

  </div>

<main id="main"></main>
<script>
(function () {
'use strict';
const API = CourseConfig.lmsApi(), SKEY = 'jem_lms', TZ = 'Europe/Zurich';
const $ = id => document.getElementById(id);
const esc = s => String(s == null ? '' : s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const ls = { get: k => { try { return JSON.parse(localStorage.getItem(k)); } catch (e) { return null; } }, set: (k, v) => { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} }, del: k => { try { localStorage.removeItem(k); } catch (e) {} } };
const main = $('main');

/* ---- language ---- */
const STR = {
  en: { title: 'Teaching availability', ask: 'When can you teach?', out: 'Sign out', adm: 'Platform', signin: 'Sign in', lead: 'A 6-digit code arrives by email. No password.',
    email: 'Email', code: 'Code', send: 'Email me a code', go: 'Sign in', hello: 'Signed in as',
    none: 'No term is open for you yet.', filled: 'entered', notfilled: 'not entered', sentS: 'sent', deadline: 'by',
    how: 'Mark one typical week: it applies to every week of the term. Drag to mark several hours; click a day or an hour to mark the whole row. Saved automatically.',
    all: 'Whole week', y: 'Available', m: 'If needed', n: 'Unavailable', c: 'Clear', ylong: 'I can teach then.', mlong: 'Only if nothing else works.', nlong: 'I cannot teach then.',
    crowd: 'Show where others teach', crowdTip: (o, b, sc) => `${o} other teacher${o === 1 ? '' : 's'} available · ${b.length ? b.length + ' course' + (b.length === 1 ? '' : 's') + (sc === 'cohort' ? ' of your students' : '') + ' already here: ' + b.join(', ') : 'no course of ' + (sc === 'cohort' ? 'your students' : 'the department') + ' here'}`,
    crowdKey: sc => `Darker dot = more crowded: other teachers who want the hour, and courses ${sc === 'cohort' ? 'that share students with yours' : 'of the department (you have no students yet)'} already there.`,
    short: L => `Hatched: too short for a ${L}-hour session.`,
    load: 'Load', len: 'One session lasts', perWeek: 'Hours per week', from: 'at least', to: 'at most', maxDay: 'At most per day',
    blocks: L => `Usable ${L}-hour blocks`, offered: 'Hours offered', blank: 'Not marked',
    need: (n, s, L) => `You need at least ${n} usable ${L}-hour blocks: two for each of your ${s} session${s === 1 ? '' : 's'}.`,
    needH: n => `Offer at least ${n} hours (twice your weekly hours).`, okB: 'Enough choice for the planner.',
    noLoad: 'Enter your hours per week first.',
    rest: n => `${n} h not marked. Blank tells the planner nothing:`, restN: 'Mark the rest unavailable', restM: 'Mark the rest if needed',
    away: 'Days away', awayAdd: 'Add', awayWhy: 'Reason (optional)', awayNone: 'None.',
    needs: 'What your courses need', allTeaching: 'All my teaching',
    tag: { online: 'Online', hybrid: 'Hybrid', lab: 'Computer lab', exec: 'Executive (evenings / weekends)' },
    note: 'Note (optional)', copy: 'Copy marks from',
    sendB: 'Send to the planner', sentAt: 'Sent', draft: 'Draft — saved, not sent.', sendNo: 'Mark every hour and enter your hours per week to send.',
    copied: 'Copied. Check the week.',
    saving: 'Saving…', saved: 'Saved', unsaved: 'Not saved yet', failed: 'Could not save. The page will try again at the next change.',
    leave: 'Your last changes are not saved yet.', days: ['Monday', 'Tuesday', 'Wednesday', 'Thursday', 'Friday', 'Saturday', 'Sunday'], dshort: ['Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat', 'Sun'],
    geneva: 'Geneva time.' },
  fr: { title: 'Disponibilités d’enseignement', ask: 'Quand pouvez-vous enseigner ?', out: 'Se déconnecter', adm: 'Plateforme', signin: 'Se connecter', lead: 'Un code à 6 chiffres arrive par e-mail. Pas de mot de passe.',
    email: 'E-mail', code: 'Code', send: 'Recevoir un code', go: 'Se connecter', hello: 'Connecté·e :',
    none: 'Aucun semestre n’est ouvert pour vous.', filled: 'saisi', notfilled: 'non saisi', sentS: 'envoyé', deadline: 'avant le',
    how: 'Marquez une semaine type : elle vaut pour toutes les semaines du semestre. Glissez pour marquer plusieurs heures ; cliquez un jour ou une heure pour toute la ligne. Enregistré automatiquement.',
    all: 'Toute la semaine', y: 'Disponible', m: 'Si nécessaire', n: 'Indisponible', c: 'Effacer', ylong: 'Je peux enseigner.', mlong: 'Seulement si rien d’autre ne convient.', nlong: 'Je ne peux pas.',
    crowd: 'Voir où enseignent les autres', crowdTip: (o, b, sc) => `${o} autre${o === 1 ? '' : 's'} enseignant·e${o === 1 ? '' : 's'} disponible${o === 1 ? '' : 's'} · ${b.length ? b.length + ' cours' + (sc === 'cohort' ? ' de vos étudiant·es' : '') + ' déjà là : ' + b.join(', ') : 'aucun cours ' + (sc === 'cohort' ? 'de vos étudiant·es' : 'du département') + ' ici'}`,
    crowdKey: sc => `Point plus foncé = heure plus encombrée : autres enseignant·es qui la veulent et cours ${sc === 'cohort' ? 'qui partagent des étudiant·es avec les vôtres' : 'du département (vous n’avez pas encore d’étudiant·es)'} déjà là.`,
    short: L => `Hachuré : trop court pour une séance de ${L} h.`,
    load: 'Charge', len: 'Une séance dure', perWeek: 'Heures par semaine', from: 'au moins', to: 'au plus', maxDay: 'Au plus par jour',
    blocks: L => `Blocs de ${L} h utilisables`, offered: 'Heures offertes', blank: 'Non marquées',
    need: (n, s, L) => `Il faut au moins ${n} blocs de ${L} h utilisables : deux pour chacune de vos ${s} séance${s === 1 ? '' : 's'}.`,
    needH: n => `Offrez au moins ${n} heures (le double de vos heures hebdomadaires).`, okB: 'La planification a assez de choix.',
    noLoad: 'Indiquez d’abord vos heures par semaine.',
    rest: n => `${n} h non marquées. Une case vide ne dit rien à la planification :`, restN: 'Le reste indisponible', restM: 'Le reste si nécessaire',
    away: 'Absences', awayAdd: 'Ajouter', awayWhy: 'Motif (facultatif)', awayNone: 'Aucune.',
    needs: 'Besoins de vos cours', allTeaching: 'Tout mon enseignement',
    tag: { online: 'En ligne', hybrid: 'Hybride', lab: 'Salle informatique', exec: 'Executive (soirs / week-ends)' },
    note: 'Remarque (facultatif)', copy: 'Reprendre les marques de',
    sendB: 'Envoyer à la planification', sentAt: 'Envoyé', draft: 'Brouillon — enregistré, pas envoyé.', sendNo: 'Marquez chaque heure et indiquez vos heures par semaine pour envoyer.',
    copied: 'Repris. Vérifiez la semaine.',
    saving: 'Enregistrement…', saved: 'Enregistré', unsaved: 'Pas encore enregistré', failed: 'Impossible d’enregistrer. Nouvel essai au prochain changement.',
    leave: 'Vos derniers changements ne sont pas encore enregistrés.', days: ['Lundi', 'Mardi', 'Mercredi', 'Jeudi', 'Vendredi', 'Samedi', 'Dimanche'], dshort: ['Lun', 'Mar', 'Mer', 'Jeu', 'Ven', 'Sam', 'Dim'],
    geneva: 'Heure de Genève.' }
};
/* ---- state ---- */
const st = { me: null, terms: [], term: null, entry: null, previous: null, courses: [], scope: 'department', brush: 'y', crowd: false, dirty: false, saving: false, timer: null, lastSaved: null, failed: false };
let LANG = (new URLSearchParams(location.search).get('lang') || localStorage.getItem('siteLang') || (navigator.language || '').slice(0, 2)) === 'fr' ? 'fr' : 'en';
const T = () => STR[LANG];
function setLang(l) { LANG = l; try { localStorage.setItem('siteLang', l); } catch (e) {} document.documentElement.lang = l; document.querySelectorAll('.lang button').forEach(b => b.classList.toggle('on', b.dataset.l === l));
  document.querySelectorAll('[data-t]').forEach(e => e.textContent = T()[e.dataset.t]); $('hTitle').textContent = T().title; document.title = T().title + ' · janerikmeidell.com';
  if (st.me) $('hSub').textContent = `${T().hello} ${st.me.user.name ? st.me.user.name + ' · ' : ''}${st.me.user.email}`; }
document.querySelectorAll('.lang button').forEach(b => b.onclick = () => { setLang(b.dataset.l); render(); });
const fDay = d => d ? new Date(d).toLocaleDateString(LANG === 'fr' ? 'fr-CH' : 'en-GB', { timeZone: TZ, day: 'numeric', month: 'short', year: 'numeric' }) : '';
const fWhen = d => d ? new Date(d).toLocaleString(LANG === 'fr' ? 'fr-CH' : 'en-GB', { timeZone: TZ, day: 'numeric', month: 'short', hour: '2-digit', minute: '2-digit' }) : '';
const hh = h => String(h).padStart(2, '0') + ':00';

async function call(method, path, body) {
  const s = ls.get(SKEY), h = body ? { 'content-type': 'application/json' } : {};
  if (s && s.t) h.authorization = 'Bearer ' + s.t;
  let r;
  try { r = await fetch(API + path, { method, headers: h, body: body ? JSON.stringify(body) : undefined }); }
  catch (e) { throw new Error(LANG === 'fr' ? 'Le serveur est injoignable.' : 'The server could not be reached.'); }
  const j = await r.json().catch(() => ({}));
  if (r.status === 401 && s) { ls.del(SKEY); gate(); throw new Error('signed out'); }
  if (!r.ok) { const e = new Error(j.error || j.message || ('HTTP ' + r.status)); e.status = r.status; throw e; }
  return j;
}

function gate() {
  const t = T(); $('bOut').hidden = true; $('bAdm').hidden = true; $('hSub').textContent = '';
  main.innerHTML = `<div class="card gate"><h2>${esc(t.signin)}</h2><p class="muted small">${esc(t.lead)}</p>
    <label class="l">${esc(t.email)}</label><input class="f" id="gE" type="email" autocomplete="email">
    <div id="gC" hidden><label class="l">${esc(t.code)}</label><input class="f" id="gK" inputmode="numeric" maxlength="6" autocomplete="one-time-code" style="letter-spacing:5px;font-size:18px;text-align:center"></div>
    <div class="msg" id="gX"></div><button class="ab primary" id="gB">${esc(t.send)}</button></div>`;
  let sent = false;
  const go = async () => {
    $('gX').textContent = ''; $('gB').disabled = true;
    try {
      if (!sent) { await call('POST', '/auth/start', { email: $('gE').value.trim() }); sent = true; $('gC').hidden = false; $('gB').textContent = t.go; $('gK').focus(); }
      else { const r = await call('POST', '/auth/verify', { email: $('gE').value.trim(), code: $('gK').value }); ls.set(SKEY, { t: r.token, user: r.user }); await start(); }
    } catch (e) { if ($('gX')) $('gX').textContent = e.message; }
    if ($('gB')) $('gB').disabled = false;   /* start() may have replaced the gate already */
  };
  $('gB').onclick = go; main.querySelectorAll('input').forEach(i => i.onkeydown = e => { if (e.key === 'Enter') go(); });
  $('gE').focus();
}


async function start() {
  setLang(LANG);
  if (!ls.get(SKEY)) return gate();
  try { st.me = await call('GET', '/me'); st.terms = await call('GET', '/me/terms'); }
  catch (e) { if (e.message !== 'signed out') main.innerHTML = `<div class="card empty">${esc(e.message)}</div>`; return; }
  $('bOut').hidden = false; $('bAdm').hidden = !(st.me.user.is_superadmin || st.me.memberships.length || st.me.teaching.length);
  $('hSub').textContent = `${T().hello} ${st.me.user.name ? st.me.user.name + ' · ' : ''}${st.me.user.email}`;
  if (!st.terms.length) { main.innerHTML = `<div class="card empty">${esc(T().none)}</div>`; return; }
  /* the term: ?term=, else the one remembered, else the first that has not ended (the list is newest first) */
  const want = new URLSearchParams(location.search).get('term') || ls.get('jem_plan_term');
  const today = new Date().toISOString().slice(0, 10);
  const open = st.terms.filter(t => String(t.ends_on).slice(0, 10) >= today);
  const pick = st.terms.find(t => t.id === want) || open[open.length - 1] || st.terms[0];
  await loadTerm(pick.id);
}

async function loadTerm(id) {
  if (st.dirty) await save();
  let r;
  try { r = await call('GET', `/me/availability/${id}`); } catch (e) { main.innerHTML = `<div class="card empty">${esc(e.message)}</div>`; return; }
  st.term = r.term; st.previous = r.previous; st.others = r.others || {}; st.booked = r.booked || {}; st.courses = r.courses || []; st.scope = r.booked_scope || 'department';
  st.entry = Object.assign({ slots: {}, hours_week: 0, hours_max: 0, max_day: 0, block_len: 0, away: [], tags: {}, note: '', updated_at: null, submitted_at: null }, r.entry || {});
  st.lastSaved = st.entry.updated_at; st.dirty = false; st.failed = false;
  ls.set('jem_plan_term', id);
  const u = new URL(location.href); u.searchParams.set('term', id); history.replaceState(null, '', u);
  render();
}

/* ---- the page ---- */
const K = (d, h) => `${d}-${String(h).padStart(2, '0')}`;
const GLYPH = { y: '✓', m: '–', n: '✕' };
function render() {
  const t = T(), term = st.term, e = st.entry;
  if (!term) return;
  const hours = []; for (let h = term.day_from; h < term.day_to; h++) hours.push(h);
  const days = []; for (let d = 1; d <= term.days; d++) days.push(d);
  const stepper = (id, f, max, v) => `<div class="step"><button type="button" data-step="${f}" data-d="-1" aria-label="−">−</button><input class="f" id="${id}" type="number" min="0" max="${max}" step="1" value="${v || 0}"><button type="button" data-step="${f}" data-d="1" aria-label="+">+</button><span class="u">h</span></div>`;
  const courseRows = (st.courses.length ? st.courses.map(c => ({ id: c.id, name: (c.code || c.title) + (c.label ? ' · ' + c.label : '') })) : [{ id: 'all', name: t.allTeaching }]);
  main.innerHTML = `
    <div class="top"><select class="f" id="pTerm" style="width:auto;min-width:220px">${st.terms.map(x => `<option value="${x.id}" ${x.id === term.id ? 'selected' : ''}>${esc(x.department)} · ${esc(x.label)} · ${x.submitted_at ? t.sentS : x.filled_at ? t.filled : t.notfilled}</option>`).join('')}</select>
      <span class="small muted">${fDay(term.starts_on)} – ${fDay(term.ends_on)}${term.deadline ? ` · ${esc(t.sendB)} ${esc(t.deadline)} <b>${fDay(term.deadline)}</b>` : ''}</span></div>
    <h2 class="ask">${esc(t.ask)}</h2>
    <p class="lead">${esc(t.how)} ${esc(t.geneva)}</p>
    ${term.note ? `<div class="tnote">${esc(term.note)}</div>` : ''}
    <div class="lay">
      <div class="card">
        <div class="brush" role="radiogroup">
          ${[['y', '✓'], ['m', '–'], ['n', '✕'], ['c', '']].map(([k, g]) => `<button type="button" data-brush="${k}" class="${st.brush === k ? 'on' : ''}" title="${esc(t[k + 'long'] || '')}"><span class="sw ${k}">${g}</span>${esc(t[k])}</button>`).join('')}
          <button type="button" class="ab sm" id="bAll">${AdminUI.icon('grid')}${esc(t.all)}</button>
          <label class="tog"><input type="checkbox" id="cCrowd" ${st.crowd ? 'checked' : ''}>${esc(t.crowd)}</label>
        </div>
        <div class="gw"><table class="g" id="grid"><thead><tr><th></th>${days.map(d => `<th class="d" data-day="${d}" title="${esc(t.days[d - 1])}">${esc(t.dshort[d - 1])}</th>`).join('')}</tr></thead><tbody>
          ${hours.map(h => `<tr><th class="h" data-hour="${h}">${hh(h)}</th>${days.map(d => { const k = K(d, h), v = e.slots[k] || ''; return `<td data-k="${k}" class="${v}"><b>${GLYPH[v] || ''}</b></td>`; }).join('')}</tr>`).join('')}
        </tbody></table></div>
        <p class="small muted" id="gridKey" style="margin:8px 0 0"></p>
      </div>
      <div>
        <div class="card">
          <h3>${esc(t.load)}</h3>
          <label class="l" style="margin-top:0">${esc(t.len)}</label>
          <div class="seg" id="segLen">${[1, 2, 3, 4].map(n => `<button type="button" data-len="${n}" class="${e.block_len === n ? 'on' : ''}">${n} h</button>`).join('')}</div>
          <label class="l">${esc(t.perWeek)}</label>
          <div class="row2"><span class="small muted">${esc(t.from)}</span>${stepper('iHW', 'hours_week', 60, e.hours_week)}</div>
          <div class="row2"><span class="small muted">${esc(t.to)}</span>${stepper('iHX', 'hours_max', 60, e.hours_max)}</div>
          <label class="l">${esc(t.maxDay)}</label>
          ${stepper('iMD', 'max_day', 16, e.max_day)}
          <div class="tally" id="tally"></div>
          <div class="hint" id="hint"></div>
          <div id="rest"></div>
          <div class="sendbar"><button type="button" class="ab primary" id="bSend">${AdminUI.icon('send')}${esc(t.sendB)}</button><div id="sendState" style="margin-top:6px"></div><div class="state" id="state"></div></div>
        </div>
        <div class="card">
          <h3>${esc(t.away)}</h3>
          <div id="awayList"></div>
          <div class="row2" style="margin-top:8px;flex-wrap:nowrap"><input class="f" type="date" id="aF" style="flex:1;min-width:0"><span>–</span><input class="f" type="date" id="aT" style="flex:1;min-width:0"></div>
          <div class="row2" style="margin-top:6px"><input class="f" id="aW" placeholder="${esc(t.awayWhy)}" maxlength="120" style="flex:1"><button type="button" class="ab sm" id="aAdd">${AdminUI.icon('plus')}${esc(t.awayAdd)}</button></div>
          <div class="msg" id="aX"></div>
        </div>
        <div class="card">
          <h3>${esc(t.needs)}</h3>
          ${courseRows.map(c => `<div class="small" style="font-weight:700;margin-top:6px">${esc(c.name)}</div><div class="chips">${['online', 'hybrid', 'lab', 'exec'].map(g => `<button type="button" class="chip ${(e.tags[c.id] || []).includes(g) ? 'on' : ''}" data-ed="${c.id}" data-tag="${g}">${esc(t.tag[g])}</button>`).join('')}</div>`).join('')}
          <label class="l">${esc(t.note)}</label>
          <textarea class="f" id="iNote" rows="2">${esc(e.note)}</textarea>
          ${st.previous ? `<div style="margin-top:10px"><button type="button" class="ab sm ghost" id="bCopy">${AdminUI.icon('copy')}${esc(t.copy)} ${esc(st.previous.label)}</button></div>` : ''}
        </div>
      </div>
    </div>`;
  AdminUI.icons(main);
  $('pTerm').onchange = () => loadTerm($('pTerm').value);
  main.querySelectorAll('[data-brush]').forEach(b => b.onclick = () => { st.brush = b.dataset.brush; main.querySelectorAll('[data-brush]').forEach(x => x.classList.toggle('on', x === b)); });
  const grid = $('grid'); let painting = false, touched = new Set();
  const paint = td => { if (!td || !td.dataset.k || touched.has(td)) return; touched.add(td); setSlot(td.dataset.k, st.brush === 'c' ? '' : st.brush); };
  grid.addEventListener('pointerdown', ev => { const td = ev.target.closest('td'); if (!td) return; painting = true; touched = new Set(); paint(td); ev.preventDefault(); });
  grid.addEventListener('pointermove', ev => { if (!painting) return; const el = document.elementFromPoint(ev.clientX, ev.clientY); paint(el && el.closest('td')); });
  const stop = () => { if (painting) { painting = false; touched = new Set(); refreshGrid(); queueSave(); } };
  window.addEventListener('pointerup', stop); window.addEventListener('pointercancel', stop);
  const fill = (keys, v) => { keys.forEach(k => setSlot(k, v)); refreshGrid(); queueSave(); };
  $('bAll').onclick = () => fill(days.flatMap(d => hours.map(h => K(d, h))), st.brush === 'c' ? '' : st.brush);
  grid.querySelectorAll('th.d').forEach(th => th.onclick = () => fill(hours.map(h => K(th.dataset.day, h)), st.brush === 'c' ? '' : st.brush));
  grid.querySelectorAll('th.h').forEach(th => th.onclick = () => fill(days.map(d => K(d, th.dataset.hour)), st.brush === 'c' ? '' : st.brush));
  $('cCrowd').onchange = () => { st.crowd = $('cCrowd').checked; refreshGrid(); };
  $('segLen').querySelectorAll('button').forEach(b => b.onclick = () => { const n = Number(b.dataset.len); st.entry.block_len = st.entry.block_len === n ? 0 : n;
    $('segLen').querySelectorAll('button').forEach(x => x.classList.toggle('on', Number(x.dataset.len) === st.entry.block_len)); refreshGrid(); refreshPanel(); queueSave(); });
  const INP = { hours_week: ['iHW', 60], hours_max: ['iHX', 60], max_day: ['iMD', 16] };
  main.querySelectorAll('[data-step]').forEach(b => b.onclick = () => { const f = b.dataset.step, [id, max] = INP[f], inp = $(id);
    const v = Math.min(max, Math.max(0, (Number(inp.value) || 0) + Number(b.dataset.d))); inp.value = v; st.entry[f] = v; refreshPanel(); queueSave(); });
  Object.entries(INP).forEach(([f, [id, max]]) => $(id).oninput = () => { st.entry[f] = clamp($(id).value, max); refreshPanel(); queueSave(); });
  $('iNote').oninput = () => { st.entry.note = $('iNote').value.slice(0, 2000); queueSave(); };
  main.querySelectorAll('.chip[data-tag]').forEach(b => b.onclick = () => { const ed = b.dataset.ed, g = b.dataset.tag, l = new Set(st.entry.tags[ed] || []);
    l.has(g) ? l.delete(g) : l.add(g); if (l.size) st.entry.tags[ed] = [...l]; else delete st.entry.tags[ed]; b.classList.toggle('on', l.has(g)); queueSave(); });
  $('aAdd').onclick = () => { const f = $('aF').value, to = $('aT').value || f; $('aX').textContent = '';
    if (!f) { $('aX').textContent = LANG === 'fr' ? 'Choisissez au moins le premier jour.' : 'Pick at least the first day.'; return; }
    if (to < f) { $('aX').textContent = LANG === 'fr' ? 'Le dernier jour vient après le premier.' : 'The last day comes after the first.'; return; }
    st.entry.away = (st.entry.away || []).concat([{ from: f, to, why: $('aW').value.trim() }]).sort((a, b) => a.from.localeCompare(b.from));
    $('aF').value = $('aT').value = $('aW').value = ''; drawAway(); queueSave(); };
  $('bSend').onclick = () => save(true);
  if ($('bCopy')) $('bCopy').onclick = () => { const p = st.previous; st.entry.slots = {}; for (const [k, v] of Object.entries(p.slots || {})) { const [d, h] = k.split('-').map(Number); if (d <= term.days && h >= term.day_from && h < term.day_to) st.entry.slots[k] = v; }
    if (!st.entry.hours_week) st.entry.hours_week = p.hours_week; if (!st.entry.max_day) st.entry.max_day = p.max_day; st.dirty = true; render(); setState('ok', t.copied); queueSave(); };
  drawAway(); refreshGrid(); refreshPanel(); showState();
}
const clamp = (v, max) => { const x = Math.round(Number(v) || 0); return Math.min(max, Math.max(0, x)); };   /* whole hours only */
function setSlot(k, v) {
  const td = main.querySelector(`td[data-k="${k}"]`); if (!td) return;
  if ((st.entry.slots[k] || '') === v) return;
  if (v) st.entry.slots[k] = v; else delete st.entry.slots[k];
  td.querySelector('b').textContent = GLYPH[v] || '';
  td.className = v;
  st.dirty = true; refreshPanel();
}
/* contiguous runs of offered hours (available or if needed), day by day */
function runs() {
  const term = st.term, out = [];
  for (let d = 1; d <= term.days; d++) { let run = [];
    for (let h = term.day_from; h <= term.day_to; h++) { const v = h < term.day_to ? st.entry.slots[K(d, h)] : null;
      if (v === 'y' || v === 'm') run.push(K(d, h)); else { if (run.length) out.push(run); run = []; } } }
  return out;
}
function usable(L) { return runs().reduce((s, r) => s + Math.floor(r.length / L), 0); }
/* the grid's decorations: hatched short runs, and the congestion dot when switched on */
function refreshGrid() {
  const t = T(), L = Number(st.entry.block_len) || 0, short = new Set();
  if (L > 1) runs().forEach(r => { if (r.length < L) r.forEach(k => short.add(k)); });
  main.querySelectorAll('#grid td').forEach(td => {
    const k = td.dataset.k, v = st.entry.slots[k] || '';
    td.className = v + (short.has(k) ? ' short' : '');
    let dot = td.querySelector('i.hz'); if (dot) dot.remove(); td.removeAttribute('title');
    if (st.crowd) { const o = (st.others[k] || { y: 0 }).y, b = st.booked[k] || [], score = o + 2 * b.length;
      const z = score >= 6 ? 3 : score >= 3 ? 2 : score >= 1 ? 1 : 0;
      if (z) { dot = document.createElement('i'); dot.className = 'hz z' + z; td.appendChild(dot); }
      td.title = t.crowdTip(o, b, st.scope); }
  });
  $('gridKey').textContent = [st.crowd ? t.crowdKey(st.scope) : '', L > 1 && short.size ? t.short(L) : ''].filter(Boolean).join(' ');
}
function tallyOf() { const c = { y: 0, m: 0, n: 0 }; for (const v of Object.values(st.entry.slots)) if (c[v] !== undefined) c[v]++; const all = st.term.days * (st.term.day_to - st.term.day_from); return { ...c, blank: all - c.y - c.m - c.n }; }
function refreshPanel() {
  const t = T(), c = tallyOf(), hw = Number(st.entry.hours_week) || 0, L = Number(st.entry.block_len) || 0, offered = c.y + c.m;
  const rows = [[t.offered, offered + ' h'], [t.blank, c.blank + ' h']];
  if (L) rows.unshift([t.blocks(L), String(usable(L))]);
  $('tally').innerHTML = rows.map(([k, v]) => `<span>${esc(k)}</span><b>${esc(v)}</b>`).join('');
  const hint = $('hint');
  if (!hw) { hint.className = 'hint'; hint.textContent = t.noLoad; }
  else if (L) { const sessions = Math.ceil(hw / L), need = 2 * sessions, have = usable(L);
    hint.className = 'hint ' + (have >= need ? 'good' : 'bad'); hint.textContent = have >= need ? t.okB : t.need(need, sessions, L); }
  else { const need = 2 * hw; hint.className = 'hint ' + (offered >= need ? 'good' : 'bad'); hint.textContent = offered >= need ? t.okB : t.needH(need); }
  $('rest').innerHTML = c.blank ? `<p class="small" style="margin:10px 0 6px">${esc(t.rest(c.blank))}</p><div class="row2"><button type="button" class="ab sm" id="rN"><span class="sw n">✕</span>${esc(t.restN)}</button><button type="button" class="ab sm" id="rM"><span class="sw m">–</span>${esc(t.restM)}</button></div>` : '';
  const fillRest = v => { const term = st.term; for (let d = 1; d <= term.days; d++) for (let h = term.day_from; h < term.day_to; h++) if (!st.entry.slots[K(d, h)]) setSlot(K(d, h), v); refreshGrid(); queueSave(); };
  if ($('rN')) { $('rN').onclick = () => fillRest('n'); $('rM').onclick = () => fillRest('m'); }
  const canSend = !c.blank && hw > 0;
  $('bSend').disabled = !canSend;
  $('sendState').innerHTML = st.entry.submitted_at ? `<span class="sent">✓ ${esc(t.sentAt)} · ${fWhen(st.entry.submitted_at)}</span>` : `<span class="draft">${esc(canSend ? t.draft : t.sendNo)}</span>`;
}
function drawAway() {
  const t = T(), l = st.entry.away || [];
  $('awayList').innerHTML = l.length ? l.map((a, i) => `<div class="away"><span>${fDay(a.from)}${a.to !== a.from ? ' – ' + fDay(a.to) : ''}${a.why ? ' · ' + esc(a.why) : ''}</span><button type="button" data-rm="${i}" title="×">✕</button></div>`).join('') : `<span class="small muted">${esc(t.awayNone)}</span>`;
  $('awayList').querySelectorAll('[data-rm]').forEach(b => b.onclick = () => { st.entry.away.splice(Number(b.dataset.rm), 1); drawAway(); queueSave(); });
}
function setState(cls, text) { const s = $('state'); if (s) { s.className = 'state ' + cls; s.textContent = text; } }
function showState() { const t = T(); if (st.saving) setState('busy', t.saving); else if (st.failed) setState('err', st.failMsg || t.failed); else if (st.dirty) setState('busy', t.unsaved); else setState('ok', st.lastSaved ? `${t.saved} · ${fWhen(st.lastSaved)}` : ''); }

/* ---- saving: a moment after the last change, never twice at once; "send" is a save that asks to be final ---- */
function queueSave() { st.dirty = true; showState(); clearTimeout(st.timer); st.timer = setTimeout(save, 900); }
async function save(submit) {
  clearTimeout(st.timer);
  if (st.saving) { if (submit) setTimeout(() => save(true), 400); return; }
  if (!st.dirty && !submit) return;
  st.saving = true; st.failMsg = null; showState();
  const e = st.entry;
  const body = { slots: e.slots, hours_week: e.hours_week, hours_max: e.hours_max, max_day: e.max_day, block_len: e.block_len, away: e.away, tags: e.tags, note: e.note, submit: !!submit };
  try { const r = await call('PUT', `/me/availability/${st.term.id}`, body); st.lastSaved = r.updated_at; st.entry.submitted_at = r.submitted_at; st.dirty = false; st.failed = false;
    const tm = st.terms.find(x => x.id === st.term.id); if (tm) { tm.filled_at = r.updated_at; tm.counts = r.counts; tm.submitted_at = r.submitted_at; } }
  catch (err) { st.failed = true; if (err.status === 400) st.failMsg = err.message; }
  st.saving = false; showState(); refreshPanel();
  const o = $('pTerm') && $('pTerm').selectedOptions[0]; if (o) { const x = st.terms.find(y => y.id === st.term.id); o.textContent = `${x.department} · ${x.label} · ${x.submitted_at ? T().sentS : x.filled_at ? T().filled : T().notfilled}`; }
  if (st.dirty) queueSave();
}
window.addEventListener('beforeunload', ev => { if (st.dirty || st.saving) { ev.preventDefault(); ev.returnValue = T().leave; } });
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'hidden' && st.dirty) save(); });

$('bOut').onclick = async () => { if (st.dirty) await save(); await call('POST', '/auth/logout').catch(() => {}); ls.del(SKEY); gate(); };
AdminUI.icons(document.querySelector('.ahd'));
start();
})();
</script>
</body>
</html>

<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>OMBA401 · Your progress</title>
<meta name="description" content="Your personal OMBA401 progress: which lesson sections and homework problems you have completed, what is still left, and where to pick up.">
<meta name="theme-color" content="#2C5530">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>✅</text></svg>">
<style>
:root{
  --green-deep:#2C5530; --green:#4A8B3A; --green-bright:#6FB544; --green-pale:#E8F2E2;
  --sand:#F4EDE0; --sand-deep:#E5D9C3; --ink:#1A2B1C; --ink-soft:#3D4F3E; --grey:#6B7A6C;
  --white:#FFFFFF; --gold:#C9A227;
  --shadow:0 18px 50px -20px rgba(44,85,48,0.35);
}
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:'Helvetica Neue',Helvetica,Arial,sans-serif;color:var(--ink);background:var(--sand);line-height:1.6;-webkit-font-smoothing:antialiased;}
h1,h2,h3,h4{font-family:Georgia,'Times New Roman',serif;}
.wrap{max-width:900px;margin:0 auto;padding:44px 22px 80px;}

.hero{text-align:center;margin-bottom:24px;}
.eyebrow{font-size:11.5px;letter-spacing:4px;text-transform:uppercase;color:var(--green);font-weight:700;}
.hero h1{font-size:clamp(28px,4.4vw,40px);line-height:1.14;margin:13px auto 11px;}
.hero h1 em{font-style:italic;color:var(--green);}
.hero .sub{font-size:15.5px;color:var(--ink-soft);max-width:60ch;margin:0 auto;}

/* identity */
.who{display:flex;align-items:center;gap:14px;flex-wrap:wrap;background:var(--white);border:1px solid var(--sand-deep);
  border-radius:18px;padding:16px 20px;margin-bottom:16px;box-shadow:var(--shadow);}
.who.anon{border-left:5px solid var(--gold);}
.who .ic{font-size:22px;flex:none;}
.who .txt{flex:1;min-width:200px;font-size:13.5px;color:var(--ink-soft);}
.who .txt b{color:var(--ink);font-size:15px;}
.btn{background:var(--green);color:#fff;border:none;border-radius:30px;padding:9px 18px;
  font:700 13px 'Helvetica Neue',Arial,sans-serif;cursor:pointer;flex:none;}
.btn:hover{background:var(--green-deep);}
.btn.ghost{background:transparent;color:var(--green-deep);border:1.5px solid var(--green);}
.btn.ghost:hover{background:var(--green-pale);}

/* headline numbers */
.tot{display:grid;grid-template-columns:repeat(auto-fit,minmax(148px,1fr));gap:13px;margin-bottom:16px;}
.tstat{background:var(--white);border:1px solid var(--sand-deep);border-radius:16px;padding:20px 14px;text-align:center;box-shadow:var(--shadow);}
.tstat .n{font-family:Georgia,serif;font-size:31px;font-weight:700;color:var(--green);line-height:1.05;}
.tstat .l{font-size:12px;color:var(--ink-soft);margin-top:7px;line-height:1.35;}

.bar{height:11px;border-radius:20px;background:var(--sand-deep);overflow:hidden;}
.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--green),var(--green-bright));border-radius:20px;transition:width .5s;}

/* week rows */
.wk{background:var(--white);border:1px solid var(--sand-deep);border-radius:20px;padding:0;margin-bottom:14px;
  box-shadow:var(--shadow);overflow:hidden;}
.wk.done{border-color:rgba(74,139,58,0.55);}
.wkhead{display:flex;align-items:center;gap:14px;padding:19px 22px;cursor:pointer;}
.wkhead:hover{background:rgba(232,242,226,0.4);}
.wkhead .kn{font-family:Georgia,serif;font-size:13px;color:var(--green);font-weight:700;letter-spacing:1px;text-transform:uppercase;flex:none;width:62px;}
.wkhead .mid{flex:1;min-width:0;}
.wkhead h3{font-size:17.5px;line-height:1.25;}
.wkhead .meta{font-size:12.5px;color:var(--grey);margin-top:3px;}
.pill{font-size:10.5px;letter-spacing:1px;text-transform:uppercase;font-weight:700;padding:4px 11px;border-radius:20px;flex:none;white-space:nowrap;}
.pill.no{background:var(--sand);color:var(--grey);border:1px solid var(--sand-deep);}
.pill.part{background:rgba(201,162,39,0.15);color:#8a6d14;border:1px solid rgba(201,162,39,0.5);}
.pill.yes{background:var(--green);color:#fff;}
.chev{flex:none;color:var(--grey);font-size:13px;transition:transform .2s;}
.wk.open .chev{transform:rotate(90deg);}
.wkbody{display:none;padding:0 22px 20px;border-top:1px solid var(--sand-deep);}
.wk.open .wkbody{display:block;}

.grp{margin-top:16px;}
.grp h4{font-size:10.5px;letter-spacing:1.6px;text-transform:uppercase;color:var(--green-deep);font-weight:700;
  font-family:'Helvetica Neue',Arial,sans-serif;margin-bottom:9px;display:flex;gap:9px;align-items:baseline;}
.grp h4 span{color:var(--grey);letter-spacing:0;text-transform:none;font-weight:400;font-size:12px;}
.secs{list-style:none;}
.secs li{display:flex;align-items:flex-start;gap:10px;padding:5px 0;font-size:14px;color:var(--ink-soft);}
.secs li .bx{flex:none;width:19px;height:19px;border-radius:6px;border:2px solid var(--sand-deep);
  display:flex;align-items:center;justify-content:center;font-size:11px;color:#fff;margin-top:2px;}
.secs li.on .bx{background:var(--green);border-color:var(--green);}
.secs li.on{color:var(--grey);}
.secs li .nm{flex:1;}
.secs li .nu{color:var(--green);font-weight:700;font-size:12.5px;flex:none;width:30px;}
.acts{margin-top:14px;display:flex;gap:9px;flex-wrap:wrap;}
.acts a{text-decoration:none;font-size:12.5px;font-weight:700;color:var(--green-deep);
  border:1.5px solid var(--green);border-radius:30px;padding:7px 15px;}
.acts a:hover{background:var(--green-pale);}
.acts a.solid{background:var(--green);color:#fff;border-color:var(--green);}
.acts a.solid:hover{background:var(--green-deep);}

/* what's left */
.left{background:var(--green-deep);border-radius:20px;padding:26px 24px;margin:26px 0 0;color:#fff;box-shadow:var(--shadow);}
.left h3{font-size:12px;letter-spacing:3px;text-transform:uppercase;color:var(--green-bright);margin-bottom:13px;
  font-family:'Helvetica Neue',Arial,sans-serif;font-weight:700;}
.left ul{list-style:none;}
.left li{font-size:14px;padding:7px 0 7px 24px;position:relative;color:rgba(255,255,255,0.9);border-bottom:1px solid rgba(255,255,255,0.09);}
.left li:last-child{border-bottom:none;}
.left li:before{content:"▸";position:absolute;left:2px;color:var(--gold);}
.left li a{color:#fff;font-weight:700;text-decoration:none;border-bottom:1px solid rgba(255,255,255,.4);}
.left li a:hover{border-color:#fff;}
.left .allclear{font-size:15px;color:#fff;}

.note{font-size:12.5px;color:var(--grey);font-style:italic;margin-top:16px;text-align:center;}
.foot{text-align:center;color:var(--grey);font-size:12.5px;margin-top:34px;}
.backlink{display:inline-block;font-size:13px;color:var(--green-deep);text-decoration:none;
  border:1.5px solid var(--green);border-radius:30px;padding:8px 18px;font-weight:600;margin:0 5px 10px;background:var(--white);}
.backlink:hover{background:var(--green-pale);}
@media (max-width:600px){
  .wrap{padding:32px 15px 60px;}
  .wkhead{padding:16px 15px;gap:10px;}
  .wkhead .kn{width:auto;}
  .wkbody{padding:0 15px 18px;}
}
</style>
</head>
<body>
<div class="wrap">

  <div class="hero">
    <div class="eyebrow">OMBA401 · Quantitative Methods · SUMAS</div>
    <h1>Your <em>progress</em></h1>
    <p class="sub">Everything you have finished, and everything still waiting — so you never have to guess where you stopped or redo a problem you already got right.</p>
  </div>

  <div class="who" id="who"></div>

  <div class="tot" id="tot"></div>

  <div id="weeks"></div>

  <div class="left" id="left"></div>

  <p class="note" id="scopeNote"></p>

  <div class="foot">
    <a class="backlink" href="index.html">← Course hub</a>
    <a class="backlink" href="notation.html">🔑 Symbols &amp; formulas key</a><br>
    © 2026 Jan Erik Meidell · SUMAS · OMBA401
  </div>

</div>

<script>
/* =====================================================================
   OMBA401 · student-facing progress dashboard (read-only).
   Reads the same localStorage that progress.js writes, and — when the
   student has entered their name — merges in their record from the
   Realtime DB so the picture survives a change of browser or device.
   Writes nothing except through progress.js's own name box.
   ===================================================================== */
var DB="https://teaching-70f1c-default-rtdb.europe-west1.firebasedatabase.app";
var NS="omba401";

var WEEKS=[
 {n:1,mod:'w1',hw:'w1-hw',dates:'6–12 Jul',title:'Data, Decisions &amp; First Pictures',hwTitle:'Interrogate the Data',hwTotal:29,
  secs:[['s1','1.1','Your first board meeting'],['s2','1.2','The two jobs of statistics'],['s3','1.3','Know your variables'],
        ['s4','1.4','Where numbers are born'],['s5','1.5','The first honest look'],['s6','1.6','Checkpoint']]},
 {n:2,mod:'w2',hw:'w2-hw',dates:'13–19 Jul',title:'Descriptive Statistics',hwTitle:'Summarise It Defensibly',hwTotal:22,
  secs:[['s1','2.1','One number for the board'],['s2','2.2','Mean, median &amp; mode'],['s3','2.3','Range, IQR &amp; std dev'],
        ['s4','2.4','Position &amp; boxplots'],['s5','2.5','Shape &amp; outliers'],['s6','2.6','Checkpoint &amp; toolkit']]},
 {n:3,mod:'w3',hw:'w3-hw',dates:'20–26 Jul',title:'Probability &amp; Distributions',hwTitle:'Reason Under Uncertainty',hwTotal:22,
  secs:[['s1','3.1','The "95% accurate" trap'],['s2','3.2','How chances combine'],['s3','3.3','The flagged card, by counting'],
        ['s4','3.4','Discrete distributions'],['s5','3.5','The bell curve'],['s6','3.6','Checkpoint &amp; toolkit']]},
 {n:4,mod:'w4',hw:'w4-hw',dates:'27 Jul – 2 Aug',title:'Sampling Distributions &amp; Estimation',hwTitle:'From a Sample to a Statement',hwTotal:22,
  secs:[['s1','4.1','The 62% that isn’t'],['s2','4.2','Why a sample can speak'],['s3','4.3','The standard error'],
        ['s4','4.4','Confidence intervals for a mean'],['s5','4.5','Proportions &amp; sample size'],['s6','4.6','Checkpoint &amp; toolkit']]},
 {n:5,mod:'w5',hw:'w5-hw',dates:'3–9 Aug',title:'Hypothesis Tests · One &amp; Two Samples',hwTitle:'Is That Difference Real?',hwTotal:22,
  secs:[['s1','5.1','The 80-centime question'],['s2','5.2','Innocent until proven'],['s3','5.3','From a gap to a p-value'],
        ['s4','5.4','Four ways to be wrong'],['s5','5.5','Comparing two groups'],['s6','5.6','Checkpoint &amp; toolkit']]}
];

var state={};   /* mod -> {done:{}, secs:0, score:''} */

function blank(){return {done:{},secs:0,score:''};}
function slot(mod){return state[mod]||(state[mod]=blank());}

function readLocal(){
  WEEKS.forEach(function(w){
    [w.mod,w.hw].forEach(function(mod){
      var s=slot(mod);
      try{
        var d=JSON.parse(localStorage.getItem(NS+'_done_'+mod)||'{}')||{};
        Object.keys(d).forEach(function(k){if(d[k])s.done[k]=true;});
        s.secs=Math.max(s.secs,parseInt(localStorage.getItem(NS+'_secs_'+mod)||'0',10)||0);
        s.score=localStorage.getItem(NS+'_score_'+mod)||s.score;
      }catch(e){}
    });
  });
}

/* merge the server's copy on top — union of what's done, whichever time is larger */
function mergeRemote(rec){
  if(!rec||!rec.mod)return;
  Object.keys(rec.mod).forEach(function(mod){
    var r=rec.mod[mod]||{}, s=slot(mod);
    if(r.done)Object.keys(r.done).forEach(function(k){if(r.done[k])s.done[k]=true;});
    s.secs=Math.max(s.secs,parseInt(r.secs,10)||0);
    if(r.score&&!s.score)s.score=r.score;
  });
}

function countDone(mod,valid){
  var s=slot(mod),n=0;
  Object.keys(s.done).forEach(function(k){
    if(k==='submitted')return;                       /* a marker, not a problem */
    if(valid&&valid.indexOf(k)<0)return;
    n++;
  });
  return n;
}
function hwDone(w){
  var s=slot(w.hw),n=0;
  Object.keys(s.done).forEach(function(k){if(k!=='submitted'&&s.done[k])n++;});
  return Math.min(n,w.hwTotal);
}
function mins(sec){
  if(!sec)return '—';
  if(sec<3600)return Math.round(sec/60)+' min';
  var h=Math.floor(sec/3600),m=Math.round((sec%3600)/60);
  return h+' h'+(m?' '+m+' min':'');
}
function esc(s){return String(s).replace(/[&<>]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;'}[c];});}

function render(){
  var totDone=0,totAll=0,totSecs=0,weeksDone=0,left=[];

  document.getElementById('weeks').innerHTML=WEEKS.map(function(w){
    var ids=w.secs.map(function(s){return s[0];});
    var sd=countDone(w.mod,ids), st=w.secs.length;
    var hd=hwDone(w), ht=w.hwTotal;
    var secs=(slot(w.mod).secs||0)+(slot(w.hw).secs||0);
    var done=sd+hd, all=st+ht;
    totDone+=done; totAll+=all; totSecs+=secs;
    var complete=(sd>=st&&hd>=ht);
    if(complete)weeksDone++;

    if(sd<st){
      var first=w.secs.filter(function(s){return !slot(w.mod).done[s[0]];})[0];
      left.push('Week '+w.n+' lesson — '+(st-sd)+' section'+(st-sd===1?'':'s')+' left, next is '+
                '<a href="week'+w.n+'.html">§'+first[1]+' '+first[2]+'</a>');
    }
    if(hd<ht){
      left.push('Week '+w.n+' homework — '+(ht-hd)+' of '+ht+' problems still unsolved '+
                '<a href="week'+w.n+'-homework.html">(open it)</a>');
    }

    var pill = complete ? '<span class="pill yes">Complete</span>'
             : (done>0 ? '<span class="pill part">'+Math.round(done/all*100)+'% done</span>'
                       : '<span class="pill no">Not started</span>');
    var score=slot(w.hw).score;

    return '<div class="wk'+(complete?' done':'')+'" data-wk="'+w.n+'">'+
      '<div class="wkhead">'+
        '<div class="kn">Week '+w.n+'</div>'+
        '<div class="mid"><h3>'+w.title+'</h3>'+
          '<div class="meta">'+w.dates+' · '+sd+'/'+st+' sections · '+hd+'/'+ht+' problems'+
          (secs?' · '+mins(secs)+' spent':'')+'</div>'+
          '<div class="bar" style="margin-top:9px;"><i style="width:'+(all?Math.round(done/all*100):0)+'%"></i></div>'+
        '</div>'+
        pill+'<span class="chev">▶</span>'+
      '</div>'+
      '<div class="wkbody">'+
        '<div class="grp"><h4>Lesson <span>'+sd+' of '+st+' sections</span></h4>'+
          '<ul class="secs">'+w.secs.map(function(s){
            return '<li class="'+(slot(w.mod).done[s[0]]?'on':'')+'"><span class="bx">✓</span>'+
                   '<span class="nu">'+s[1]+'</span><span class="nm">'+s[2]+'</span></li>';
          }).join('')+'</ul></div>'+
        '<div class="grp"><h4>Homework · '+w.hwTitle+' <span>'+hd+' of '+ht+' problems'+
          (score?' · submitted '+esc(score):'')+'</span></h4>'+
          '<div class="bar"><i style="width:'+Math.round(hd/ht*100)+'%"></i></div></div>'+
        '<div class="acts">'+
          '<a class="'+(sd<st?'solid':'')+'" href="week'+w.n+'.html">'+(sd?(sd<st?'Resume the lesson':'Revisit the lesson'):'Start the lesson')+'</a>'+
          '<a class="'+(sd>=st&&hd<ht?'solid':'')+'" href="week'+w.n+'-homework.html">'+(hd?(hd<ht?'Finish the homework ('+(ht-hd)+' left)':'Revisit the homework'):'Start the homework')+'</a>'+
          '<a href="notation.html#w'+w.n+'">Week '+w.n+' symbols</a>'+
        '</div>'+
      '</div>'+
    '</div>';
  }).join('');

  document.getElementById('tot').innerHTML=
    '<div class="tstat"><div class="n">'+(totAll?Math.round(totDone/totAll*100):0)+'%</div><div class="l">of everything released<br>so far</div></div>'+
    '<div class="tstat"><div class="n">'+totDone+'</div><div class="l">items completed<br>of '+totAll+'</div></div>'+
    '<div class="tstat"><div class="n">'+weeksDone+'</div><div class="l">weeks finished<br>end to end</div></div>'+
    '<div class="tstat"><div class="n">'+mins(totSecs)+'</div><div class="l">time on the<br>course pages</div></div>';

  document.getElementById('left').innerHTML='<h3>What is still waiting</h3>'+
    (left.length ? '<ul>'+left.map(function(x){return '<li>'+x+'</li>';}).join('')+'</ul>'
                 : '<p class="allclear">Nothing — every section and every problem released so far is done. Week 6 opens on 10 August.</p>');

  /* open the first week that is not finished */
  var firstOpen=document.querySelector('.wk:not(.done)')||document.querySelector('.wk');
  if(firstOpen)firstOpen.classList.add('open');
}

function renderWho(){
  var named=window.StatsTrack&&StatsTrack.identified&&StatsTrack.identified();
  var el=document.getElementById('who');
  el.className='who'+(named?'':' anon');
  el.innerHTML= named
    ? '<span class="ic">👤</span><div class="txt"><b>'+esc(StatsTrack.name())+'</b><br>'+
      'Your progress syncs to your professor and follows you between devices. This page merges what is stored here with what has been synced.</div>'+
      '<button class="btn ghost" id="reload">Refresh from the server</button>'
    : '<span class="ic">⚠️</span><div class="txt"><b>You have not entered your name</b><br>'+
      'Everything below is read from <em>this browser only</em>, and nothing has been sent to your professor. Add your name and all of it — including work you did before — is synced and will follow you to any device.</div>'+
      '<button class="btn" id="setname">Add my name</button>';
  var b=document.getElementById('setname');
  if(b)b.addEventListener('click',function(){if(window.StatsTrack)StatsTrack.askName();});
  var r=document.getElementById('reload');
  if(r)r.addEventListener('click',function(){r.textContent='Refreshing…';pullRemote(true);});

  document.getElementById('scopeNote').textContent = named
    ? 'Section ticks and solved problems are stored in this browser and synced under your name. Ticking a section happens automatically when you open it.'
    : 'Without a name, this page can only see what this browser remembers. Use a different computer and it will look empty — nothing is lost, but nothing is shared either.';
}

function pullRemote(force){
  var sid='';
  try{sid=localStorage.getItem(NS+'_sid')||'';}catch(e){}
  if(!sid){render();return;}
  fetch(DB+'/'+NS+'/'+encodeURIComponent(sid)+'.json'+(force?'?ts='+Date.now():''))
    .then(function(r){return r.json();})
    .then(function(rec){mergeRemote(rec);render();renderWho();})
    .catch(function(){render();});
}

document.addEventListener('click',function(e){
  var h=e.target.closest('.wkhead');
  if(h)h.parentNode.classList.toggle('open');
});

/* naming yourself from here should redraw the page against the synced record */
window.addEventListener('statstrack:named',function(){
  renderWho();
  setTimeout(function(){pullRemote(true);},900);   /* let the backfill land first */
});

readLocal();
render();
/* progress.js loads deferred, so wait for it before drawing the identity strip */
window.addEventListener('DOMContentLoaded',function(){
  if(window.StatsTrack)StatsTrack.attach();   /* identity only — this page records nothing */
  renderWho();
  pullRemote(false);
});
</script>
<script src="progress.js" defer></script>
<script src="/track.js" defer></script>
</body>
</html>

<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<base href="/HEG/statistics/">
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>The revision game · Applied Statistics · HEG</title>
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#002C46">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🎮</text></svg>">
<link rel="stylesheet" href="/shared/themes/heg.css">
<script src="/shared/theme.js"></script>
<link rel="stylesheet" href="stats.css">
<script src="revision.js"></script>
<style>
/* =====================================================================
   APPLIED STATISTICS · THE REVISION GAME — the player's page (25 Nov 2026),
   a copy of Kalaidos/fl3/revision.html (24 Nov 2026). The instructor's
   screen (revision-tv.html) writes statistics/_release/revision/state =
   {g, q, phase:'lobby'|'q'|'rev'|'end', started, ts}; this page polls it
   every second and, on a question, shows the four buttons and a bar
   that empties in REV_TIME seconds, counted from the moment THIS page saw
   the question. One click: {a, t, n, ts} is PUT at
   statistics/<sid>/kahoot/<g>/<q> (the student's own node); the screen reads
   every player's answers. The player sees right/wrong and the points
   after the reveal, and their own total; the ranking is on the screen.
   Needs the course sign-in (login.js): a player without a sid cannot
   score.
   ===================================================================== */
.g{max-width:640px;margin:0 auto;padding:18px 16px 60px;}
.st{font-size:12px;letter-spacing:2px;text-transform:uppercase;font-weight:800;color:var(--accent-deep);margin-bottom:6px;}
.qn{font-size:13px;color:var(--grey);margin-bottom:4px;}
.qt{font-size:clamp(18px,3.2vw,24px);font-weight:800;line-height:1.3;color:var(--ink);margin:8px 0 14px;}
.bar{height:10px;background:var(--wash,#E6EBEF);border-radius:5px;overflow:hidden;margin:0 0 14px;}
.bar i{display:block;height:100%;background:var(--accent);transition:width .25s linear;}
.ans{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
@media(max-width:480px){.ans{grid-template-columns:1fr;}}
.ans button{display:flex;gap:10px;align-items:center;text-align:left;border:2px solid var(--line);background:var(--card,#fff);border-radius:14px;padding:14px 14px;font:700 15px inherit;color:var(--ink);cursor:pointer;min-height:64px;}
.ans button b{flex:none;width:34px;height:34px;border-radius:9px;color:#fff;display:flex;align-items:center;justify-content:center;font-size:16px;}
.ans button:nth-child(1) b{background:#C0392B;} .ans button:nth-child(2) b{background:#1F6FB2;} .ans button:nth-child(3) b{background:#C98A12;} .ans button:nth-child(4) b{background:#2F855A;}
.ans button.on{border-color:var(--accent);background:var(--accent-pale);}
.ans button.ok{border-color:#2F855A;background:rgba(47,133,90,.12);} .ans button.no{border-color:#B3261E;background:rgba(179,38,30,.08);opacity:.75;}
.ans button:disabled{cursor:default;}
.big{text-align:center;padding:30px 10px;}
.big .n{font-size:56px;font-weight:800;color:var(--accent-deep);line-height:1;font-variant-numeric:tabular-nums;}
.big .l{font-size:14px;color:var(--grey);margin-top:6px;}
.res{margin-top:14px;border-radius:14px;padding:12px 14px;font-size:14.5px;}
.res.ok{background:rgba(47,133,90,.12);border:1px solid #2F855A;} .res.no{background:rgba(179,38,30,.08);border:1px solid #B3261E;}
.tot{display:flex;justify-content:space-between;align-items:baseline;margin-top:14px;font-size:13px;color:var(--grey);}
.tot b{font-size:22px;color:var(--navy);font-variant-numeric:tabular-nums;}
.who{font-size:13px;color:var(--grey);}
.wait{text-align:center;color:var(--grey);padding:40px 10px;font-size:16px;}
.wait .dots::after{content:'…';animation:d 1.5s infinite;}
@keyframes d{0%{content:'';}33%{content:'.';}66%{content:'..';}100%{content:'...';}}
</style>
</head>
<body data-course="statistics">

<div class="topbar">
  <div class="topbar-inner">
    <img class="brand" src="logo_heg-ge.svg" alt="HEG Genève">
    <span class="course">APPLIED STATISTICS · REVISION GAME</span>
    <span class="who" id="topWho"></span>
    <span class="tb-spacer"></span>
    <a class="home" href="index.html">← Course</a>
  </div>
</div>

<div class="g">
  <div class="card" id="box">
    <div class="wait">Loading<span class="dots"></span></div>
  </div>
  <p class="who" id="me"></p>
</div>

<script src="/shared/config.js"></script>
<script src="/shared/login.js" defer></script>
<script>
(function(){
var DB=(window.CourseConfig&&CourseConfig.DB)||'https://teaching-70f1c-default-rtdb.europe-west1.firebasedatabase.app',NS='statistics';
var BANK=window.REV_BANK,box=document.getElementById('box'),me=document.getElementById('me');
function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];});}
function auth(){try{var a=JSON.parse(localStorage.getItem('stats_auth')||'null');return a&&a.sid&&a.sid.charAt(0)!=='_'?a:null;}catch(e){return null;}}
var S=null,seenQ=null,seenAt=0,mine={},timer=null,lastKey='';
function store(){try{if(S&&S.g)localStorage.setItem('stats_rev_'+S.g,JSON.stringify(mine));}catch(e){}}
function load(g){try{mine=JSON.parse(localStorage.getItem('stats_rev_'+g)||'{}')||{};}catch(e){mine={};}}
function total(){var t=0;Object.keys(mine).forEach(function(q){var m=mine[q],it=BANK[+q];if(m&&it)t+=REV_POINTS(it,m.a===it.a,m.t);});return t;}
function paint(){
  var a=auth();
  me.innerHTML=a?'You are playing as <b>'+esc(a.name||a.sid)+'</b>.':'⚠ <b>Sign in</b> (the button at the bottom right). Without a name, your answers do not count.';
  var w=document.getElementById('topWho');if(w&&a){w.textContent='👤 '+(a.name||a.sid);w.classList.add('on');}
  if(!S||!S.g||S.phase==='lobby'){box.innerHTML='<div class="st">The revision game · Weeks 1 to 9</div><div class="wait">'+(S&&S.g?'The game is about to start. Look at the screen<span class="dots"></span>':'No game is running. Wait until your instructor starts it<span class="dots"></span>')+'</div><p style="font-size:13.5px;color:var(--ink-soft);margin:0;">Thirty questions on Weeks 1 to 9, easy ones first. Each question has four answers and 30 seconds: tap the right one <b>as fast as you can</b>. A right answer earns 500 points, plus up to 500 points for speed. A wrong answer or no answer earns 0. The ranking is on the screen in the room.</p>';return;}
  var q=BANK[S.q];
  if(S.phase==='end'){box.innerHTML='<div class="st">The game is over</div><div class="big"><div class="n">'+total()+'</div><div class="l">points · your total over '+BANK.length+' questions</div></div><p style="text-align:center;color:var(--grey);font-size:13.5px;">The ranking is on the screen. The questions you missed are the ones to revise before the exam.</p>';return;}
  if(!q)return;
  var m=mine[S.q],T=REV_TIME(q)*1000;
  var head='<div class="st">Question '+(S.q+1)+' / '+BANK.length+' · Week '+q.s+' · '+(q.lvl===1?'easy':'medium')+'</div><div class="qt">'+q.q+'</div>';
  if(S.phase==='q'){
    var left=Math.max(0,T-(Date.now()-seenAt));
    box.innerHTML=head+'<div class="bar"><i id="barFill" style="width:'+(left/T*100)+'%"></i></div><div class="ans">'+q.opts.map(function(o,j){return '<button data-j="'+j+'"'+(m?' disabled':'')+(m&&m.a===j?' class="on"':'')+'><b>'+'ABCD'[j]+'</b><span>'+o+'</span></button>';}).join('')+'</div>'+(m?'<p style="text-align:center;color:var(--grey);font-size:13px;margin-top:10px;">Answer sent in '+(m.t/1000).toFixed(1)+' s. The right answer appears on the screen.</p>':'');
    box.querySelectorAll('.ans button').forEach(function(b){b.addEventListener('click',function(){answer(+b.dataset.j);});});
  }else{ /* rev */
    var ok=m&&m.a===q.a,pts=m?REV_POINTS(q,ok,m.t):0;
    box.innerHTML=head+'<div class="ans">'+q.opts.map(function(o,j){return '<button disabled class="'+(j===q.a?'ok':(m&&m.a===j?'no':''))+'"><b>'+'ABCD'[j]+'</b><span>'+o+'</span></button>';}).join('')+'</div>'+
      '<div class="res '+(ok?'ok':'no')+'"><b>'+(m?(ok?'✓ Right · +'+pts+' points':'✗ Wrong · 0 points'):'— No answer · 0 points')+'</b><br>'+q.w+'</div>'+
      '<div class="tot"><span>Your total</span><b>'+total()+' pts</b></div>';
  }
}
function answer(j){
  if(!S||S.phase!=='q'||mine[S.q])return;
  var t=Math.min(REV_TIME(BANK[S.q])*1000,Date.now()-seenAt),a=auth();
  mine[S.q]={a:j,t:t};store();paint();
  if(!a)return;
  var body={a:j,t:t,n:a.name||a.sid,ts:Date.now()};
  fetch(DB+'/'+NS+'/'+encodeURIComponent(a.sid)+'/kahoot/'+encodeURIComponent(S.g)+'/'+S.q+'.json',{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)}).catch(function(){});
}
function tick(){if(!S||S.phase!=='q')return;var f=document.getElementById('barFill');if(!f)return;var T=REV_TIME(BANK[S.q])*1000,left=Math.max(0,T-(Date.now()-seenAt));f.style.width=(left/T*100)+'%';}
function poll(){
  if(document.hidden)return;
  fetch(DB+'/'+NS+'/_release/revision/state.json').then(function(r){return r.ok?r.json():null;}).then(function(j){
    var key=j?[j.g,j.q,j.phase,j.started].join('|'):'none';
    if(key===lastKey)return;lastKey=key;
    if(!j||!S||j.g!==S.g){load(j&&j.g);}
    S=j;
    if(S&&S.phase==='q'&&seenQ!==S.g+':'+S.q){seenQ=S.g+':'+S.q;seenAt=Date.now();}
    paint();
  }).catch(function(){});
}
poll();setInterval(poll,1000);setInterval(tick,200);
})();
</script>
<script src="/track.js" defer></script>
</body>
</html>

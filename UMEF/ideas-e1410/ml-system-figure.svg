<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 462" role="img"
     aria-labelledby="mlsysTitle mlsysDesc" preserveAspectRatio="xMidYMid meet">
  <title id="mlsysTitle">Only a small fraction of a real-world ML system is ML code</title>
  <desc id="mlsysDesc">A diagram of a production machine-learning system. The box labelled "ML Code" is
  tiny; it is surrounded by much larger boxes for configuration, data collection, feature extraction,
  data verification, machine resource management, analysis tools, process management tools, serving
  infrastructure and monitoring. After Sculley et al., Hidden Technical Debt in Machine Learning
  Systems, NeurIPS 2015.</desc>
  <g font-family="'Plus Jakarta Sans','Helvetica Neue',Helvetica,Arial,sans-serif"
     font-size="29" fill="#111" text-anchor="middle">

    <!-- Configuration -->
    <rect x="9" y="68" width="231" height="272" fill="#ffffff" stroke="#111" stroke-width="2.5"/>
    <text x="124" y="214">Configuration</text>

    <!-- Data Collection -->
    <rect x="248" y="93" width="252" height="197" fill="#f6f6f6" stroke="#111" stroke-width="2.5"/>
    <text x="374" y="202">Data Collection</text>

    <!-- Feature Extraction -->
    <rect x="264" y="308" width="326" height="147" fill="#dcdcdc" stroke="#111" stroke-width="2.5"/>
    <text x="427" y="373">Feature</text>
    <text x="427" y="408">Extraction</text>

    <!-- Data Verification -->
    <rect x="512" y="33" width="210" height="205" fill="#a9a9a9" stroke="#111" stroke-width="2.5"/>
    <text x="617" y="130">Data</text>
    <text x="617" y="165">Verification</text>

    <!-- ML Code — the point of the whole figure -->
    <rect x="542" y="242" width="77" height="48" fill="#000000"/>
    <text x="580" y="264" font-size="15" fill="#ffffff" font-weight="600">ML</text>
    <text x="580" y="281" font-size="15" fill="#ffffff" font-weight="600">Code</text>

    <!-- Machine Resource Management -->
    <rect x="734" y="52" width="224" height="176" fill="#e2e2e2" stroke="#111" stroke-width="2.5"/>
    <text x="846" y="117">Machine</text>
    <text x="846" y="152">Resource</text>
    <text x="846" y="187">Management</text>

    <!-- Analysis Tools -->
    <rect x="636" y="253" width="322" height="61" fill="#efefef" stroke="#111" stroke-width="2.5"/>
    <text x="797" y="294">Analysis Tools</text>

    <!-- Process Management Tools -->
    <rect x="641" y="338" width="304" height="110" fill="#c9c9c9" stroke="#111" stroke-width="2.5"/>
    <text x="793" y="387">Process</text>
    <text x="793" y="422">Management Tools</text>

    <!-- Serving Infrastructure -->
    <rect x="976" y="4" width="224" height="451" fill="#ffffff" stroke="#111" stroke-width="2.5"/>
    <text x="1088" y="226">Serving</text>
    <text x="1088" y="261">Infrastructure</text>

    <!-- Monitoring -->
    <rect x="1213" y="38" width="182" height="190" fill="#d9d9d9" stroke="#111" stroke-width="2.5"/>
    <text x="1304" y="145">Monitoring</text>
  </g>
</svg>

<!doctype html>
<html lang="fr">
<head>
<meta charset="UTF-8" />
<base href="/UMEF/gestion-agile/">
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Jeopardy · MPM 503 · Swiss UMEF</title>
<meta name="robots" content="noindex, nofollow">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🎲</text></svg>">
<style>
/* =====================================================================
   MPM 503 · Jeopardy for the room screen (24 Nov 2026) — gen110's engine,
   copied unchanged (6 columns, teams A–F, scores in this browser only:
   mpm503_jeo_<set>). One set, ?set=syn = journées 1 à 5 for journée 6's
   synthesis; the last column, « Votre projet », asks the team about its
   own project. Projector page: no progress, no sign-in, never counted.
   Every answer is the day pages' own wording.
   ===================================================================== */
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:"Helvetica Neue",Helvetica,Arial,sans-serif;background:linear-gradient(160deg,#0F4C60,#232A31);color:#fff;min-height:100vh;}
.top{display:flex;align-items:center;gap:14px;padding:14px 20px;}
.top h1{font-family:Georgia,serif;font-size:24px;}
.top .sub{color:#9FD3E6;font-size:13px;}
.top a{color:#9FD3E6;font-size:13px;text-decoration:none;margin-left:auto;}
.board{display:grid;grid-template-columns:repeat(6,1fr);gap:8px;padding:0 20px;}
.cat{background:#0A3341;border-radius:10px;padding:12px 8px;text-align:center;font-weight:800;font-size:clamp(11px,1.4vw,16px);min-height:64px;display:flex;align-items:center;justify-content:center;text-transform:uppercase;letter-spacing:.5px;}
.cat.own{background:#7A3E0E;}
.cell{background:#176B87;border:none;border-radius:10px;color:#FFD58A;font:800 clamp(20px,3.2vw,40px)/1 Georgia,serif;min-height:clamp(60px,11vh,110px);cursor:pointer;transition:.15s;}
.cell:hover{background:#2A93B0;}
.cell.used{background:rgba(255,255,255,.06);color:rgba(255,255,255,.18);cursor:default;}
.teams{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;padding:18px 20px 30px;}
.team{background:rgba(255,255,255,.08);border-radius:12px;padding:10px 16px;text-align:center;min-width:150px;}
.team input{background:transparent;border:none;border-bottom:1px dashed rgba(255,255,255,.35);color:#fff;font:800 15px inherit;text-align:center;width:100%;}
.team .sc{font:800 34px Georgia,serif;color:#FFD58A;margin-top:4px;}
#modal{position:fixed;inset:0;background:rgba(10,30,40,.95);display:none;align-items:center;justify-content:center;padding:30px;z-index:10;}
#modal.on{display:flex;}
#modal .box{max-width:1000px;width:100%;text-align:center;}
#modal .mc{color:#9FD3E6;font-size:15px;letter-spacing:2px;text-transform:uppercase;font-weight:800;}
#modal .mq{font:700 clamp(24px,3.6vw,42px)/1.25 Georgia,serif;margin:20px 0 26px;}
#modal .ma{display:none;font-size:clamp(18px,2.3vw,27px);color:#FFD58A;line-height:1.4;margin-bottom:26px;}
#modal .ma.on{display:block;}
.mb{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;}
.mb button{background:#fff;color:#0F4C60;border:none;border-radius:30px;padding:10px 16px;font:800 14px inherit;cursor:pointer;}
.mb button.ok{background:#2F855A;color:#fff;} .mb button.no{background:#9B2335;color:#fff;} .mb button.gh{background:transparent;color:#fff;border:1px solid rgba(255,255,255,.5);}
.foot{text-align:center;font-size:12px;color:#9FD3E6;padding-bottom:20px;}
.foot button{background:none;border:none;color:#9FD3E6;text-decoration:underline;cursor:pointer;font:inherit;}
</style>
</head>
<body data-course="mpm503">
<div class="top"><h1>Jeopardy</h1><span class="sub" id="setName"></span><a href="journee6.html" id="backLink">← Journée 6</a></div>
<div class="board" id="board"></div>
<div class="teams" id="teams"></div>
<div class="foot">Cliquez une case · « Réponse » · puis l’équipe qui a répondu juste (+) ou faux (−). Les noms des équipes se modifient. <button id="reset">Nouvelle partie</button></div>
<div id="modal"><div class="box"><div class="mc" id="mC"></div><div class="mq" id="mQ"></div><div class="ma" id="mA"></div><div class="mb" id="mB"></div></div></div>
<script>
var SETS={
  syn:{name:'Journées 1 à 5 · de Scrum au modèle hybride',back:'journee6.html',backName:'Journée 6',cats:[
    ['Scrum et le cycle court',[
      ['Combien de personnes au plus dans une équipe Scrum selon le Guide 2020, et quelle durée au plus pour un sprint ?','Dix personnes au plus ; un sprint d’un mois au plus.'],
      ['Que vaut un récit « presque fini » à la fin du sprint, dans la vélocité ?','Zéro. Seuls les récits acceptés selon la définition de « terminé » comptent.'],
      ['Dans le jeu du site d’une page, pourquoi la manche E (cycles de trois minutes) a-t-elle donné plus d’exigences acceptées par minute que la manche A (huit minutes sans retour) ?','Parce que le retour immédiat du client corrige l’erreur à la deuxième manche au lieu de la fin : le cycle court réduit le travail fait dans la mauvaise direction (l’étoile écrite en toutes lettres, les prix sans CHF) avant qu’il se répète.'],
      ['Qui décide du contenu d’un sprint, et qui décide comment le faire ?','Le Product Owner décide quoi (le contenu, l’ordre du backlog) ; l’équipe décide comment.'],
      ['Citez les quatre échecs documentés de la journée 1 et le point commun qui les a fait échouer.','Denver (bagages), FBI Virtual Case File, NHS NPfIT, Universal Credit : un long cycle sans retour vérifié, et pour Universal Credit « agile sans gouvernance ».']]],
    ['Backlog, estimation, flux',[
      ['Que signifie le I de INVEST ?','Indépendant : un récit se fait sans en attendre un autre.'],
      ['Vélocité moyenne 12, 60 points restants : combien de sprints, et pourquoi le simulateur donne-t-il un chiffre plus grand à 85 % ?','Cinq sprints en moyenne ; à 85 % le simulateur en donne plus, parce qu’il tire au sort des vélocités basses comme hautes : l’intervalle, pas la moyenne.'],
      ['Dans le jeu Kanban, la limite de travail en cours n’a pas changé le débit. Qu’a-t-elle changé ?','Le temps de traversée : moitié moins d’attente à l’intérieur, le surplus attend à la porte.'],
      ['Loi de Little : 24 éléments en cours, 4 terminés par jour. Temps de traversée ?','Six jours.'],
      ['Que fait la cartographie des récits (story mapping) que le backlog plat ne fait pas ?','Elle découpe par parcours de l’utilisateur et dessine la première tranche utile de bout en bout, au lieu d’une liste par priorité.']]],
    ['Le cadrage prédictif',[
      ['La règle des 100 % d’une WBS.','La somme des lots couvre tout le travail du projet, ni plus ni moins ; ce qui n’est pas dans la WBS n’est pas dans le projet.'],
      ['Réseau : A (3) → B (4) → D (2) et A (3) → C (6) → D (2). Durée du projet et marge de B ?','Onze semaines (A, C, D) ; B a deux semaines de marge.'],
      ['Pouvoir fort, intérêt faible : quel traitement sur la grille des parties prenantes ?','Satisfaire : l’informer avant qu’il ait à demander.'],
      ['« Gérer par exception » : que fait un chef de projet PRINCE2 quand il prévoit de dépasser une tolérance ?','Il rédige un rapport d’exception et le comité décide d’un plan d’exception ; en dessous des tolérances, il ne remonte rien.'],
      ['Dans HERMES 2022, qui libère la phase suivante, à quel moment, et quelles sont les trois approches ?','Le mandant, au jalon de décision de fin de phase ; classique, agile, hybride.']]],
    ['Le modèle hybride',[
      ['La différence entre un jalon et une porte de décision.','Un jalon est une date ; une porte est une décision (continuer, arrêter, réorienter) prise par une instance sur des critères écrits.'],
      ['La clause « change for free ».','Le client remplace un récit non commencé par un autre de taille égale, sans surcoût.'],
      ['BAC 100’000, 100 points ; après 3 sprints 30 points prévus, 24 acceptés, 30’000 dépensés. SPI, CPI, EAC ?','SPI 0,8 ; CPI 0,8 ; EAC 125’000.'],
      ['Ce que le burnup montre et que le burndown cache.','Le périmètre qui grandit : deux lignes, les points faits et le total.'],
      ['Le comité impose un jalon qui prend 8 points dans un sprint à vélocité 13. Que fait l’équipe ?','Elle place le jalon, complète sous 13 avec le haut du backlog, et dit au comité par écrit ce qui glisse.']]],
    ['Mise à l’échelle et organisation',[
      ['« Descale first ».','Réduire d’abord le besoin de coordination (des équipes autonomes sur des parties indépendantes) avant d’ajouter un cadre.'],
      ['Ce que LeSS garde pour huit équipes.','Un seul Product Owner, un seul backlog, un seul sprint.'],
      ['Pourquoi le modèle Spotify n’est-il pas un cadre ?','C’est la description d’une entreprise en 2012, que Spotify ne suit plus telle quelle ; copié sans ses pratiques, il renomme des silos.'],
      ['Un directeur financier : « je ne peux pas capitaliser sans livrable final ». Votre réponse ?','Chaque récit accepté et ses heures sont tracés dans Jira : la valeur immobilisable se mesure sprint par sprint (IAS 38, art. 959a CO).'],
      ['Les quatre lettres de ROAM.','Résolu, Assumé (owned, une personne nommée), Accepté, Mitigé (avec l’action).']]],
    ['Votre projet',[
      ['Votre vision produit en une phrase, et le bénéfice chiffré de la charte.','L’équipe répond ; l’enseignant juge si le bénéfice est un chiffre.'],
      ['Vos trois vélocités, et ce qu’elles disent de votre prévision.','L’équipe répond avec ses chiffres ; stable sous 15 % d’écart.'],
      ['Le jalon contractuel du sprint 2 : qu’a-t-il déplacé, et l’avez-vous dit au comité ?','L’équipe répond ; par écrit et avant la revue vaut mieux.'],
      ['Votre crise de la journée 4 : la recommandation en une ligne, et ce que le comité a décidé.','L’équipe répond ; une option chiffrée et une date limite.'],
      ['Si vous recommenciez le sprint 1 demain, la seule chose que vous changeriez.','L’équipe répond ; l’enseignant vérifie qu’elle figure dans les enseignements du dossier.']]]
  ]}
};
var setId=(new URLSearchParams(location.search).get('set'))||'syn';
var S=SETS[setId]||SETS.syn, SK='mpm503_jeo_'+setId;
var st={used:{},teams:[['Équipe A',0],['Équipe B',0],['Équipe C',0],['Équipe D',0],['Équipe E',0],['Équipe F',0]]};
try{var o=JSON.parse(localStorage.getItem(SK));if(o&&o.teams)st=o;}catch(e){}
function persist(){try{localStorage.setItem(SK,JSON.stringify(st));}catch(e){}}
document.getElementById('setName').textContent=S.name;
if(S.back){var bl=document.getElementById('backLink');bl.href=S.back;bl.textContent='← '+S.backName;}
function esc(s){return String(s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];});}
function draw(){
  var b=document.getElementById('board'),h='';
  S.cats.forEach(function(c,ci){h+='<div class="cat'+(ci===S.cats.length-1?' own':'')+'">'+esc(c[0])+'</div>';});
  for(var r=0;r<5;r++)S.cats.forEach(function(c,ci){var k=ci+'-'+r;h+='<button class="cell'+(st.used[k]?' used':'')+'" data-k="'+k+'">'+(st.used[k]?'':(r+1)*100)+'</button>';});
  b.innerHTML=h;
  document.getElementById('teams').innerHTML=st.teams.map(function(t,i){return '<div class="team"><input value="'+esc(t[0])+'" data-i="'+i+'"><div class="sc">'+t[1]+'</div></div>';}).join('');
  document.querySelectorAll('.team input').forEach(function(inp){inp.addEventListener('change',function(){st.teams[+inp.dataset.i][0]=inp.value;persist();});});
}
var modal=document.getElementById('modal');
document.getElementById('board').addEventListener('click',function(e){
  var c=e.target.closest('.cell');if(!c||c.classList.contains('used'))return;
  var p=c.dataset.k.split('-'),ci=+p[0],r=+p[1],cat=S.cats[ci],qa=cat[1][r],pts=(r+1)*100;
  document.getElementById('mC').textContent=cat[0]+' · '+pts;
  document.getElementById('mQ').textContent=qa[0];
  var A=document.getElementById('mA');A.textContent=qa[1];A.classList.remove('on');
  var mb=document.getElementById('mB');
  mb.innerHTML='<button class="gh" data-a="show">Réponse</button>'+st.teams.map(function(t,i){return '<button class="ok" data-a="p" data-i="'+i+'">+ '+esc(t[0])+'</button><button class="no" data-a="m" data-i="'+i+'">− '+esc(t[0])+'</button>';}).join('')+'<button class="gh" data-a="close">Fermer</button>';
  mb.onclick=function(ev){
    var x=ev.target.closest('button');if(!x)return;var a=x.dataset.a;
    if(a==='show'){A.classList.add('on');return;}
    if(a==='p'||a==='m'){st.teams[+x.dataset.i][1]+=(a==='p'?pts:-pts);x.disabled=true;persist();}
    if(a==='close'||a==='p'){st.used[c.dataset.k]=1;persist();modal.classList.remove('on');draw();}
  };
  modal.classList.add('on');
});
document.addEventListener('keydown',function(e){if(e.key==='Escape')modal.classList.remove('on');});
document.getElementById('reset').addEventListener('click',function(){if(confirm('Effacer les scores et recommencer ?')){st={used:{},teams:st.teams.map(function(t){return [t[0],0];})};persist();draw();}});
draw();
</script>
<script src="/track.js" defer></script>
</body>
</html>

   {d:2,q:['Dans le modèle à quatre coins, qui est l’« émetteur » ?','In the four-corner model, who is the “issuer”?'],
    o:[['Le réseau, Visa ou Mastercard','The network, Visa or Mastercard'],['La banque du commerçant','The merchant’s bank'],['Le commerçant','The merchant'],['La banque qui a émis la carte','The bank that issued the card']],a:3,
    x:['L’émetteur est la banque du titulaire, qui a émis la carte ; la banque ou le PSP du commerçant est l’acquéreur ; le réseau est au centre.','The issuer is the cardholder’s bank, which issued the card; the merchant’s bank or PSP is the acquirer; the network sits in the middle.']},
   {d:1,q:['Que signifie « BaaS » ?','What does “BaaS” stand for?'],o:[['Banque-en-tant-que-service','Banking as a Service'],['Bitcoin as a Service','Bitcoin as a Service'],['Bank Account Statement','Bank Account Statement'],['Base de données bancaire','Banking database']],a:0,x:['Une banque agréée loue par API comptes, cartes et licence à des fintechs, qui font l’appli et la relation client.','A licensed bank rents accounts, cards and its licence by API to fintechs, which build the app and the customer relationship.']} ],
 [ {d:2,q:['Que contient le code QR d’une QR-facture suisse ?','What does the QR code on a Swiss QR-bill contain?'],

   {d:1,q:['Un client paie en magasin avec TWINT. Qui paie la commission ?','A customer pays in a shop with TWINT. Who pays the fee?'],

   {d:1,q:['Qui surveille les banques en Suisse ?','Who supervises banks in Switzerland?'],o:[['La Banque nationale suisse','The Swiss National Bank'],['La BCEAO','The BCEAO'],['La FINMA','FINMA'],['La COMCO','COMCO']],a:2,x:['La FINMA, l’Autorité fédérale de surveillance des marchés financiers. La BNS fait la politique monétaire ; la COMCO, la concurrence.','FINMA, the Swiss Financial Market Supervisory Authority. The SNB runs monetary policy; COMCO, competition.']} ],

   {d:2,q:['Dans une API comme celle de Stripe, comment écrit-on un montant de 49,90 CHF ?','In an API such as Stripe’s, how is an amount of CHF 49.90 written?'],

   {d:3,q:['Que signifie LGD ?','What does LGD stand for?'],o:[['Limite générale de dette','General debt limit'],['Perte en cas de défaut','Loss given default'],['Loi sur la garantie des dépôts','Deposit guarantee law'],['Long-term growth of deposits','Long-term growth of deposits']],a:1,x:['La part du montant que le prêteur ne récupère pas après recouvrement — souvent 40 à 70 % pour un crédit à la consommation sans garantie.','The share of the amount the lender does not recover after collection — often 40 to 70% for unsecured consumer credit.']} ],

   {d:2,q:['Dans l’UE, à combien est plafonnée l’interchange d’une carte de DÉBIT de particulier ?','In the EU, what is the cap on interchange for a consumer DEBIT card?'],

   {d:3,q:['Une appli de prêt lit le répertoire du téléphone et écrit aux contacts d’un emprunteur en retard. Au Kenya, c’est…','A lending app reads the phone’s contacts and writes to a late borrower’s contacts. In Kenya this is…'],o:[['interdit par les Digital Credit Providers Regulations de 2022','banned by the 2022 Digital Credit Providers Regulations'],['autorisé si le contrat le prévoit','allowed if the contract says so'],['obligatoire pour les prêteurs agréés','mandatory for licensed lenders'],['toléré sous 1 000 shillings','tolerated below 1,000 shillings']],a:0,x:['Depuis 2022, les prêteurs numériques sont sous licence de la banque centrale : accès au répertoire interdit, menaces et publication des données interdites, pas de signalement au bureau de crédit sous 1 000 shillings.','Since 2022 digital lenders are licensed by the central bank: no access to contacts, no threats or publication of data, no credit-bureau reporting under 1,000 shillings.']} ],
 [ {d:2,q:['Un client remet 10 000 FCFA en espèces à un agent Wave. Qu’arrive-t-il aux deux stocks de l’agent ?','A customer hands a Wave agent 10,000 FCFA in cash. What happens to the agent’s two stocks?'],
    o:[['Espèces + 10 000, float − 10 000','Cash + 10,000, float − 10,000'],['Espèces − 10 000, float + 10 000','Cash − 10,000, float + 10,000'],['Les deux augmentent de 10 000','Both rise by 10,000'],['Rien ne change','Nothing changes']],a:0,

   {d:1,q:['La licence fintech suisse permet d’accepter des dépôts du public jusqu’à…','The Swiss fintech licence allows accepting public deposits up to…'],

   {d:3,q:['Taux annuel effectif maximal d’un crédit au comptant en Suisse (2026) ?','Maximum annual effective rate on a cash loan in Switzerland (2026)?'],o:[['5 %','5%'],['8 %','8%'],['10 %','10%'],['12 %','12%']],a:2,x:['10 % pour un crédit au comptant, 12 % pour un découvert ou une carte de crédit. UEMOA : 14 % banques, 24 % microfinance.','10% for a cash loan, 12% for an overdraft or a credit card. WAEMU: 14% banks, 24% microfinance.']} ],

   {d:1,q:['TWINT (données du bloc 3) : par utilisateur et par mois, 80 CHF de P2P gratuit et 120 CHF de paiements commerçants à 1,3 %. Taux de prélèvement sur tout le volume ?','TWINT (block 3 data): per user per month, CHF 80 of free P2P and CHF 120 of merchant payments at 1.3%. Take rate on the whole volume?'],

   {d:2,q:['Un client remet 10 000 FCFA en espèces à un agent. L’établissement de monnaie électronique…','A customer hands an agent 10,000 FCFA in cash. The e-money institution…'],o:[['prête cet argent à d’autres clients','lends the money to other customers'],['inscrit 10 000 dans le portefeuille et détient 10 000 sur un compte de cantonnement','credits 10,000 to the wallet and holds 10,000 in a safeguarding account'],['crée 10 000 FCFA de monnaie nouvelle','creates 10,000 FCFA of new money'],['verse des intérêts au client','pays the customer interest']],a:1,x:['Émission un pour un : la somme des portefeuilles égale toujours le compte de cantonnement. La monnaie électronique n’est pas créée, elle est convertie — et ne peut pas être prêtée.','One-for-one issuance: the sum of the wallets always equals the safeguarding account. E-money is not created, it is converted — and cannot be lent out.']} ],
 [ {d:1,q:['Wave (données du bloc 3) : ARPU 500 FCFA, coûts variables 250 FCFA par utilisateur, coûts fixes 1,5 milliard FCFA par mois. Point mort ?','Wave (block 3 data): ARPU 500 FCFA, variable costs 250 FCFA per user, fixed costs 1.5 billion FCFA a month. Break-even?'],
    o:[['3 millions d’utilisateurs','3 million users'],['8 millions d’utilisateurs','8 million users'],['6 millions d’utilisateurs','6 million users'],['10 millions d’utilisateurs','10 million users']],a:2,

   {d:3,q:['Marge de 15 % sur un prêt remboursé, LGD de 50 %. Au-dessus de quelle PD le prêt ne vaut-il plus la peine ?','A 15% margin on a repaid loan, LGD 50%. Above which PD is the loan no longer worth making?'],

   {d:2,q:['Quelle part de la commission du commerçant (MDR) est versée par l’acquéreur à l’émetteur ?','Which part of the merchant discount rate is paid by the acquirer to the issuer?'],o:[['Les frais du réseau','The network fees'],['La marge de l’acquéreur','The acquirer’s margin'],['La TVA','VAT'],['L’interchange','The interchange']],a:3,x:['MDR = interchange + frais du réseau + marge de l’acquéreur. L’interchange rémunère l’émetteur pour le risque et le crédit qu’il porte — c’est ce qui finance les cartes « gratuites » des néobanques.','MDR = interchange + network fees + acquirer’s margin. Interchange pays the issuer for the risk and credit it carries — it is what funds the neobanks’ “free” cards.']} ],
 [ {d:2,q:['Un paiement en ligne a été authentifié par 3-D Secure, puis se révèle frauduleux. Qui supporte la perte ?','An online payment was authenticated with 3-D Secure and turns out to be fraud. Who bears the loss?'],
    o:[['Le commerçant','The merchant'],['L’émetteur de la carte','The card issuer'],['Le réseau de cartes','The card network'],['Le titulaire','The cardholder']],a:1,

   {d:3,q:['Revolut 2024 : revenu 3,1 milliards de £ pour 52,5 millions de clients. Revenu par client et par an, environ ?','Revolut 2024: revenue £3.1 billion for 52.5 million customers. Revenue per customer per year, roughly?'],o:[['21 £','£21'],['59 £','£59'],['118 £','£118'],['590 £','£590']],a:1,x:['3,1 milliards ÷ 52,5 millions ≈ 59 £ par client et par an — moins de 5 £ par mois ; la rentabilité vient du nombre de produits par client et de l’échelle.','3.1 billion ÷ 52.5 million ≈ £59 per customer per year — under £5 a month; profitability comes from products per customer and scale.']} ],
 [ {d:2,q:['Une appli lit, avec votre accord, les soldes et transactions de vos trois banques pour faire votre budget. Sous la PSD2, c’est un…','An app reads, with your consent, the balances and transactions of your three banks to build your budget. Under PSD2 it is a…'],
    o:[['AISP','AISP'],['PISP','PISP'],['Acquéreur','Acquirer'],['Établissement de monnaie électronique','E-money institution']],a:0,

   {d:1,q:['Selon la Banque des règlements internationaux, l’avantage des bigtechs tient en trois lettres, DNA. Lesquelles ?','According to the Bank for International Settlements, the big techs’ advantage is three letters, DNA. Which ones?'],

   {d:2,q:['Sous la PSD2, un service qui déclenche un virement depuis le compte du client, sans carte, est un…','Under PSD2, a service that initiates a transfer from the customer’s account, without a card, is a…'],o:[['PISP','PISP'],['AISP','AISP'],['acquéreur','acquirer'],['établissement de monnaie électronique','e-money institution']],a:0,x:['PISP — prestataire d’initiation de paiement. L’AISP lit les comptes ; le PISP paie depuis le compte. Consentement par OAuth 2.0 avec authentification forte.','PISP — payment initiation service provider. The AISP reads accounts; the PISP pays from the account. Consent via OAuth 2.0 with strong authentication.']} ],
 [ {d:3,q:['ARPU 10 CHF par mois, marge de contribution 60 %, attrition 2 % par mois, CAC 120 CHF. Valeur vie client et verdict selon la règle du métier ?','ARPU CHF 10 a month, contribution margin 60%, churn 2% a month, CAC CHF 120. Lifetime value, and the verdict by the industry rule?'],
    o:[['300 CHF — insuffisant : LTV < 3 × CAC','CHF 300 — not enough: LTV < 3 × CAC'],['300 CHF — sain : LTV > CAC','CHF 300 — healthy: LTV > CAC'],['500 CHF — sain : LTV > 3 × CAC','CHF 500 — healthy: LTV > 3 × CAC'],['12 CHF — insuffisant','CHF 12 — not enough']],a:0,
    x:['LTV = 10 × 0,60 ÷ 0,02 = 300 CHF. La règle : LTV ≥ 3 × CAC = 360 CHF — raté. Et le CAC se récupère en 120 ÷ 6 = 20 mois, au-delà des 12 à 18 mois visés.','LTV = 10 × 0.60 ÷ 0.02 = CHF 300. The rule: LTV ≥ 3 × CAC = CHF 360 — missed. And the CAC pays back in 120 ÷ 6 = 20 months, beyond the 12 to 18 months aimed for.']},
   {d:2,q:['La connexion coupe pendant un paiement ; le programme renvoie la requête avec la même Idempotency-Key. Que fait le prestataire ?','The connection drops during a payment; the program resends the request with the same Idempotency-Key. What does the provider do?'],
    o:[['Il débite une deuxième fois','It charges a second time'],['Il refuse avec une erreur 401','It refuses with a 401 error'],['Il renvoie le résultat de la première requête, sans débiter deux fois','It returns the first request’s result, without charging twice'],['Il annule les deux paiements','It cancels both payments']],a:2,
    x:['C’est le rôle de l’idempotence : une même clé = une seule opération. Sans elle, un client pourrait être débité deux fois à cause d’une coupure réseau.','That is what idempotency is for: one key = one operation. Without it, a network glitch could charge the customer twice.']},
   {d:2,q:['Un webhook de paiement est signé par le prestataire. Pourquoi ?','A payment webhook is signed by the provider. Why?'],o:[['Pour chiffrer le montant','To encrypt the amount'],['Pour accélérer le traitement','To speed up processing'],['Pour qu’un pirate ne puisse pas annoncer un faux paiement au serveur du commerçant','So that an attacker cannot announce a fake payment to the merchant’s server'],['Parce que la loi l’exige','Because the law requires it']],a:2,x:['Le commerçant expédie quand payment_intent.succeeded arrive ; sans signature, n’importe qui pourrait appeler cette adresse et faire livrer sans payer.','The merchant ships when payment_intent.succeeded arrives; without a signature anyone could call that address and get goods shipped unpaid.']} ],
 [ {d:3,q:['Prêt entre particuliers à 18 %, PD 18 %, LGD 70 %, frais de plateforme 1 %. Rendement attendu, environ ?','Peer-to-peer loan at 18%, PD 18%, LGD 70%, platform fee 1%. Expected return, approximately?'],

   {d:2,q:['Vous envoyez 200 CHF à Dakar, « 0 frais » ; le bénéficiaire reçoit 131 000 FCFA. 1 € = 0,94 CHF (et 1 € = 655,957 FCFA). Coût total de l’envoi ?','You send CHF 200 to Dakar, “zero fees”; the recipient gets 131,000 FCFA. €1 = CHF 0.94 (and €1 = 655.957 FCFA). Total cost of the transfer?'],

   {d:3,q:['Le règlement européen ECSP (2020/1503) agrée les plateformes de financement participatif pour des offres jusqu’à… par projet sur douze mois.','The EU’s ECSP regulation (2020/1503) licenses crowdfunding platforms for offers up to… per project over twelve months.'],o:[['500 000 €','€500,000'],['1 million €','€1 million'],['2,5 millions €','€2.5 million'],['5 millions €','€5 million']],a:3,x:['5 millions d’euros, avec une fiche d’information standard et un test de connaissances pour l’investisseur non averti. En Suisse, plus de 20 déposants exige en principe une licence bancaire.','€5 million, with a standard information sheet and a knowledge test for the non-sophisticated investor. In Switzerland, taking funds from more than 20 people normally needs a banking licence.']} ],

try{var o=JSON.parse(localStorage.getItem(SK));if(o&&o.teams&&o.teams.length===2)S=o;}catch(e){}
function save(){try{localStorage.setItem(SK,JSON.stringify(S));}catch(e){}}
function safeOf(l){return l>=10?10:(l>=5?5:0);}   /* lvl = rungs won → rungs kept after a wrong answer (the guaranteed limit) */
/* the question for this turn: the one this team has seen least in this game, then the least played in
   this game, then the least played on THIS DEVICE across every game (so a replay does not show the
   same questions again — HK, kept outside the game state), then the first */
var HK=SK+'_hist',HIST={};try{HIST=JSON.parse(localStorage.getItem(HK)||'{}')||{};}catch(e){}
function select(){var t=S.teams[S.turn],r=t.lvl,mine=t.seen[r]||{},all=S.asked[r]||{},ever=HIST[r]||{},best=0,bk=null;
  BANK[r].forEach(function(q,k){var key=[(mine[k]||0),(all[k]||0),(ever[k]||0),k];
    if(bk===null||key[0]<bk[0]||(key[0]===bk[0]&&(key[1]<bk[1]||(key[1]===bk[1]&&key[2]<bk[2])))){bk=key;best=k;}});
  S.qsel=best;mine[best]=(mine[best]||0)+1;t.seen[r]=mine;all[best]=(all[best]||0)+1;S.asked[r]=all;
  ever[best]=(ever[best]||0)+1;HIST[r]=ever;try{localStorage.setItem(HK,JSON.stringify(HIST));}catch(e){}}
function cls(i){return i===0?'tA':'tB';}

document.getElementById('hT').textContent=T('Qui veut gagner un milliard ?','Who Wants to Be a Billionaire?');
document.getElementById('hS').textContent=T('MFB 545 Fintech · révision des journées 1 à 3 · deux équipes','MFB 545 Fintech · review of Days 1–3 · two teams');
document.getElementById('hBack').textContent=T('← Cours','← Course');
document.getElementById('foot').innerHTML=T('Clic sur une réponse = la réponse de l’équipe · <b>Entrée</b> révèle · touches A–D · ','Click an answer = the team’s answer · <b>Enter</b> reveals · keys A–D · ')+'<button id="reset" title="'+T('Les questions déjà jouées sur cet appareil passent en dernier','Questions already played on this device come last')+'">'+T('Nouvelle partie','New game')+'</button>';

/* ------------------------------ setup ------------------------------ */
function drawSetup(){
  document.getElementById('game').classList.remove('on');
  var s=document.getElementById('setup');s.style.display='';
  s.innerHTML='<h2>'+T('Qui veut gagner<br>un milliard ?','Who Wants to Be<br>a Billionaire?')+'</h2><div class="tag">'+T('Fintech · journées 1, 2 et 3','Fintech · Days 1, 2 and 3')+'</div>'+
   '<div class="sbox"><h3>'+T('Les deux équipes','The two teams')+'</h3>'+
   S.teams.map(function(t,i){return '<div class="row '+cls(i)+'"><b class="dot">'+(i+1)+'</b><input id="tn'+i+'" maxlength="24" value="'+esc(t.name)+'"></div>';}).join('')+'</div>'+
   '<div class="sbox"><h3>'+T('Les règles','The rules')+'</h3><ul>'+
   '<li><i>'+T('Tour','Turns')+'</i>'+T('Les équipes jouent à tour de rôle, chacune sa question, au même palier : quinze paliers jusqu’à un milliard de francs.','The teams take turns, each with its own question, on the same rung: fifteen rungs to a billion francs.')+'</li>'+
   '<li><i>'+T('Temps','Time')+'</i>'+T('30 secondes de discussion aux paliers 1–5, 45 s aux paliers 6–10, 60 s ensuite. Une seule réponse, annoncée par le porte-parole.','30 seconds to confer on rungs 1–5, 45 s on rungs 6–10, 60 s after that. One answer, given by the spokesperson.')+'</li>'+
   '<li><i>'+T('Chute','Falls')+'</i>'+T('Une mauvaise réponse : l’équipe retombe à zéro — ou à 50 000 si elle l’avait passé, à 5 millions si elle l’avait passé — et continue à jouer. Personne n’est éliminé, personne n’encaisse.','A wrong answer: the team falls back to zero — or to 50,000 if it had passed it, to 5 million if it had passed that — and keeps playing. Nobody is out, nobody walks away.')+'</li>'+
   '<li><i>'+T('Jokers','Lifelines')+'</i>'+T('Trois par équipe, une fois chacun : <b>50:50</b> · <b>l’autre équipe</b> donne son avis (elle peut bluffer) · <b>le carnet</b> — 30 secondes dans vos notes et sur le site.','Three per team, once each: <b>50:50</b> · <b>the other team</b> gives its view (it may bluff) · <b>the notebook</b> — 30 seconds in your notes and on the site.')+'</li>'+
   '<li><i>'+T('Gagnant','Winner')+'</i>'+T('La première équipe à répondre juste au palier 15 gagne le milliard.','The first team to answer the 15th rung correctly wins the billion.')+'</li></ul></div>'+
   '<button class="go" id="start">'+T('Commencer la partie →','Start the game →')+'</button>';
  document.getElementById('start').onclick=function(){
    S.teams.forEach(function(t,i){var v=document.getElementById('tn'+i).value.trim();t.name=v||T('Équipe ','Team ')+(i+1);});
    S.phase='play';save();draw();
  };
}

/* ------------------------------ timer ------------------------------ */
var tmr=null,left=0;
function stopT(){if(tmr){clearInterval(tmr);tmr=null;}}
function paintT(){var e=document.getElementById('tm');if(!e)return;
  if(!tmr&&left<=0){e.className='timer idle';e.textContent='⏱ '+secs(S.teams[S.turn].lvl)+' s';return;}
  e.className='timer'+(left<=10?' warn':'');e.textContent=left>0?left+' s':T('Temps !','Time!');}
function startT(){stopT();left=secs(S.teams[S.turn].lvl);paintT();
  tmr=setInterval(function(){left--;paintT();if(left<=0){stopT();var e=document.getElementById('tm');if(e){e.className='timer warn';e.textContent=T('Temps !','Time!');}}},1000);}

/* ------------------------------ play ------------------------------- */
/* the rung of the question on screen: after a right answer lvl has already moved on */
function qi(){return S.shown&&S.ql!=null?S.ql:S.teams[S.turn].lvl;}
function cur(){if(S.qsel==null)select();return BANK[qi()][S.qsel];}
function draw(){
  if(S.phase==='setup')return drawSetup();
  document.getElementById('setup').style.display='none';
  document.getElementById('game').classList.add('on');
  if(S.phase==='end')return drawEnd();
  var t=S.teams[S.turn],q=cur(),i=qi();
  document.getElementById('turn').className='turn '+cls(S.turn);
  document.getElementById('turn').innerHTML='<span class="who">'+esc(t.name)+'</span><span class="for">'+T('Question ','Question ')+(i+1)+' / 15 · '+T('pour ','for ')+'<b>'+amt(i)+' CHF</b></span><span class="day">'+T('Journée ','Day ')+q.d+'</span><span class="timer idle" id="tm" title="'+T('Lancer le chrono','Start the clock')+'"></span>';
  document.getElementById('tm').onclick=function(){if(!S.shown)startT();};
  paintT();
  document.getElementById('qt').textContent=L(q.q);
  document.getElementById('ans').innerHTML=q.o.map(function(o,k){
    var c='ab';
    if(S.hidden.indexOf(k)>=0)c+=' gone';
    if(S.shown){if(k===q.a)c+=' ok';else if(k===S.pick)c+=' ko';}
    else if(k===S.pick)c+=' pick';
    return '<button class="'+c+'" data-k="'+k+'"'+(S.shown?' disabled':'')+'><span class="l">'+LET[k]+'</span><span>'+esc(L(o))+'</span></button>';
  }).join('');
  var n=document.getElementById('note');n.textContent=S.note||'';n.classList.toggle('on',!!S.note);
  var w=document.getElementById('why');
  w.innerHTML=S.shown?'<b>'+(S.pick===q.a?(t.st==='top'?T('Juste — le milliard !','Right — the billion!'):T('Juste','Right')):T('Faux · retour à ','Wrong · back to ')+amt(S.fell-1)+' CHF')+'</b>'+esc(L(q.x)):'';
  w.classList.toggle('on',S.shown);
  var a=document.getElementById('acts');
  if(!S.shown){
    a.innerHTML='<button class="btn" id="rev"'+(S.pick<0?' disabled':'')+'>'+T('Réponse définitive — révéler','Final answer — reveal')+'</button>';
    document.getElementById('rev').onclick=reveal;
  }else{
    a.innerHTML='<button class="btn" id="next">'+T('Suite →','Next →')+'</button>';
    document.getElementById('next').onclick=next;
  }
  var jk=document.getElementById('jok');
  jk.innerHTML=S.shown?'':
    '<button class="jk" data-j="h"'+(t.j.h?' disabled':'')+'>50:50</button>'+
    '<button class="jk" data-j="a"'+(t.j.a?' disabled':'')+'>🗣 '+T('L’autre équipe','The other team')+'</button>'+
    '<button class="jk" data-j="c"'+(t.j.c?' disabled':'')+'>📓 '+T('Le carnet · 30 s','The notebook · 30 s')+'</button>';
  drawLadder();drawTeams();
}
function drawLadder(){
  var t=S.teams[S.turn],h='';
  for(var i=14;i>=0;i--){
    var pw=S.teams.map(function(x,k){return x.lvl-1===i?'<span class="dot '+cls(k)+'">'+(k+1)+'</span>':'';}).join('');
    h+='<div class="rung'+(SAFE[i]?' safe':'')+(S.phase==='play'&&i===qi()?' cur':'')+'"><span class="n">'+(i+1)+'</span><span class="v">'+amt(i)+'</span><span class="pw">'+pw+'</span></div>';
  }
  document.getElementById('ladder').innerHTML=h;
}
function stLabel(t){return t.st==='top'?T('le milliard !','the billion!'):T('palier ','rung ')+t.lvl+' / 15'+(t.falls?' · '+t.falls+T(' chute',' fall')+(t.falls>1?'s':''):'');}
function drawTeams(){
  document.getElementById('teams').innerHTML=S.teams.map(function(t,k){
    return '<div class="tc '+cls(k)+(S.phase==='play'&&k===S.turn?' act':'')+''+'"><b class="dot" style="width:28px;height:28px;border-radius:50%;display:flex;align-items:center;justify-content:center;">'+(k+1)+'</b>'+
      '<div style="flex:1;min-width:0"><div class="nm">'+esc(t.name)+'</div><div class="st">'+stLabel(t)+'</div></div>'+
      '<div class="jd"><span'+(t.j.h?' class="u"':'')+'>50:50</span><span'+(t.j.a?' class="u"':'')+'>🗣</span><span'+(t.j.c?' class="u"':'')+'>📓</span></div>'+
      '<div class="bk">'+amt(t.lvl-1)+' CHF</div></div>';
  }).join('');
}
function amtV(v){for(var i=0;i<LEVELS.length;i++)if(LEVELS[i][0]===v)return amt(i);return '0';}

function pick(k){if(S.shown||S.hidden.indexOf(k)>=0)return;S.pick=k;save();draw();}
function reveal(){
  if(S.shown||S.pick<0)return;stopT();
  var t=S.teams[S.turn],q=cur();S.ql=t.lvl;S.shown=true;S.note='';
  if(S.pick===q.a){t.lvl++;t.right++;if(t.lvl===15){t.st='top';}S.fell=null;}
  else{S.fell=safeOf(t.lvl);t.falls++;t.lvl=S.fell;}
  save();draw();
}
function next(){
  stopT();S.pick=-1;S.shown=false;S.hidden=[];S.note='';
  S.qsel=null;S.fell=null;
  if(S.teams.some(function(t){return t.st==='top';}))S.phase='end';
  else S.turn=1-S.turn;
  save();draw();
}
function joker(j){
  var t=S.teams[S.turn],q=cur();if(S.shown||t.j[j])return;
  if(j==='h'){
    var wrong=[0,1,2,3].filter(function(k){return k!==q.a;});
    var keep=wrong[Math.floor(Math.random()*3)];
    S.hidden=wrong.filter(function(k){return k!==keep;});
    if(S.hidden.indexOf(S.pick)>=0)S.pick=-1;
  }
  if(j==='a'){var o=S.teams[1-S.turn];S.note='🗣 '+T('« ','“')+o.name+T(' » donne son avis à voix haute — 20 secondes. Attention : elle peut bluffer.','” gives its view out loud — 20 seconds. Careful: it may bluff.');}
  if(j==='c')openNotes();
  t.j[j]=1;save();draw();
}
var nt=null;
function openNotes(){
  var ov=document.getElementById('ovNotes'),s=30;
  document.getElementById('nT').textContent=T('Le carnet est ouvert','The notebook is open');
  document.getElementById('nP').textContent=T('Notes, carnet, pages des journées 1 à 3 : 30 secondes. Pas d’assistant d’IA, pas l’autre équipe.','Notes, notebook, the Day 1–3 pages: 30 seconds. No AI assistant, not the other team.');
  document.getElementById('nX').textContent=T('Fermer','Close');
  document.getElementById('nS').textContent=s;ov.classList.add('on');
  clearInterval(nt);nt=setInterval(function(){s--;document.getElementById('nS').textContent=s>0?s:'0';if(s<=0){clearInterval(nt);document.getElementById('nS').textContent=T('Stop !','Stop!');}},1000);
}
document.getElementById('nX').onclick=function(){clearInterval(nt);document.getElementById('ovNotes').classList.remove('on');};

/* ------------------------------- end ------------------------------- */
function drawEnd(){
  drawLadder();drawTeams();
  ['turn','ans','acts','jok'].forEach(function(id){document.getElementById(id).innerHTML='';});
  document.getElementById('qt').textContent=T('Partie terminée','Game over');
  var w=S.teams[0].st==='top'?0:1,order=w===1?[1,0]:[0,1],box=document.getElementById('endBox');
  box.innerHTML='<div style="font-size:64px">🏆</div><h2>'+esc(S.teams[w].name)+T(' gagne le milliard !',' wins the billion!')+'</h2>'+
    '<div class="pod">'+order.map(function(k,r){var t=S.teams[k];return '<div class="pr'+(k===w?' win':'')+'"><span class="p">'+(r+1)+'</span><span class="nm">'+esc(t.name)+'<small>'+t.right+T(' bonnes réponses',' right answers')+' · '+t.falls+T(' chute',' fall')+(t.falls===1?'':'s')+'</small></span><span class="bk">'+amt(t.lvl-1)+' CHF</span></div>';}).join('')+'</div>'+
    '<button class="btn gh" id="again">'+T('Nouvelle partie','New game')+'</button>';
  document.getElementById('again').onclick=resetGame;
  document.getElementById('ovEnd').classList.add('on');
}
function resetGame(){
  stopT();var names=S.teams.map(function(t){return t.name;});S=fresh();
  S.teams.forEach(function(t,i){t.name=names[i];});save();
  document.getElementById('ovEnd').classList.remove('on');draw();
}

document.getElementById('ans').addEventListener('click',function(e){var b=e.target.closest('.ab');if(b)pick(+b.dataset.k);});
document.getElementById('jok').addEventListener('click',function(e){var b=e.target.closest('.jk');if(b&&!b.disabled)joker(b.dataset.j);});
document.getElementById('reset').addEventListener('click',function(){if(confirm(T('Effacer la partie et recommencer ?','Clear the game and start again?')))resetGame();});
document.addEventListener('keydown',function(e){
  if(S.phase!=='play'||/INPUT/.test((e.target||{}).tagName||''))return;
  if(document.getElementById('ovNotes').classList.contains('on')){if(e.key==='Escape')document.getElementById('nX').click();return;}
  var k='abcd'.indexOf(e.key.toLowerCase());
  if(k>=0&&!S.shown){pick(k);return;}
  if(e.key==='Enter'){if(!S.shown)reveal();else next();}
  if(e.key===' '&&!S.shown){e.preventDefault();startT();}
});
draw();
</script>
<script src="/track.js" defer></script>
</body>

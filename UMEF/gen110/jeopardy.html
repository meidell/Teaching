<style>
/* =====================================================================
   GEN 110 · Jeopardy for the room screen (3 Nov 2026). ?set=s4 = séances
   1 à 4 — how an AI assistant produces its answer, how to ask, sound /
   image / video, agents working together, what must never be pasted —
   plus a last category "Votre projet" that asks the team on turn about
   its own project (the instructor's check that the work was done).
   Engine copied from GBS/business-intelligence/jeopardy.html (6 columns,
   teams A–F, scores in this browser only: gen110_jeo_<set>). Projector
   page: no progress, no sign-in, never counted. Colours are the séance 4
   deck's (deep teal → dark, teal cells, pale-blue accent).
   Every answer below is the session pages' own wording.
   ?set=s5 (10 Nov 2026) = séances 1 à 5, for the last hour of séance 5:
   new questions (not s4's), a « Le job agent » column, and « Votre agent »
   (the team's own project as trigger · sources · filter · action · click).
   ===================================================================== */
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:"Helvetica Neue",Helvetica,Arial,sans-serif;background:linear-gradient(160deg,#0F4C60,#232A31);color:#fff;min-height:100vh;}
.top{display:flex;align-items:center;gap:14px;padding:14px 20px;}
.top h1{font-family:Georgia,serif;font-size:24px;}
.top .sub{color:#9FD3E6;font-size:13px;}
.top a{color:#9FD3E6;font-size:13px;text-decoration:none;margin-left:auto;}
.board{display:grid;grid-template-columns:repeat(6,1fr);gap:8px;padding:0 20px;}
.cat{background:#0A3341;border-radius:10px;padding:12px 8px;text-align:center;font-weight:800;font-size:clamp(11px,1.4vw,16px);min-height:64px;display:flex;align-items:center;justify-content:center;text-transform:uppercase;letter-spacing:.5px;}
.cat.own{background:#7A3E0E;}
.cell{background:#176B87;border:none;border-radius:10px;color:#FFD58A;font:800 clamp(20px,3.2vw,40px)/1 Georgia,serif;min-height:clamp(60px,11vh,110px);cursor:pointer;transition:.15s;}
.cell:hover{background:#2A93B0;}
.cell.used{background:rgba(255,255,255,.06);color:rgba(255,255,255,.18);cursor:default;}
.teams{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;padding:18px 20px 30px;}
.team{background:rgba(255,255,255,.08);border-radius:12px;padding:10px 16px;text-align:center;min-width:150px;}
.team input{background:transparent;border:none;border-bottom:1px dashed rgba(255,255,255,.35);color:#fff;font:800 15px inherit;text-align:center;width:100%;}
.team .sc{font:800 34px Georgia,serif;color:#FFD58A;margin-top:4px;}
#modal{position:fixed;inset:0;background:rgba(10,30,40,.95);display:none;align-items:center;justify-content:center;padding:30px;z-index:10;}
#modal.on{display:flex;}
#modal .box{max-width:1000px;width:100%;text-align:center;}
#modal .mc{color:#9FD3E6;font-size:15px;letter-spacing:2px;text-transform:uppercase;font-weight:800;}
#modal .mq{font:700 clamp(24px,3.6vw,42px)/1.25 Georgia,serif;margin:20px 0 26px;}
#modal .ma{display:none;font-size:clamp(18px,2.3vw,27px);color:#FFD58A;line-height:1.4;margin-bottom:26px;}
#modal .ma.on{display:block;}
.mb{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;}
.mb button{background:#fff;color:#0F4C60;border:none;border-radius:30px;padding:10px 16px;font:800 14px inherit;cursor:pointer;}
.mb button.ok{background:#2F855A;color:#fff;} .mb button.no{background:#9B2335;color:#fff;} .mb button.gh{background:transparent;color:#fff;border:1px solid rgba(255,255,255,.5);}
.foot{text-align:center;font-size:12px;color:#9FD3E6;padding-bottom:20px;}
.foot button{background:none;border:none;color:#9FD3E6;text-decoration:underline;cursor:pointer;font:inherit;}

<body data-course="gen110">
<div class="top"><h1>Jeopardy</h1><span class="sub" id="setName"></span><a href="seance4.html" id="backLink">← Séance 4</a></div>
<div class="board" id="board"></div>
<div class="teams" id="teams"></div>
<div class="foot">Cliquez une case · « Réponse » · puis l’équipe qui a répondu juste (+) ou faux (−). Les noms des équipes se modifient. <button id="reset">Nouvelle partie</button></div>
<div id="modal"><div class="box"><div class="mc" id="mC"></div><div class="mq" id="mQ"></div><div class="ma" id="mA"></div><div class="mb" id="mB"></div></div></div>
<script>
var SETS={
  s5:{name:'Séances 1 à 5 · de l’IA qui répond à l’agent qui travaille chaque jour',back:'seance5.html',backName:'Séance 5',cats:[
    ['Ce que fait une IA',[
      ['Calculer la TVA dans un tableur, ou trier les e-mails indésirables à partir d’exemples étiquetés : lequel est de l’apprentissage automatique ?','Trier les e-mails indésirables à partir d’exemples étiquetés : le programme trouve la règle dans les exemples. La TVA suit une règle écrite à l’avance par une personne.'],
      ['Que veut dire « apprentissage profond » ?','L’apprentissage automatique par réseaux de neurones à de nombreuses couches. « Profond » parle du nombre de couches, pas d’une IA qui comprendrait ce qu’elle fait.'],
      ['Une calculatrice, un filtre anti-spam, la reconnaissance faciale d’un téléphone, les recommandations de vidéos : lequel n’utilise pas d’apprentissage automatique ?','La calculatrice : elle applique des règles fixes. Les trois autres ont appris à partir d’exemples.'],
      ['Quelle est la différence entre un programme classique et un programme qui apprend ?','Le programme classique suit des règles qu’une personne a écrites. Le programme qui apprend trouve lui-même la règle dans des exemples étiquetés, et peut donc se tromper sur un cas qu’il n’a jamais vu.'],
      ['Votre classificateur reconnaît la tasse sur fond blanc, pas sur fond noir. Que changez-vous dans vos exemples ?','Vous ajoutez des photos de la tasse sur des fonds variés (noir, bois, tissu). Il avait appris le fond autant que la tasse, parce que le fond était toujours blanc.']]],
    ['Bien demander',[
      ['Votre réponse est trop longue. Quelle partie du prompt changez-vous ?','Le format : la longueur et la structure, en chiffres (« 150 mots, trois paragraphes, vouvoiement »).'],
      ['Dans le programme de la séance 5, pourquoi la consigne demande-t-elle à Gemini de répondre en JSON ?','Parce qu’un programme lit un JSON sans se tromper : quatre champs nommés (subject, message, cv, missing). Un texte libre serait mal lu.'],
      ['La consigne de la séance 5 contient {{PROFILE}}, {{TITLE}}, {{LINK}} et {{OFFER}}. Comment s’appelle ce genre de consigne ?','Un modèle avec des variables : avant d’envoyer, le programme remplace chaque variable par le vrai texte (votre profil, le titre, le lien, la page de l’offre).'],
      ['Pourquoi la consigne dit-elle « utilise UNIQUEMENT les faits du PROFIL » ?','Sinon Gemini invente des compétences, des outils ou des chiffres pour coller à l’offre. Ce que l’offre demande et que vous n’avez pas va dans la liste « missing ».'],
      ['Le programme envoie temperature: 0.4 à Gemini. À quoi sert ce réglage ?','La température règle le tirage au sort du mot suivant : plus elle est basse, plus la réponse est prévisible et varie peu d’un clic à l’autre.']]],
    ['Son, image, vidéo',[
      ['Dans quel format monte-t-on un clip de vingt secondes pour une story ?','En 9:16, vertical, avec le texte au milieu de l’écran.'],
      ['Un générateur de voix transforme votre texte en quoi ?','En sons prédits morceau par morceau, comme le modèle de texte prédit le mot suivant. Aucun acteur n’a enregistré votre phrase.'],
      ['Comment savoir si une image a déjà été publiée ailleurs sur le web ?','Par une recherche d’image inversée (Google Lens) : vous donnez l’image, l’outil montre où elle a été publiée et depuis quand.'],
      ['Que contient un storyboard, et pourquoi le faire avant d’ouvrir CapCut ?','Pour chaque plan : ce qu’on voit, le texte à l’écran (six mots au plus) et la phrase de la voix off. Le montage devient alors un travail d’assemblage, pas d’invention.'],
      ['Un générateur d’images part de quoi pour produire l’image ?','D’un bruit, qu’il retire par étapes, guidé par le texte du prompt. Rien n’est cherché ni collé ; deux générations ne sont jamais identiques.']]],
    ['Des agents qui travaillent ensemble',[
      ['Pourquoi séparer l’analyste et la rédactrice plutôt que tout demander à un seul agent ?','Chaque étape a une consigne courte et un résultat que l’on vérifie séparément.'],
      ['Que doit recevoir le contrôleur pour vérifier vraiment ?','La source (le fichier, la liste des prix), pas seulement le message. Sans la source, il ne vérifie que la cohérence du texte.'],
      ['Le job agent de la séance 5 : combien de ses pièces sont de l’IA ?','Une seule : la rédaction par Gemini. Lire une page, comparer des mots, envoyer un e-mail, se lancer à 7h : c’est du code ordinaire.'],
      ['Trois agents à la chaîne, chacun juste 80 fois sur 100, sans contrôle. Combien de rapports justes sur 100, environ ?','Environ 51 : 0,8 × 0,8 × 0,8 = 0,512. Les erreurs s’empilent d’une étape à l’autre.'],
      ['« Un client écrit ; selon la demande, le message part au SAV, à la comptabilité ou au commercial. » Quelle organisation d’agents, et pourquoi ?','Un chef qui répartit vers des spécialistes : le chemin dépend de la demande, un agent lit et répartit, chaque spécialiste a sa fiche.']]],
    ['Le job agent',[
      ['Où se range la clé Gemini ?','Dans les Propriétés du script, et nulle part ailleurs : ni dans la feuille, ni dans le code, ni dans un carnet.'],
      ['La page affiche 40 offres dans le navigateur, le robot lit 2 liens. Pourquoi ?','La page est construite en JavaScript : le robot reçoit le code source, sans les offres. Prenez une autre page, ou un flux RSS.'],
      ['Vous collez https://www.jobup.ch/fr/ dans Sources. Combien d’offres trouve le robot, et que collez-vous à la place ?','Zéro : la page d’accueil ne contient aucune offre. Vous collez l’adresse d’une recherche, qui contient vos mots : …/fr/emplois/?term=stage%20marketing&location=Genève.'],
      ['Pourquoi deux clics, Préparer puis Envoyer, et pas une candidature envoyée automatiquement ?','Aucune candidature ne doit partir sans qu’un humain l’ait lue : Gemini peut se tromper ou inventer.'],
      ['Vous avez corrigé le code, mais « Préparer » montre encore l’ancienne erreur. Pourquoi, et que faites-vous ?','L’application Web garde le code du moment où elle a été publiée. Déployer → Gérer les déploiements → crayon → Nouvelle version. Pas « Nouveau déploiement » : il crée une nouvelle adresse.']]],
    ['Votre agent',[
      ['Le déclencheur de votre projet : quand votre agent se lance-t-il ?','L’équipe répond pour son projet (carnet 5.6). Le prof juge : une heure, un jour ou un événement précis.'],
      ['Les sources de votre agent : que lit-il, et où exactement ?','Des pages, une feuille ou une boîte e-mail nommées précisément, pas « internet ».'],
      ['Le filtre de votre agent : que garde-t-il, et que jette-t-il ?','Une règle qu’un programme peut appliquer (des mots, un montant, une date), pas « ce qui est intéressant ».'],
      ['L’action de votre agent : quelle partie est faite par l’IA, et quelle partie par du code ordinaire ?','L’équipe nomme les deux. Souvent, seule la rédaction ou la lecture d’un texte est de l’IA.'],
      ['Le clic humain : qui valide, où, et quelle erreur ce clic arrête-t-il ?','Une personne nommée, un endroit (un e-mail, une feuille), et une erreur concrète que la relecture arrête : un prix inventé, un nom faux, un envoi au mauvais client.']]]
  ]},
  s4:{name:'Séances 1 à 4 · les assistants d’IA, comment ils répondent et comment les utiliser',cats:[
    ['Comment l’assistant produit sa réponse',[
      ['Un assistant comme ChatGPT produit son texte en faisant quoi, mot après mot ?','Il choisit, mot après mot (jeton après jeton), une suite probable d’après les textes qu’il a vus. Rien n’est cherché ni copié ; tout est continué.'],
      ['Vous posez deux fois la même question et obtenez deux réponses différentes. Pourquoi ?','Le jeton suivant est tiré au sort parmi les suites probables : c’est la température. Même prompt, autre tirage.'],
      ['Qu’est-ce qu’une « hallucination » d’un assistant ?','Une réponse fausse mais formulée avec assurance. Le modèle n’a pas de case « je ne sais pas » ; vérifier est à votre charge.'],
      ['Après une longue conversation, l’assistant ne respecte plus vos consignes du début. Pourquoi ?','La fenêtre de contexte est pleine : il relit toute la conversation à chaque réponse, seulement ce qui tient dans la fenêtre, et le début n’est plus lu. Répétez les consignes.'],
      ['Vous collez un exemple dans le prompt et la réponse prend son style. Qu’est-ce qui se passe exactement ?','L’exemple fait partie du texte que le modèle continue : la suite la plus probable d’un document qui commence par votre exemple lui ressemble. Rien n’est appris ; tout est oublié à la conversation suivante.']]],
    ['Bien demander',[
      ['Les cinq parties d’un bon prompt.','Le rôle, le contexte, la tâche, le format, les exemples et contraintes. « S’il te plaît » n’est pas une information.'],
      ['Laquelle de ces lignes est une instruction de format : « Tu es juriste », « Le client attend depuis deux semaines », « 150 mots, trois paragraphes, vouvoiement », « Rédige une relance » ?','« 150 mots, trois paragraphes, vouvoiement » : longueur, structure, ton, langue, avec des chiffres.'],
      ['La réponse est générique, bonne pour n’importe quelle entreprise. Le meilleur premier geste ?','Lui demander de poser d’abord ses trois questions : il manque du contexte, et ses questions sont la liste de ce que vous avez oublié. Un nouvel onglet jette ce qui était bon.'],
      ['L’assistant cite un article de loi avec un numéro précis. Que faites-vous avant de l’utiliser ?','Vous vérifiez le texte de loi vous-même. « Es-tu sûr ? » obtient « oui », ou un autre numéro inventé ; un second assistant invente aussi.'],
      ['Pourquoi « Écris un bon e-mail professionnel, s’il te plaît » donne-t-il un moins bon e-mail que le prompt de 120 mots avec rôle, contexte, tâche, format et date limite ?','Ce que vous ne dites pas, le modèle l’invente. « Bon » et « s’il te plaît » ne sont pas des informations ; le rôle, le contexte, le format et la contrainte en sont.']]],
    ['Son, image, vidéo',[
      ['Pour que la voix générée lise « 2 000 FCFA » correctement, comment l’écrivez-vous ?','En toutes lettres : « deux mille francs CFA ». Le texte lu n’est pas le texte affiché ; chiffres, sigles et noms s’écrivent comme ils se prononcent.'],
      ['Un générateur d’images part de quoi pour produire l’image ?','D’un bruit, qu’il retire par étapes (une cinquantaine), guidé par le texte du prompt. Rien n’est cherché ni collé ; deux générations ne sont jamais identiques.'],
      ['Un modèle de transcription reçoit quoi en entrée ?','Une image du son, le spectrogramme, environ cent colonnes par seconde. Un nom qu’il n’a jamais vu écrit devient le mot courant qui lui ressemble.'],
      ['Transcrire → résumer → traduire. À quel maillon corrige-t-on les noms et les chiffres ?','Juste après la transcription, avant de résumer : une erreur née tôt traverse tous les maillons suivants.'],
      ['Sur une image générée en 2026 pour une campagne, le défaut à chercher en premier.','Un détail inventé : un prix, un numéro, un lieu que vous n’avez pas donnés. L’outil complète ce qui manque avec le plus probable ; les mains à six doigts, c’était 2023.']]],
    ['Des agents qui travaillent ensemble',[
      ['Dans ce cours, qu’est-ce qu’un « agent » ?','Un modèle avec une fiche : un rôle, une mission, une entrée, un format de sortie, des règles, et à qui il passe son résultat. Le modèle est le même ; la fiche change.'],
      ['Le contrôleur reçoit seulement le message de la rédactrice, pas le fichier, et répond « tout est cohérent ». Qu’a-t-il vérifié ?','Seulement que le texte ne se contredit pas. Sans la source, il n’a pas pu recalculer ; un texte faux peut être parfaitement cohérent.'],
      ['Cinq agents à la chaîne, chacun juste 90 fois sur 100, sans contrôle. Combien de rapports justes sur 100, environ ?','Environ 59 : 0,9 × 0,9 × 0,9 × 0,9 × 0,9 ≈ 0,59. Les erreurs s’empilent ; la chaîne vaut mieux que l’agent seul seulement si chaque étape est contrôlée.'],
      ['Une commande de 120 sacs dans un fichier où toutes les autres vont de 1 à 3. Que doit faire l’agent analyste ?','La signaler et laisser une personne trancher. Seule la patronne sait si c’est une faute de frappe ; un agent qui corrige de lui-même invente une donnée.'],
      ['« Un client écrit ; selon la demande, le message part au SAV, à la comptabilité ou au commercial. » Chaîne, chef et spécialistes, ou débat et juge ?','Le chef et les spécialistes : le chemin dépend de la demande, un agent lit et répartit, chaque spécialiste a sa fiche.']]],
    ['Ce qu’il ne faut jamais faire',[
      ['Lequel ne doit pas être collé dans un assistant grand public : un article de presse, votre brouillon de lettre, le règlement des études, la liste des clients avec leurs téléphones ?','La liste nominative des clients avec leurs numéros : des données personnelles de tiers envoyées à un service qui peut les conserver, interdit sans base légale (nLPD, RGPD).'],
      ['Avant de donner le fichier des ventes d’une boutique à un assistant gratuit, que retirez-vous ?','Les colonnes nom, téléphone, adresse : le calcul n’en a pas besoin. N’envoyer que le nécessaire est la seule protection qui ne dépend pas des réglages de l’outil.'],
      ['Un détecteur en ligne dit « 87 % IA » d’une vidéo. Que faites-vous ?','Vous cherchez la source : première publication, autre angle, date. Les détecteurs se trompent dans les deux sens ; la provenance est la seule méthode qui tient.'],
      ['Votre classificateur d’images reconnaît votre tasse sur fond blanc mais échoue sur fond noir. L’explication la plus probable ?','Il a appris le fond autant que la tasse : les exemples n’étaient pas assez variés. Si le fond était toujours blanc, le fond blanc fait partie de « tasse ».'],
      ['L’équipe d’agents a fait mieux que l’agent seul sur Wax & Co. Qu’en concluez-vous pour votre propre projet ?','Qu’il faut essayer les deux sur vos données et compter les erreurs. Une équipe coûte plus de temps ; elle vaut le coup quand chaque étape se vérifie, et on le sait en mesurant.']]],
    ['Votre projet',[
      ['Le nom de votre projet, et pour qui il est fait.','L’équipe répond pour son propre projet. Le prof juge : la personne ou l’entreprise doit être nommée.'],
      ['Le problème que votre projet résout, en une phrase, sans le mot « IA ».','La phrase de la remise 1 (« le problème »). Sans « IA », « automatique », « intelligent ».'],
      ['Les trois agents de votre projet : le rôle de chacun, dans l’ordre où ils se passent le travail.','Les trois fiches de 4.5 : par exemple trieur → rédacteur → contrôleur. Trois rôles nommés, un ordre.'],
      ['Quelles données reçoit votre contrôleur, et quelles colonnes avez-vous retirées avant de les donner à un assistant ?','Le contrôleur reçoit la source (le fichier, la liste des prix…), pas seulement le message. Les colonnes retirées : noms, téléphones, adresses, e-mails.'],
      ['Une erreur que l’agent pourrait faire dans votre projet, et qui l’arrêterait.','Une erreur concrète (un prix inventé, un doublon compté deux fois, un nom mal transcrit) et le maillon qui la voit : le contrôleur avec la source, ou la personne qui décide.']]]
  ]}
};
var setId=(new URLSearchParams(location.search).get('set'))||'s4';
var S=SETS[setId]||SETS.s4, SK='gen110_jeo_'+setId;
var st={used:{},teams:[['Équipe A',0],['Équipe B',0],['Équipe C',0],['Équipe D',0],['Équipe E',0],['Équipe F',0]]};
try{var o=JSON.parse(localStorage.getItem(SK));if(o&&o.teams)st=o;}catch(e){}
function persist(){try{localStorage.setItem(SK,JSON.stringify(st));}catch(e){}}
document.getElementById('setName').textContent=S.name;
if(S.back){var bl=document.getElementById('backLink');bl.href=S.back;bl.textContent='← '+S.backName;}
function esc(s){return String(s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];});}
function draw(){
  var b=document.getElementById('board'),h='';
  S.cats.forEach(function(c,ci){h+='<div class="cat'+(ci===S.cats.length-1?' own':'')+'">'+esc(c[0])+'</div>';});
  for(var r=0;r<5;r++)S.cats.forEach(function(c,ci){var k=ci+'-'+r;h+='<button class="cell'+(st.used[k]?' used':'')+'" data-k="'+k+'">'+(st.used[k]?'':(r+1)*100)+'</button>';});
  b.innerHTML=h;
  document.getElementById('teams').innerHTML=st.teams.map(function(t,i){return '<div class="team"><input value="'+esc(t[0])+'" data-i="'+i+'"><div class="sc">'+t[1]+'</div></div>';}).join('');
  document.querySelectorAll('.team input').forEach(function(inp){inp.addEventListener('change',function(){st.teams[+inp.dataset.i][0]=inp.value;persist();});});
}
var modal=document.getElementById('modal');
document.getElementById('board').addEventListener('click',function(e){
  var c=e.target.closest('.cell');if(!c||c.classList.contains('used'))return;
  var p=c.dataset.k.split('-'),ci=+p[0],r=+p[1],cat=S.cats[ci],qa=cat[1][r],pts=(r+1)*100;
  document.getElementById('mC').textContent=cat[0]+' · '+pts;
  document.getElementById('mQ').textContent=qa[0];
  var A=document.getElementById('mA');A.textContent=qa[1];A.classList.remove('on');
  var mb=document.getElementById('mB');
  mb.innerHTML='<button class="gh" data-a="show">Réponse</button>'+st.teams.map(function(t,i){return '<button class="ok" data-a="p" data-i="'+i+'">+ '+esc(t[0])+'</button><button class="no" data-a="m" data-i="'+i+'">− '+esc(t[0])+'</button>';}).join('')+'<button class="gh" data-a="close">Fermer</button>';
  mb.onclick=function(ev){
    var x=ev.target.closest('button');if(!x)return;var a=x.dataset.a;
    if(a==='show'){A.classList.add('on');return;}
    if(a==='p'||a==='m'){st.teams[+x.dataset.i][1]+=(a==='p'?pts:-pts);x.disabled=true;persist();}
    if(a==='close'||a==='p'){st.used[c.dataset.k]=1;persist();modal.classList.remove('on');draw();}
  };
  modal.classList.add('on');
});
document.addEventListener('keydown',function(e){if(e.key==='Escape')modal.classList.remove('on');});
document.getElementById('reset').addEventListener('click',function(){if(confirm('Effacer les scores et recommencer ?')){st={used:{},teams:st.teams.map(function(t){return [t[0],0];})};persist();draw();}});
draw();
</script>
<script src="/track.js" defer></script>

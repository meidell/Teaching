# Cloudflare Worker config for the push sender. Deploy from this folder:
#   npx wrangler login
#   npx wrangler kv namespace create SUBS      → paste the id below
#   node keys.mjs                               → VAPID_PRIVATE_JWK for the next step
#   npx wrangler secret put VAPID_PRIVATE_JWK
#   npx wrangler deploy                         → prints the worker URL
name = "teaching-push"
main = "worker.js"
compatibility_date = "2025-06-01"

[[kv_namespaces]]
binding = "SUBS"
id = "PASTE_THE_ID_PRINTED_BY_wrangler_kv_namespace_create_SUBS"

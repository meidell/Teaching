*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:"Helvetica Neue",Helvetica,Arial,sans-serif;background:#0B1633;color:#fff;min-height:100vh;}

<script>

    ['Money and duplicates',[
      ['What is the ad spend of week 40 in euros, after both rules?','19,353 EUR.'],

      ['Which subscriber number should the board see, and why?','The judge: the team\'s answer from the bridge, with a reason.']]]

  s3:{name:'Session 3 · Designing ÒRBITA\'s data warehouse',cats:[
    ['Two jobs',[
      ['OLTP or OLAP: charge subscriber 10482\'s card for November.','OLTP — one row read and written, the job billing was built for.'],
      ['OLTP or OLAP: monthly churn by city and plan, for twelve months.','OLAP — one request reading a year of every subscription.'],

      ['Schema on write or schema on read: a row with no currency is rejected at load.','Schema on write — the warehouse.'],

      ['Name one open table format that turns a lake into a lakehouse.','Delta Lake, Apache Iceberg or Apache Hudi.'],

      ['The lakehouse\'s claim, in one sentence.','One copy of the data, on open files with transactions, serving both BI and machine learning.']]],

      ['Finish the sentence a grain always is: "One row …"','… per something — "one row per ride", "one row per account per month".'],

      ['Which candidate table answered none of the six questions, and why?','One row per city per day — a summary: the subscriber, the hour and the 14-day window are gone.'],
      ['Why not one row per account per day instead of per month?','Thirty times the rows (1.43 million a month) and no question on the list needed the day.'],

      ['Fact, dimension or key: km.','Fact (measure) — a number the ride produces, and it adds up.'],
      ['Fact, dimension or key: city.','Dimension — context you filter and group by.'],
      ['What is a conformed dimension? Give ÒRBITA\'s example.','A dimension shared by several fact tables — dim_city or dim_date, used by fact_ride and fact_spend.'],
      ['Anna Kowalski changes her email. Type 1 or type 2, and what happens?','Type 2 — the old row is closed (valid_to), a new one opened (valid_from); history is kept.'],
      ['Transaction, periodic snapshot or accumulating snapshot: one row per account per month.','Periodic snapshot.']]],
    ['The map',[

      ['Personal, internal or public: subscriber_id.','Personal — a pseudonymous id that can be linked back to a person is still personal data under the GDPR (Recital 26).'],
      ['The rule in ÒRBITA\'s example map for fact_ride.date_key.','Convert UTC to the city\'s local time, then take the date.'],

      ['Read out the transformation rule for one of your measures. Which Session 1 trap does it handle?','The judge: a written rule that handles a named trap (timezones, failed unlocks, email, duplicates, currencies, pauses).'],
      ['Billing has no city column. How does your design give each account one city each month?','The judge: it matches part 3 of the note: a rule, the system and column it reads, and what happens to an account that never rides.']]]
  ]},
  s2:{name:'Session 2 · KPIs that survive contact · ÒRBITA',cats:[
    ['ÒRBITA\'s two numbers',[

    ['The definition machine',[
      ['How many switches does the definition machine have?','Five: A to E.'],
      ['Switch B, "a pause is itself a churn", only works if which switch is on?','A — paused subscribers are on the books.'],
      ['Every switch on: what monthly churn does the machine show?','16.1 % — 161 ÷ 1,000.'],
      ['The lowest rate the machine can give, and the switches that give it.','2.0 % — 17 ÷ 840: only paying accounts, reversed cancellations subtracted (all switches off).'],
      ['Finish the sentence: "A definition is a set of filters on a …"','… grain. Each switch is one line of a WHERE clause over the rows.']]],
    ['Metric trees',[
      ['The four levels of a metric tree, top to bottom.','Strategic priority → outcome KPI → driver KPIs → inputs.'],
      ['The test an input has to pass.','A named person can move it by Friday.'],
      ['Outcome KPIs at the top of a tree are usually leading or lagging?','Lagging — they record the result after it has happened.'],
      ['The outcome KPI in ÒRBITA\'s example retention tree.','90-day retention of new subscribers, by city.'],
      ['Why is "improve the customer experience" not an input?','No number, no owner, and nobody can move it by Friday.']]],
    ['The KPI contract',[
      ['How many fields does a KPI contract have?','Eight.'],
      ['Name all eight fields.','Name · formula · source · grain · owner · cadence · target · counter-metric.'],
      ['What does the "grain" field say?','What one row is before it is counted (one subscriber, one ride, one ticket).'],
      ['The counter-metric for "tickets closed per day".','Tickets reopened within 7 days.'],
      ['In ÒRBITA\'s example contract, the counter-metric for 90-day retention.','Discount depth per retained subscriber — retention bought with discounts.']]],
    ['Leading · lagging · Goodhart',[
      ['Leading, lagging or vanity: total app downloads since launch.','Vanity — it only goes up and drives no decision.'],
      ['Leading, lagging or vanity: rides per new subscriber in their first 14 days.','Leading — it moves before retention does, and a city manager can act on it this week.'],
      ['State Goodhart\'s law.','When a measure becomes a target, it ceases to be a good measure.'],
      ['In the page\'s Goodhart model, full bonus on tickets closed: what happens to reopened tickets and satisfaction?','Reopened rises from 8 % to 38 %; satisfaction falls from 4.3 to 2.9 (while tickets closed rise from 120 to 192 a day).'],

var setId=(new URLSearchParams(location.search).get('set'))||'s2';
var S=SETS[setId]||SETS.s2, SK='bi_jeo_'+setId;
var IDS=['A','B','C','D','E','F','G'];
var st={used:{},teams:IDS.slice(0,6).map(function(x){return ['Team '+x,0,x];})};
try{var o=JSON.parse(localStorage.getItem(SK));if(o&&o.teams){st=o;if(st.teams.length<6)st.teams.push(['Team F',0]);st.teams.forEach(function(t,i){if(!t[2])t[2]=IDS[i];});}}catch(e){}
if(S.back){var bl=document.getElementById('backLink');bl.href=S.back;bl.textContent=S.backT||'← Course';}
/* The participants are the class's real teams (12 Nov 2026, Jan Erik: "just add the teams as participants"):
   every team with at least one member on the team board (_wall/teams), named as on the board (_wall/tn_X).
   Scores already on this device are kept by team letter. Offline, the A–F placeholders stay. */
(function(){
  var W='https://teaching-70f1c-default-rtdb.europe-west1.firebasedatabase.app/bi/_wall/';
  function j(u){return fetch(u).then(function(r){return r.ok?r.json():null;}).catch(function(){return null;});}
  function vals(o){return o?Object.keys(o).map(function(k){return o[k];}).filter(function(r){return r&&r.ts;}).sort(function(a,b){return a.ts-b.ts;}):[];}
  Promise.all([j(W+'teams.json')].concat(IDS.map(function(x){return j(W+'tn_'+x+'.json');}))).then(function(res){
    var mem={},count={},names={},old={};
    vals(res[0]).forEach(function(r){mem[r.n]=String(r.src||'').replace(/^J:/,'');});
    for(var n in mem)if(mem[n])count[mem[n]]=(count[mem[n]]||0)+1;
    IDS.forEach(function(x,i){var l=vals(res[i+1]).pop();if(l&&l.src)names[x]=String(l.src).replace(/^N:/,'').trim();});
    st.teams.forEach(function(t){old[t[2]]=t;});
    var nt=IDS.filter(function(x){return count[x];}).map(function(x){return [names[x]?names[x]:'Team '+x,old[x]?old[x][1]:0,x];});
    if(nt.length){st.teams=nt;persist();draw();}
  });
})();
function persist(){try{localStorage.setItem(SK,JSON.stringify(st));}catch(e){}}
document.getElementById('setName').textContent=S.name;
function esc(s){return String(s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];});}
function draw(){
  var b=document.getElementById('board'),h='',n=S.cats.length;
  S.cats.forEach(function(c,ci){h+='<div class="cat'+(ci===n-1&&!S.back?' own':'')+'">'+esc(c[0])+'</div>';});
  for(var r=0;r<5;r++)S.cats.forEach(function(c,ci){var k=ci+'-'+r;h+='<button class="cell'+(st.used[k]?' used':'')+'" data-k="'+k+'">'+(st.used[k]?'':(r+1)*100)+'</button>';});
  b.innerHTML=h;
  document.getElementById('teams').innerHTML=st.teams.map(function(t,i){return '<div class="team"><input value="'+esc(t[0])+'" data-i="'+i+'"><div class="sc">'+t[1]+'</div></div>';}).join('');
  document.querySelectorAll('.team input').forEach(function(inp){inp.addEventListener('change',function(){st.teams[+inp.dataset.i][0]=inp.value;persist();});});
}
var modal=document.getElementById('modal');
document.getElementById('board').addEventListener('click',function(e){
  var c=e.target.closest('.cell');if(!c||c.classList.contains('used'))return;
  var p=c.dataset.k.split('-'),ci=+p[0],r=+p[1],cat=S.cats[ci],qa=cat[1][r],pts=(r+1)*100;
  document.getElementById('mC').textContent=cat[0]+' · '+pts;
  document.getElementById('mQ').textContent=qa[0];
  var A=document.getElementById('mA');A.textContent=qa[1];A.classList.remove('on');
  var mb=document.getElementById('mB');
  mb.innerHTML='<button class="gh" data-a="show">Answer</button>'+st.teams.map(function(t,i){return '<button class="ok" data-a="p" data-i="'+i+'">+ '+esc(t[0])+'</button><button class="no" data-a="m" data-i="'+i+'">− '+esc(t[0])+'</button>';}).join('')+'<button class="gh" data-a="close">Close</button>';
  mb.onclick=function(ev){
    var x=ev.target.closest('button');if(!x)return;var a=x.dataset.a;
    if(a==='show'){A.classList.add('on');return;}
    if(a==='p'||a==='m'){st.teams[+x.dataset.i][1]+=(a==='p'?pts:-pts);x.disabled=true;persist();}
    if(a==='close'||a==='p'){st.used[c.dataset.k]=1;persist();modal.classList.remove('on');draw();}
  };
  modal.classList.add('on');
});
document.addEventListener('keydown',function(e){if(e.key==='Escape')modal.classList.remove('on');});
document.getElementById('reset').addEventListener('click',function(){if(confirm('Clear the scores and start again?')){st={used:{},teams:st.teams.map(function(t){return [t[0],0,t[2]];})};persist();draw();}});

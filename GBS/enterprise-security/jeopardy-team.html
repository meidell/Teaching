<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<base href="/GBS/enterprise-security/">
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Jeopardy · your team's answer · Enterprise Security · IIG</title>
<meta name="robots" content="noindex, nofollow">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🎲</text></svg>">
<link rel="stylesheet" href="/shared/themes/iig.css">
<link rel="stylesheet" href="esc.css">
<style>
/* =====================================================================
   Enterprise Security · the TEAMS' side of the Jeopardy (30 Oct 2026).
   One page per phone or laptop: the square the game master has opened
   (read from _wall/jeo_cur every 3 s), one box to type the team's answer
   (EscWall.post → _wall/jeo_<set>_<key>, 'T:<team>|<answer>'; any member
   may type, the newest row per team is what the master sees, and a device
   re-sending overwrites its own row), and the scoreboard the master
   publishes (_wall/jeo_score). The team comes from the board (teams.js);
   a student with no team joins one here. Sign-in = the usual pill.
   ===================================================================== */
.jt{max-width:720px;margin:0 auto;padding:18px 16px 60px;}
.jt h1{font-family:"Cormorant Garamond",Georgia,serif;font-weight:600;font-size:30px;color:var(--navy);margin:6px 0 2px;}
.jt .me{font-size:13px;color:var(--grey);margin-bottom:14px;}
.jt .me b{color:var(--navy);}
.jt .me button{font:inherit;font-size:12px;background:none;border:none;color:var(--grey);text-decoration:underline;cursor:pointer;}
.q{background:#fff;border:1.5px solid var(--line);border-radius:16px;padding:18px 20px;margin-bottom:14px;box-shadow:var(--shadow);}
.q .qc{font-size:11px;letter-spacing:1.6px;text-transform:uppercase;font-weight:800;color:var(--accent-deep);}
.q .qq{font-family:"Cormorant Garamond",Georgia,serif;font-size:24px;line-height:1.3;color:var(--navy);margin:8px 0 14px;}
.q .wait{color:var(--grey);font-size:15px;padding:18px 0;text-align:center;}
.q textarea{width:100%;min-height:96px;font:inherit;font-size:15px;color:var(--ink);background:#fff;border:1.5px solid var(--line);border-radius:10px;padding:10px 12px;resize:vertical;line-height:1.5;}
.q textarea:focus{outline:none;border-color:var(--accent);}
.q .row{display:flex;gap:10px;align-items:center;margin-top:10px;flex-wrap:wrap;}
.q .st{font-size:13px;color:var(--grey);}
.q .st.ok{color:#2F855A;font-weight:800;} .q .st.bad{color:#9B2335;font-weight:800;}
.sb{background:var(--navy-surface);color:#fff;border-radius:16px;padding:14px 18px;margin-top:14px;}
.sb .h{font-size:10.5px;letter-spacing:1.6px;text-transform:uppercase;font-weight:800;color:var(--accent-bright);margin-bottom:8px;}
.sb .r{display:flex;justify-content:space-between;padding:4px 0;border-bottom:1px solid rgba(255,255,255,.1);font-size:14px;}
.sb .r:last-child{border-bottom:none;} .sb .r.mine{font-weight:800;color:#fff;} .sb .r span:last-child{font-family:"Cormorant Garamond",Georgia,serif;font-size:20px;color:var(--accent-bright);}
.boardwrap{margin-top:14px;}
.boardwrap .hint{font-size:13px;color:var(--grey);margin-bottom:8px;}
</style>
</head>
<body data-course="escwa" data-module="w3">
<div class="topbar"><div class="topbar-inner"><picture><source srcset="iig-logo.avif" type="image/avif"><img class="brand" src="iig-logo.png" alt="IIG"></picture><span class="tb-spacer"></span><a class="home" href="week3.html">← Session 3</a></div></div>
<div class="jt">
  <h1>Jeopardy · your team's answer</h1>
  <div class="me" id="me">Loading your team…</div>
  <div class="q" id="q"><div class="wait">Waiting for the game master to open a square…</div></div>
  <div class="sb" id="sb" style="display:none"></div>
  <div class="boardwrap" id="bw" style="display:none"><div class="hint">Join your team, or move to it. Any member can rename the team and add or remove members.</div><div id="teamsBox" class="teams"></div></div>
</div>
<script src="wall.js"></script>
<script src="teams.js"></script>
<script>
(function(){
  var DB="https://teaching-70f1c-default-rtdb.europe-west1.firebasedatabase.app",W=DB+'/escwa/_wall/';
  var $=function(id){return document.getElementById(id);};
  function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];});}
  function readMod(mod){return fetch(W+encodeURIComponent(mod)+'.json').then(function(r){return r.ok?r.json():null;}).catch(function(){return null;});}
  function first(){try{var a=JSON.parse(localStorage.getItem('escwa_auth')||'null');return a&&a.name?String(a.name).trim().split(' ')[0].slice(0,40):'';}catch(e){return '';}}
  var team='',cur=null,sentFor='',showBoard=false;
  function paintMe(){
    var l=team?EscTeams.label(team):'';
    $('me').innerHTML=team?('You answer for <b>'+esc(l)+'</b> · <button id="chg">change team</button>'):(first()?'You are not in a team yet — pick yours below.':'Sign in first (the button at the bottom right), then pick your team below.');
    showBoard=!team||showBoard;$('bw').style.display=showBoard?'':'none';
    var c=$('chg');if(c)c.addEventListener('click',function(){showBoard=!showBoard;$('bw').style.display=showBoard?'':'none';});
  }
  EscTeams.mount($('teamsBox'),{onChange:function(t){var was=team;team=t||'';if(team&&team!==was)showBoard=false;paintMe();paintQ();}});
  EscTeams.onLoad(paintMe);
  /* the open square */
  function paintQ(){
    var q=$('q');
    if(!cur){q.innerHTML='<div class="wait">Waiting for the game master to open a square…</div>';return;}
    if(q.dataset.k===cur.key){teamState();return;}         /* same square: never repaint under someone typing */
    q.dataset.k=cur.key;sentFor='';
    q.innerHTML='<div class="qc">'+esc(cur.cat)+' · '+esc(cur.pts)+'</div><div class="qq">'+esc(cur.q)+'</div>'+
      '<textarea id="ans" maxlength="480" placeholder="Your team\'s answer — one of you types; you can edit and send again until the master reveals"></textarea>'+
      '<div class="row"><button class="btn" id="send">Send the team\'s answer</button><span class="st" id="st"></span></div>';
    $('send').addEventListener('click',send);
    $('ans').addEventListener('keydown',function(e){if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();send();}});
    teamState();
  }
  /* the box is always typeable; the team only decides whether Send works — it is re-checked on every poll and team change */
  function teamState(){
    var b=$('send'),st=$('st');if(!b)return;
    if(team){if(b.dataset.no){delete b.dataset.no;if(st&&st.textContent.indexOf('Join')===0)st.textContent='';}}
    else{b.dataset.no='1';if(st&&!st.textContent){st.className='st bad';st.textContent='Join a team below, then send.';}}
  }
  function send(){
    var v=($('ans').value||'').trim(),st=$('st');
    if(!team){st.className='st bad';st.textContent='Join a team below first — your text stays here.';showBoard=true;$('bw').style.display='';return;}
    if(!v){st.className='st bad';st.textContent='Type the answer first.';return;}
    st.className='st';st.textContent='Sending…';
    EscWall.post('jeo_'+cur.set+'_'+cur.key,{n:first()||'someone',src:'T:'+team+'|'+v.slice(0,470)}).then(function(r){
      if(r.ok){st.className='st ok';st.textContent='Sent ✓ · you can still edit and send again until the answer is revealed.';sentFor=cur.key;}
      else{st.className='st bad';st.textContent=r.reason==='instructor'?'Instructor device: not posted.':r.reason==='rules'?'The server refused it (rules).':'Not sent — check the connection and try again.';}
    });
  }
  function poll(){
    readMod('jeo_cur').then(function(o){
      var row=o&&o.master,m=row&&/^Q:(r\d)\|(\d-\d)\|(\d+)\|([^|]*)\|([\s\S]*)$/.exec(row.src||'');
      cur=m?{set:m[1],key:m[2],pts:m[3],cat:m[4],q:m[5]}:null;
      if(!cur)delete $('q').dataset.k;
      paintQ();
    });
    readMod('jeo_score').then(function(o){
      var row=o&&o.master,m=row&&/^S:([\s\S]*)$/.exec(row.src||'');var sb=$('sb');
      if(!m){sb.style.display='none';return;}
      var rows=m[1].split(';').map(function(p){var i=p.lastIndexOf('=');return [p.slice(0,i),+p.slice(i+1)||0];}).sort(function(a,b){return b[1]-a[1];});
      var mine=team?EscTeams.label(team).replace('Team '+team+' · ',''):'';
      sb.style.display='';sb.innerHTML='<div class="h">Scores</div>'+rows.map(function(r){return '<div class="r'+(r[0]===mine||r[0]==='Team '+team?' mine':'')+'"><span>'+esc(r[0])+'</span><span>'+r[1]+'</span></div>';}).join('');
    });
  }
  poll();setInterval(function(){if(!document.hidden)poll();},3000);
  document.addEventListener('visibilitychange',function(){if(!document.hidden)poll();});
})();
</script>
<script src="/shared/config.js"></script>
<script src="/shared/login.js" defer></script>
<script src="/shared/progress.js" defer></script>
<script src="/track.js" defer></script>
</body>
</html>

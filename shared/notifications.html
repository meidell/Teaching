<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="robots" content="noindex,follow">
<title>Notifications</title>
<!--
  SHARED · the STUDENT's notification page.   /shared/notifications.html?course=<id>[&lang=fr]

  One page for every course: it detects the device, walks the student
  through the steps that apply (on an iPhone: add to the Home Screen
  first; everywhere: sign in, then allow), subscribes the device with the
  sender (push/worker.js) for each course the device is signed in to, and
  records that in localStorage so the nudge strip on the hubs goes quiet.

  ⚠ ON AN iPHONE THIS IS THE PAGE THE STUDENT ADDS TO THE HOME SCREEN.
  iOS only delivers web push to a site on the Home Screen, and the Home
  Screen app opens on the page it was added from (the manifest sets no
  start_url on purpose). So the icon opens THIS page — which, once the
  device is subscribed, sends the student straight on to the course
  (`?stay` to stop it). The Home Screen app has its own storage: the
  student signs in again inside it, once, with "I have a code".

  Identity comes from the same place as everywhere else — `<keyPrefix>_auth`
  in localStorage, written by /shared/login.js — and login.js is loaded
  here (with `data-course` set from the URL) so the student can sign in
  on this page rather than being sent away to do it.
-->
<link rel="manifest" href="/shared/app.webmanifest">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Courses" id="appTitle">
<meta name="theme-color" content="#0a1a3a">
<link rel="apple-touch-icon" href="/assets/apple-touch-icon.png">
<link rel="icon" href="/assets/icon-192.png">
<style>
:root{--navy:#0a1a3a;--navy2:#152a5e;--gold:#D58517;--gold-deep:#A8620A;--pale:#FDF3E6;--ink:#1A1F2E;--ink2:#3D4457;--grey:#6B7280;--line:#E2E5EA;--wash:#F5F6F8;--ok:#1E7A46;--ok-l:#E3F5EA;--bad:#B42318;--bad-l:#FDE7E5;}
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:"Avenir Next","Avenir","Helvetica Neue",Arial,sans-serif;color:var(--ink);background:var(--wash);line-height:1.55;-webkit-font-smoothing:antialiased;padding-bottom:env(safe-area-inset-bottom);}
header{background:var(--navy);color:#fff;padding:calc(18px + env(safe-area-inset-top)) 20px 18px;}
header .k{font-size:11px;letter-spacing:2.5px;text-transform:uppercase;color:#F39229;font-weight:800;}
header h1{font-size:22px;line-height:1.2;margin-top:4px;}
header .c{font-size:13px;color:rgba(255,255,255,.75);margin-top:3px;}
.wrap{max-width:620px;margin:0 auto;padding:18px 16px 50px;}
.card{background:#fff;border:1px solid var(--line);border-radius:16px;padding:18px 18px 16px;margin-bottom:12px;}
.card.dim{opacity:.55;}
.card.done{border-color:#A7D7B8;background:var(--ok-l);}
.step{display:flex;gap:12px;align-items:flex-start;}
.num{flex:none;width:30px;height:30px;border-radius:50%;background:var(--navy);color:#fff;font-weight:800;display:flex;align-items:center;justify-content:center;font-size:14px;}
.done .num{background:var(--ok);}
.dim .num{background:var(--grey);}
h2{font-size:16px;line-height:1.3;margin-bottom:4px;}
p{font-size:14px;color:var(--ink2);margin-bottom:8px;}
p:last-child{margin-bottom:0;}
ol{margin:6px 0 8px 20px;font-size:14px;color:var(--ink2);} li{margin-bottom:5px;}
.btn{display:inline-block;font:inherit;font-size:14.5px;font-weight:800;color:#fff;background:var(--gold);border:none;border-radius:30px;padding:11px 18px;cursor:pointer;text-decoration:none;margin-top:6px;}
.btn.navy{background:var(--navy);}
.btn.ghost{background:#fff;color:var(--navy);border:1px solid var(--line);}
.btn:disabled{opacity:.5;cursor:default;}
.msg{display:none;border-radius:10px;padding:10px 12px;font-size:13.5px;margin-top:10px;}
.msg.ok{display:block;background:var(--ok-l);color:var(--ok);} .msg.bad{display:block;background:var(--bad-l);color:var(--bad);}
.opt{display:flex;gap:10px;align-items:center;padding:8px 0;border-top:1px dashed var(--line);font-size:14px;}
.opt:first-of-type{border-top:0;}
.opt input{width:18px;height:18px;}
.opt small{color:var(--grey);}
.share{display:inline-block;width:18px;height:18px;vertical-align:-3px;border:2px solid var(--navy);border-top:none;border-radius:0 0 3px 3px;position:relative;margin:0 2px;}
.share::after{content:"↑";position:absolute;left:50%;top:-11px;transform:translateX(-50%);font-weight:800;color:var(--navy);font-size:14px;line-height:1;}
.icon{display:inline-block;width:40px;height:40px;border-radius:9px;vertical-align:middle;margin-right:8px;background:url(/assets/icon-192.png) center/cover;}
.list{list-style:none;margin:0;} .list li{padding:6px 0;border-top:1px dashed var(--line);font-size:14px;color:var(--ink2);} .list li:first-child{border-top:0;}
details{margin-top:4px;} summary{cursor:pointer;font-weight:700;font-size:14px;color:var(--navy);padding:6px 0;}
.foot{font-size:12.5px;color:var(--grey);text-align:center;margin-top:20px;}
.foot a{color:var(--navy);}
</style>
</head>
<body>
<script>
/* the course comes from the URL and must be on <body> BEFORE config.js
   reads it; the sign-in prompt is ours to open, not automatic */
(function(){
  var q=new URLSearchParams(location.search), c=(q.get('course')||'').replace(/[^a-z0-9-]/gi,'');
  if(c)document.body.setAttribute('data-course',c);
  window.COURSE_LOGIN_AUTO=false;
  if(q.get('lang'))window.COURSE_LANG=q.get('lang')==='fr'?'fr':'en';
})();
</script>

<header>
  <div class="k" id="hk">Notifications</div>
  <h1 id="ht">Get notified on your phone and your computer</h1>
  <div class="c" id="hc"></div>
</header>

<div class="wrap">
  <div id="app"><div class="card"><p>…</p></div></div>
  <div class="foot" id="foot"></div>
</div>

<script src="/shared/config.js"></script>
<script src="/shared/push.js"></script>
<script src="/shared/login.js" defer></script>
<script>
(function(){
  var Q=new URLSearchParams(location.search), COURSE=(Q.get('course')||'').replace(/[^a-z0-9-]/gi,''), STAY=Q.has('stay');
  var REG=null, C=null, LANG='en', CFG=null, SUB=null, BUSY=false;
  var T={
    en:{
      k:'Notifications', title:'Get notified on your phone and your computer', forc:'for ', generic:'for the courses you are signed in to',
      what:'What you will receive', w1:'An announcement from your instructor, the moment it is posted.', w2:'A reply from your instructor to a message you sent.', w3:'Nothing else — no reminders, no marketing. Messages between students are never pushed.',
      unavailable:'Not available yet', unavailableD:'Notifications are not switched on for the site at the moment. Everything else works as usual; come back to this page later.',
      unsupported:'This browser cannot receive notifications', unsIos:'On an iPhone or iPad, open this page in <b>Safari</b> — not inside another app — and add it to the Home Screen (step 1 below).', unsDesk:'Use Chrome, Edge, Firefox, or Safari 16 or later, and open this page there.',
      s1:'Add this page to your Home Screen', s1d:'iPhones only deliver web notifications to a site that sits on the Home Screen, like an app. Once:',
      s1a:'Tap <b>Share</b> <span class="share"></span> at the bottom of Safari.', s1b:'Choose <b>Add to Home Screen</b>, then <b>Add</b>.', s1c:'Open it <b>from the new icon</b> <span class="icon"></span> and continue there — the next steps are waiting for you.',
      s2:'Sign in', s2d:'So the notifications are yours: the same name and six-digit code you use on the course page. Inside the Home Screen app this is asked once more, because it keeps its own memory.', s2b:'Sign in', s2done:'Signed in as ',
      s2none:'This device is not signed in to any course yet. Open a course page, sign in there, and come back.',
      s3:'Turn notifications on', s3d:'Your browser will ask for permission; choose <b>Allow</b>. One tap covers every course ticked below.', s3b:'🔔 Turn on', s3busy:'Asking…',
      on:'Notifications are on', onD:'This device will be told about announcements and replies in: ', open:'Open ', opening:'Opening ', stay:'stay here', off:'Turn off on this device',
      comp:'On a computer', compD:'Nothing to install. In Chrome, Edge, Firefox or Safari, sign in and press <b>Turn on</b>. On a Mac, if Chrome never shows them, check System Settings → Notifications → Google Chrome.',
      trouble:'Nothing arrives?', t1:'iPhone: Settings → Notifications → find the app (the Home Screen icon) and allow them; check Focus modes.', t2:'Computer: the browser’s site settings for janerikmeidell.com → Notifications → Allow.', t3:'Still nothing: press <b>Turn off</b> here, then <b>Turn on</b> again.',
      notconfigured:'Notifications are not set up on the site yet.', denied:'Permission was refused. Allow notifications for this site in the settings, then try again.'
    },
    fr:{
      k:'Notifications', title:'Recevez les notifications sur votre téléphone et votre ordinateur', forc:'pour ', generic:'pour les cours où vous êtes connecté·e',
      what:'Ce que vous recevrez', w1:'Une annonce de l’enseignant, dès qu’elle est publiée.', w2:'Une réponse de l’enseignant à un message que vous avez envoyé.', w3:'Rien d’autre — ni rappels, ni publicité. Les messages entre étudiants ne sont jamais envoyés.',
      unavailable:'Pas encore disponible', unavailableD:'Les notifications ne sont pas activées sur le site pour le moment. Tout le reste fonctionne ; revenez plus tard sur cette page.',
      unsupported:'Ce navigateur ne peut pas recevoir de notifications', unsIos:'Sur iPhone ou iPad, ouvrez cette page dans <b>Safari</b> — pas dans une autre application — et ajoutez-la à l’écran d’accueil (étape 1).', unsDesk:'Utilisez Chrome, Edge, Firefox ou Safari 16 ou plus récent, et ouvrez cette page là.',
      s1:'Ajoutez cette page à l’écran d’accueil', s1d:'Un iPhone ne livre les notifications web qu’à un site placé sur l’écran d’accueil, comme une app. Une seule fois :',
      s1a:'Touchez <b>Partager</b> <span class="share"></span> en bas de Safari.', s1b:'Choisissez <b>Sur l’écran d’accueil</b>, puis <b>Ajouter</b>.', s1c:'Ouvrez-la <b>depuis la nouvelle icône</b> <span class="icon"></span> et continuez là — les étapes suivantes vous attendent.',
      s2:'Connectez-vous', s2d:'Pour que les notifications soient les vôtres : le même nom et le même code à six chiffres que sur la page du cours. Dans l’app de l’écran d’accueil, on vous le redemande une fois, car elle a sa propre mémoire.', s2b:'Se connecter', s2done:'Connecté·e : ',
      s2none:'Cet appareil n’est connecté à aucun cours. Ouvrez une page de cours, connectez-vous, puis revenez ici.',
      s3:'Activez les notifications', s3d:'Le navigateur demandera une autorisation ; choisissez <b>Autoriser</b>. Un seul geste pour tous les cours cochés.', s3b:'🔔 Activer', s3busy:'Demande…',
      on:'Les notifications sont activées', onD:'Cet appareil sera prévenu des annonces et des réponses dans : ', open:'Ouvrir ', opening:'Ouverture de ', stay:'rester ici', off:'Désactiver sur cet appareil',
      comp:'Sur un ordinateur', compD:'Rien à installer. Dans Chrome, Edge, Firefox ou Safari, connectez-vous et pressez <b>Activer</b>. Sur Mac, si Chrome n’affiche rien, vérifiez Réglages système → Notifications → Google Chrome.',
      trouble:'Rien n’arrive ?', t1:'iPhone : Réglages → Notifications → trouvez l’app (l’icône de l’écran d’accueil) et autorisez-les ; vérifiez les modes Concentration.', t2:'Ordinateur : réglages du site janerikmeidell.com dans le navigateur → Notifications → Autoriser.', t3:'Toujours rien : pressez <b>Désactiver</b> ici, puis <b>Activer</b> à nouveau.',
      notconfigured:'Les notifications ne sont pas encore installées côté site.', denied:'Autorisation refusée. Autorisez les notifications pour ce site dans les réglages, puis réessayez.'
    }
  };
  function t(k){ return (T[LANG]||T.en)[k]||k; }
  function esc(x){ return String(x==null?'':x).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
  function titleOf(c){ return c ? ((c.title&&(c.title[LANG]||c.title.en||c.title.fr))||c.code||c.id) : ''; }
  function homeOf(c){ return c ? '/'+encodeURI(String(c.home||'')) : '/'; }
  function course(id){ return (REG&&REG.courses||[]).filter(function(c){return c.id===id;})[0]||null; }
  /* every course this device is signed in to — the same keys login.js writes */
  function identities(){
    var out=[];
    (REG&&REG.courses||[]).forEach(function(c){
      if(!c.ns||(c.features||[]).indexOf('login')<0)return;
      var a=null; try{a=JSON.parse(localStorage.getItem((c.keyPrefix||c.id)+'_auth')||'null');}catch(e){}
      if(a&&a.sid)out.push({c:c,sid:a.sid,name:a.name||a.sid});
    });
    /* the current course first */
    out.sort(function(a,b){return (a.c.id===COURSE?-1:0)-(b.c.id===COURSE?-1:0);});
    return out;
  }
  function onFor(){ var r=JEMPush.remembered(); return (REG&&REG.courses||[]).filter(function(c){return c.ns&&r[c.ns];}); }

  function card(cls,num,title,body){ return '<div class="card '+cls+'"><div class="step"><div class="num">'+num+'</div><div style="flex:1;min-width:0"><h2>'+title+'</h2>'+body+'</div></div></div>'; }

  function render(){
    var app=document.getElementById('app'), html='';
    var p=JEMPush.platform(), sup=JEMPush.supported(), need=JEMPush.needsInstall();
    var ids=identities(), on=onFor(), mine=COURSE?ids.filter(function(i){return i.c.id===COURSE;})[0]:null;
    var subscribedHere = !!SUB && on.length>0;

    if(!CFG||!CFG.on||!CFG.url||!CFG.key){
      html+=card('','!',t('unavailable'),'<p>'+t('unavailableD')+'</p>');
    }else if(subscribedHere){
      html+=card('done','✓',t('on'),'<p>'+t('onD')+'<b>'+on.map(titleOf).map(esc).join('</b>, <b>')+'</b>.</p>'+
        (C?'<a class="btn navy" id="bOpen" href="'+homeOf(C)+'">'+t('open')+esc(titleOf(C))+' →</a> ':'')+
        '<button class="btn ghost" id="bOff">'+t('off')+'</button><div class="msg" id="m3"></div>');
      /* add a course this device is signed in to but has not subscribed */
      var more=ids.filter(function(i){return !JEMPush.remembered()[i.c.ns];});
      if(more.length) html+=card('','+',t('s3'),opts(more)+'<button class="btn" id="bOn">'+t('s3b')+'</button><div class="msg" id="m2"></div>');
    }else if(!sup){
      html+=card('','!',t('unsupported'),'<p>'+(p.ios?t('unsIos'):t('unsDesk'))+'</p>');
      if(p.ios&&!p.standalone) html+=step1();
    }else if(need){
      html+=step1();
      html+=card('dim','2',t('s2'),'<p>'+t('s2d')+'</p>');
      html+=card('dim','3',t('s3'),'<p>'+t('s3d')+'</p>');
    }else{
      if(p.ios) html+=card('done','✓',t('s1'),'');
      var n=p.ios?2:1;
      if(COURSE&&!mine){
        html+=card('',n,t('s2'),'<p>'+t('s2d')+'</p><button class="btn navy" id="bSign">'+t('s2b')+'</button>');
        html+=card('dim',n+1,t('s3'),'<p>'+t('s3d')+'</p>');
      }else if(!ids.length){
        html+=card('',n,t('s2'),'<p>'+t('s2none')+'</p>');
        html+=card('dim',n+1,t('s3'),'<p>'+t('s3d')+'</p>');
      }else{
        html+=card('done','✓',t('s2'),'<p>'+t('s2done')+'<b>'+esc(ids[0].name)+'</b></p>');
        html+=card('',n+1,t('s3'),'<p>'+t('s3d')+'</p>'+opts(ids)+'<button class="btn" id="bOn">'+t('s3b')+'</button><div class="msg" id="m2"></div>');
      }
    }
    html+='<div class="card"><h2>'+t('what')+'</h2><ul class="list"><li>📣 '+t('w1')+'</li><li>💬 '+t('w2')+'</li><li>🤫 '+t('w3')+'</li></ul></div>';
    html+='<div class="card"><details><summary>'+t('comp')+'</summary><p>'+t('compD')+'</p></details><details><summary>'+t('trouble')+'</summary><ol><li>'+t('t1')+'</li><li>'+t('t2')+'</li><li>'+t('t3')+'</li></ol></details></div>';
    app.innerHTML=html;
    wire();
    /* the Home Screen app opens here; once subscribed, go on to the course */
    if(subscribedHere&&C&&p.standalone&&!STAY&&JEMPush.remembered()[C.ns]){
      var b=document.getElementById('bOpen'); if(b){ b.textContent=t('opening')+titleOf(C)+'…'; }
      var m=document.getElementById('m3'); if(m){ m.className='msg ok'; m.innerHTML='<a href="?course='+encodeURIComponent(COURSE)+'&stay=1" style="color:inherit">'+t('stay')+'</a>'; }
      setTimeout(function(){ location.replace(homeOf(C)); }, 900);
    }
  }
  function step1(){ return card('','1',t('s1'),'<p>'+t('s1d')+'</p><ol><li>'+t('s1a')+'</li><li>'+t('s1b')+'</li><li>'+t('s1c')+'</li></ol>'); }
  function opts(list){
    return list.map(function(i,k){ return '<label class="opt"><input type="checkbox" data-id="'+esc(i.c.id)+'" '+(k===0||i.c.id===COURSE?'checked':'')+'> <span>'+esc(titleOf(i.c))+' <small>· '+esc(i.name)+'</small></span></label>'; }).join('');
  }
  function say(id,msg,cls){ var m=document.getElementById(id); if(!m)return; m.className='msg '+cls; m.textContent=msg; }

  function wire(){
    var s=document.getElementById('bSign'); if(s) s.addEventListener('click',function(){ if(window.CourseLogin&&CourseLogin.open)CourseLogin.open(); });
    var on=document.getElementById('bOn'); if(on) on.addEventListener('click',turnOn);
    var off=document.getElementById('bOff'); if(off) off.addEventListener('click',turnOff);
  }
  function turnOn(){
    if(BUSY)return; BUSY=true;
    var b=document.getElementById('bOn'); b.disabled=true; b.textContent=t('s3busy');
    var picked=[].slice.call(document.querySelectorAll('#app input[data-id]:checked')).map(function(i){return i.getAttribute('data-id');});
    var ids=identities().filter(function(i){return picked.indexOf(i.c.id)>=0;});
    if(!ids.length){ BUSY=false; b.disabled=false; b.textContent=t('s3b'); return; }
    JEMPush.subscribe().then(function(sub){
      SUB=sub;
      return Promise.all(ids.map(function(i){
        return JEMPush.post('/student/subscribe',{ns:i.c.ns,sid:i.sid,sub:sub.toJSON(),ua:navigator.userAgent})
          .then(function(){ JEMPush.remember(i.c.ns,true); return null; }, function(e){ return titleOf(i.c)+': '+String(e.message||e); });
      }));
    }).then(function(errs){
      var bad=errs.filter(Boolean);
      if(bad.length) say('m2',bad.join(' · '),'bad');
      render();
    }).catch(function(e){ say('m2',JEMPush.explain(e,LANG),'bad'); b.disabled=false; b.textContent=t('s3b'); }).then(function(){ BUSY=false; });
  }
  function turnOff(){
    var b=document.getElementById('bOff'); b.disabled=true;
    var ep=SUB?SUB.endpoint:'';
    var ids=identities().filter(function(i){return JEMPush.remembered()[i.c.ns];});
    Promise.all(ids.map(function(i){ return JEMPush.post('/student/unsubscribe',{ns:i.c.ns,sid:i.sid,endpoint:ep}).catch(function(){}); }))
      .then(function(){ return JEMPush.unsubscribe().catch(function(){}); })
      .then(function(){ (REG.courses||[]).forEach(function(c){ if(c.ns)JEMPush.remember(c.ns,false); }); SUB=null; render(); });
  }

  function head(){
    document.getElementById('hk').textContent=t('k');
    document.getElementById('ht').textContent=t('title');
    document.getElementById('hc').textContent=C?t('forc')+titleOf(C):t('generic');
    document.title=t('k')+(C?' · '+titleOf(C):'');
    var short=C?(C.code||titleOf(C)):'Courses';
    document.getElementById('appTitle').setAttribute('content',String(short).slice(0,30));
    document.getElementById('foot').innerHTML=(C?'<a href="'+homeOf(C)+'">← '+esc(titleOf(C))+'</a>':'')+' · janerikmeidell.com';
  }

  Promise.all([window.CourseConfig.load(), JEMPush.cfg()]).then(function(r){
    REG=r[0]; CFG=r[1]; C=course(COURSE);
    LANG=(Q.get('lang')==='fr'||(!Q.get('lang')&&C&&C.lang==='fr'))?'fr':'en';
    document.documentElement.lang=LANG;
    head();
    return JEMPush.current();
  }).then(function(sub){ SUB=sub; render(); })
  .catch(function(e){ document.getElementById('app').innerHTML='<div class="card"><p>'+esc(String(e&&e.message||e))+'</p></div>'; });

  /* login.js writes the identity without telling us; look again when
     the tab comes back or a second later */
  var last=''; setInterval(function(){ var k=identities().map(function(i){return i.c.id+':'+i.sid;}).join(','); if(REG&&k!==last){ last=k; render(); } },1200);
})();
</script>
<script src="/track.js" defer></script>
</body>
</html>

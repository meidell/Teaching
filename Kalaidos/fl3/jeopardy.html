<!doctype html>
<html lang="fr">
<head>
<meta charset="UTF-8" />
<base href="/Kalaidos/fl3/">
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Jeopardy · FL III · Kalaidos</title>
<meta name="robots" content="noindex, nofollow">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🎲</text></svg>">
<link rel="stylesheet" href="/shared/themes/kalaidos-full.css">
<link rel="stylesheet" href="/Kalaidos/kalaidos.css">
<script src="lang.js"></script>
<style>
/* =====================================================================
   Kalaidos FL III · Jeopardy for the room screen. ?set=sam (révision des séances 1–6, Saturday 21 Nov) · ?set=rev (révision finale, séance 10). Projector page: no
   progress, no sign-in, never counted; scores are kept in this browser
   only (fl3_jeo_<set>). Two players — the cohort is two students.
   ===================================================================== */
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:"Helvetica Neue",Helvetica,Arial,sans-serif;background:var(--navy-surface-deep,#073C43);color:#fff;min-height:100vh;}
.top{display:flex;align-items:center;gap:14px;padding:14px 20px;}
.top h1{font-family:Georgia,serif;font-size:24px;}
.top .sub{color:#9FDCE3;font-size:13px;}
.top a{color:#9FDCE3;font-size:13px;text-decoration:none;}
.board{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;padding:0 20px;}
.cat{background:var(--navy-surface,#0F4C60);border-radius:10px;padding:12px 8px;text-align:center;font-weight:800;font-size:clamp(12px,1.6vw,17px);min-height:64px;display:flex;align-items:center;justify-content:center;text-transform:uppercase;letter-spacing:.5px;}
.cell{background:#176B87;border:none;border-radius:10px;color:#FFD58A;font:800 clamp(20px,3.4vw,40px)/1 Georgia,serif;min-height:clamp(60px,11vh,110px);cursor:pointer;transition:.15s;}
.cell:hover{background:#2A93B0;}
.cell.used{background:rgba(255,255,255,.06);color:rgba(255,255,255,.18);cursor:default;}
.teams{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;padding:18px 20px 30px;}
.team{background:rgba(255,255,255,.08);border-radius:12px;padding:10px 16px;text-align:center;min-width:170px;}
.team input{background:transparent;border:none;border-bottom:1px dashed rgba(255,255,255,.35);color:#fff;font:800 15px inherit;text-align:center;width:100%;}
.team .sc{font:800 34px Georgia,serif;color:#FFD58A;margin-top:4px;}
#modal{position:fixed;inset:0;background:rgba(5,25,32,.94);display:none;align-items:center;justify-content:center;padding:30px;z-index:10;}
#modal.on{display:flex;}
#modal .box{max-width:980px;width:100%;text-align:center;}
#modal .mc{color:#9FDCE3;font-size:15px;letter-spacing:2px;text-transform:uppercase;font-weight:800;}
#modal .mq{font:700 clamp(24px,3.8vw,44px)/1.25 Georgia,serif;margin:20px 0 26px;}
#modal .ma{display:none;font-size:clamp(18px,2.4vw,28px);color:#FFD58A;line-height:1.4;margin-bottom:26px;}
#modal .ma.on{display:block;}
.mb{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;}
.mb button{background:#fff;color:#073C43;border:none;border-radius:30px;padding:11px 20px;font:800 15px inherit;cursor:pointer;}
.mb button.ok{background:#2F855A;color:#fff;} .mb button.no{background:#9B2335;color:#fff;} .mb button.gh{background:transparent;color:#fff;border:1px solid rgba(255,255,255,.5);}
.foot{text-align:center;font-size:12px;color:#9FDCE3;padding-bottom:20px;}
.foot button{background:none;border:none;color:#9FDCE3;text-decoration:underline;cursor:pointer;font:inherit;}
body,.top h1,.cell,.cat,button,input{font-family:'Barlow','Helvetica Neue',Arial,sans-serif !important;}
</style>
</head>
<body data-course="fl3">
<div class="top"><h1>Jeopardy</h1><span class="sub" id="setName"></span><a href="index.html" style="margin-left:auto">← Cours</a></div>
<div class="board" id="board"></div>
<div class="teams" id="teams"></div>
<div class="foot">Cliquez une case · « Réponse » · puis le joueur qui a répondu juste (+) ou faux (−). <button id="reset">Nouvelle partie</button></div>
<div id="modal"><div class="box"><div class="mc" id="mC"></div><div class="mq" id="mQ"></div><div class="ma" id="mA"></div><div class="mb" id="mB"></div></div></div>
<script>
var SETS={
  sam:{name:'Révision des séances 1 à 4 · samedi 21 novembre',cats:[
    ['Créer',[
      ['Le capital minimum d’une SA, et l’article.','CHF 100\'000, art. 621 CO.'],
      ['Le minimum à libérer à la fondation d’une SA.','20 % de chaque action et au moins CHF 50\'000 au total (art. 632 CO).'],
      ['Les deux documents qu’exige un apport en nature.','Le rapport de fondation (art. 635 CO) et l’attestation de vérification d’un réviseur agréé (art. 635a CO).'],
      ['Où va l’agio d’une émission au-dessus du pair ?','À la réserve légale issue du capital (art. 671 CO).'],
      ['Quand la SA acquiert-elle la personnalité juridique ?','À son inscription au registre du commerce (art. 643 CO).']]],
    ['Transformer',[
      ['La loi qui régit la transformation, et ses articles.','La loi sur la fusion (LFus), art. 53 ss.'],
      ['Une Sàrl au capital de 20\'000 peut-elle devenir une SA sans autre mesure ?','Non : il faut porter le capital à 100\'000 (conversion de fonds propres librement disponibles ou apport nouveau).'],
      ['Dans un bilan de transformation, à quoi sont portés les actifs ?','Aux valeurs économiques effectives : les réserves latentes sont dissoutes, un goodwill peut être reconnu.'],
      ['À quelle condition la transformation est-elle fiscalement neutre ?','Reprise des valeurs déterminantes pour l’impôt et maintien de l’assujettissement en Suisse (art. 19 LIFD pour une entreprise de personnes, 61 LIFD pour une personne morale).'],
      ['Transformer, est-ce liquider ?','Non : la société change de forme sans être dissoute ; actifs, dettes et contrats restent.']]],
    ['Fusionner',[
      ['Action absorbée 1\'500, action absorbante 1\'000 : rapport d’échange ?','3 actions absorbantes pour 2 absorbées (1,5).'],
      ['Le plafond de la soulte en espèces.','10 % de la valeur réelle des parts attribuées (art. 7 al. 2 LFus).'],
      ['Où va l’agio de fusion ?','À la réserve légale issue du capital.'],
      ['Absorption ou combinaison : la différence.','Absorption : une société existante reprend l’autre ; combinaison : les deux disparaissent dans une société nouvelle (art. 3 LFus).'],
      ['Trois façons de réduire la valeur d’une action avant la fusion.','Actions gratuites, dividende supplémentaire, augmentation de capital à un prix d’émission inférieur à la valeur intrinsèque.']]],
    ['Scinder et transférer',[
      ['Scission : la société qui se scinde subsiste. Comment s’appelle-t-elle ?','Une scission par séparation (en division, elle disparaît) — art. 29 LFus.'],
      ['Quelles sociétés peuvent se scinder ?','Les sociétés de capitaux et les coopératives (art. 30 LFus).'],
      ['Deux éléments du contrat de scission.','L’inventaire des actifs et passifs attribués, le rapport d’échange, les rapports de travail transférés… (art. 37 LFus).'],
      ['La différence essentielle entre scission et transfert de patrimoine.','Dans le transfert, la contrepartie va à la société qui transfère, pas à ses associés ; ils ne reçoivent aucune part.'],
      ['Scission symétrique ou asymétrique ?','Symétrique : chaque associé reçoit des parts de toutes les sociétés dans la même proportion ; asymétrique : les associés se répartissent les sociétés.']]],
    ['La LFus',[
      ['Les quatre opérations que règle la loi sur la fusion.','Fusion, scission, transformation, transfert de patrimoine.'],
      ['Combien de temps les créanciers ont-ils pour exiger des sûretés après une fusion ?','Trois mois après la publication de l’inscription (art. 25 LFus).'],
      ['La majorité requise à l’assemblée générale d’une SA pour une fusion.','Deux tiers des voix représentées et la majorité absolue des valeurs nominales représentées (art. 18 LFus).'],
      ['Quand la fusion devient-elle effective ?','À l’inscription au registre du commerce : le patrimoine passe de plein droit, l’absorbée est radiée (art. 21–22 LFus).'],
      ['Les PME peuvent renoncer au rapport et à la vérification de fusion à une condition.','L’accord de tous les associés.']]]
  ]},
  rev:{name:'Révision des dix séances · avant l’examen',cats:[
    ['Naître et changer de forme',[
      ['S. Pereira souscrit 100 actions de 1\'000 et en libère 40 %. Écriture du solde non versé.','Capital-actions non libéré à Actionnaires, 60\'000.'],
      ['Les frais de fondation : actif ou charge ?','Une charge, jamais activée.'],
      ['Un bilan de transformation reconnaît un goodwill de 85\'000. Que représente-t-il ?','La valeur du portefeuille clients, du savoir-faire — l’excédent de la valeur en exploitation sur l’actif net.'],
      ['Quelle réserve ne peut pas être convertie en capital lors d’une transformation ?','La réserve légale issue du bénéfice : elle n’est pas librement disponible.'],
      ['Actif net repris 900\'000, 1\'200 actions nouvelles de 500. Agio de fusion ?','300\'000, à la réserve légale issue du capital.']]],
    ['Assainir et liquider',[
      ['Le test de la perte de capital.','Fonds propres inférieurs à la moitié de capital-actions + réserves légales (art. 725a CO).'],
      ['Ce que le conseil doit faire en cas de surendettement.','Aviser le tribunal (art. 725b CO), sauf postposition suffisante ou perspective concrète d’assainissement dans les 90 jours.'],
      ['Quels actifs peut-on réévaluer selon l’art. 725c CO ?','Les immeubles et les participations, jusqu’à leur valeur réelle, en réserve de réévaluation.'],
      ['Combien de publications de l’appel aux créanciers, et quel délai avant la répartition ?','Une publication dans la FOSC ; un an (trois mois avec l’attestation d’un expert-réviseur agréé, art. 745 CO).'],
      ['Liquidités à répartir 108, capital 50. Impôt anticipé ?','35 % × 58 = 20,3.']]],
    ['Évaluer',[
      ['La formule de la méthode des praticiens.','(2 × valeur de rendement + valeur substantielle) ÷ 3.'],
      ['Bénéfice durable 300\'000, taux 12 %. Valeur de rendement ?','2\'500\'000.'],
      ['EBITDA 800\'000, multiple 7, dettes nettes 1\'600\'000. Fonds propres ?','4\'000\'000.'],
      ['L’EVA, en une ligne.','NOPAT − WACC × capital investi.'],
      ['Pourquoi présenter une fourchette plutôt qu’un chiffre ?','Les méthodes reposent sur des hypothèses différentes ; le rapport documente les écarts et dit ce qu’il retient pour quelle décision.']]],
    ['Consolider',[
      ['Les trois seuils de l’art. 963a CO.','Bilan 20 millions, chiffre d’affaires 40 millions, 250 emplois à plein temps — deux sur trois, deux exercices de suite.'],
      ['Prix 400 pour 80 % de fonds propres de 320. Goodwill ?','144.'],
      ['Au BC 2, une réserve latente qui existait à l’acquisition va…','Aux réserves issues du capital.'],
      ['Stock interne 40 → 60, marge 25 %. Effet sur le résultat de l’année ?','−5 (bénéfice intermédiaire de 10 à 15).'],
      ['Dividende de 30 d’une filiale à 80 % : montant éliminé chez la mère ?','24, contre les réserves.']]],
    ['Mettre en équivalence et réviser',[
      ['Mise en équivalence : 450 + 45 − 18 − 18. Que sont les deux 18 ?','Le dividende reçu et l’amortissement du goodwill compris.'],
      ['40 % des voix et la majorité du conseil par convention : méthode ?','Consolidation intégrale (contrôle).'],
      ['Coentreprise à 50 % : deux méthodes admises par RPC 30.','Consolidation proportionnelle ou mise en équivalence.'],
      ['Les deux traitements du goodwill selon RPC 30.','Activer et amortir (en général 5 ans, 20 au plus) ou compenser avec les fonds propres à l’acquisition.'],
      ['L’examen : date, durée, aides.','Lundi 25 janvier 2027, Inspera, 120 minutes, 120 points, open book + calculatrice.']]]
  ]}
};
var setId=(new URLSearchParams(location.search).get('set'))||'sam';
var S=SETS[setId]||SETS.sam, SK='fl3_jeo_'+setId;
var st={used:{},teams:[['Joueur 1',0],['Joueur 2',0]]};
try{var o=JSON.parse(localStorage.getItem(SK));if(o&&o.teams)st=o;}catch(e){}
function persist(){try{localStorage.setItem(SK,JSON.stringify(st));}catch(e){}}
document.getElementById('setName').textContent=S.name;
function esc(s){return String(s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];});}
function draw(){
  var b=document.getElementById('board'),h='';
  S.cats.forEach(function(c){h+='<div class="cat">'+esc(c[0])+'</div>';});
  for(var r=0;r<5;r++)S.cats.forEach(function(c,ci){var k=ci+'-'+r;h+='<button class="cell'+(st.used[k]?' used':'')+'" data-k="'+k+'">'+(st.used[k]?'':(r+1)*100)+'</button>';});
  b.innerHTML=h;
  document.getElementById('teams').innerHTML=st.teams.map(function(t,i){return '<div class="team"><input value="'+esc(t[0])+'" data-i="'+i+'"><div class="sc">'+t[1]+'</div></div>';}).join('');
  document.querySelectorAll('.team input').forEach(function(inp){inp.addEventListener('change',function(){st.teams[+inp.dataset.i][0]=inp.value;persist();});});
}
var modal=document.getElementById('modal');
document.getElementById('board').addEventListener('click',function(e){
  var c=e.target.closest('.cell');if(!c||c.classList.contains('used'))return;
  var p=c.dataset.k.split('-'),ci=+p[0],r=+p[1],cat=S.cats[ci],qa=cat[1][r],pts=(r+1)*100;
  document.getElementById('mC').textContent=cat[0]+' · '+pts;
  document.getElementById('mQ').textContent=qa[0];
  var A=document.getElementById('mA');A.textContent=qa[1];A.classList.remove('on');
  var mb=document.getElementById('mB');
  mb.innerHTML='<button class="gh" data-a="show">Réponse</button>'+st.teams.map(function(t,i){return '<button class="ok" data-a="p" data-i="'+i+'">+ '+esc(t[0])+'</button><button class="no" data-a="m" data-i="'+i+'">− '+esc(t[0])+'</button>';}).join('')+'<button class="gh" data-a="close">Fermer</button>';
  mb.onclick=function(ev){
    var x=ev.target.closest('button');if(!x)return;var a=x.dataset.a;
    if(a==='show'){A.classList.add('on');return;}
    if(a==='p'||a==='m'){st.teams[+x.dataset.i][1]+=(a==='p'?pts:-pts);x.disabled=true;persist();}
    if(a==='close'||a==='p'){st.used[c.dataset.k]=1;persist();modal.classList.remove('on');draw();}
  };
  modal.classList.add('on');
});
document.addEventListener('keydown',function(e){if(e.key==='Escape')modal.classList.remove('on');});
document.getElementById('reset').addEventListener('click',function(){if(confirm('Effacer les scores et recommencer ?')){st={used:{},teams:st.teams.map(function(t){return [t[0],0];})};persist();draw();}});
draw();
</script>
<script src="/track.js" defer></script>
</body>
</html>
